nt-size="11" text-anchor="start">婆さん「昔…」</text><text x="462" y="504" font-size="11" text-anchor="end">最後の守り手</text><circle cx="926" cy="528" r="5"/><path d="M926 528 L104 528" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="934" y="524" font-size="11" text-anchor="start">保存食</text><text x="94" y="524" font-size="11" text-anchor="end">力を分けて届ける</text><circle cx="650" cy="548" r="5"/><path d="M650 548 L196 548" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="658" y="544" font-size="11" text-anchor="start">「ユーゴも食べて」</text><text x="186" y="544" font-size="11" text-anchor="end">母の願い</text><circle cx="558" cy="568" r="5"/><path d="M558 568 L288 568" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="566" y="564" font-size="11" text-anchor="start">休憩欄の空白</text><text x="278" y="564" font-size="11" text-anchor="end">ルカが書き直す</text><circle cx="282" cy="588" r="5"/><path d="M282 588 L104 588" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="290" y="584" font-size="11" text-anchor="start">父の味噌汁</text><text x="94" y="584" font-size="11" text-anchor="end">冬至の一杯</text><circle cx="742" cy="608" r="5"/><path d="M742 608 L104 608" stroke="#000" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="750" y="604" font-size="11" text-anchor="start">黒衣の男</text><text x="94" y="604" font-size="11" text-anchor="end">第二章へ</text><text x="1748" y="635" font-size="16" text-anchor="end" font-weight="bold">人物の弧</text><line x1="20" y1="670" x2="1740" y2="670" stroke="#bbb" stroke-dasharray="4 4"/><text x="1700" y="695" font-size="14" text-anchor="end" font-weight="bold">湯吾</text><rect x="1435.0" y="677.0" width="190" height="26" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="1530" y="694.2" font-size="12" text-anchor="middle" fill="#000">自分を削る</text><rect x="255.0" y="677.0" width="330" height="26" rx="6" fill="#000" stroke="#000" stroke-width="2"/><text x="420" y="694.2" font-size="12" text-anchor="middle" fill="#fff">休憩を受け入れ、みんなで間に合わせる</text><line x1="1434" y1="690" x2="587" y2="690" stroke="#000" stroke-width="2"  marker-end="url(#a)"/><text x="1700" y="727" font-size="14" text-anchor="end" font-weight="bold">ルカ</text><rect x="1435.0" y="709.0" width="190" height="26" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="1530" y="726.2" font-size="12" text-anchor="middle" fill="#000">警戒</text><rect x="255.0" y="709.0" width="330" height="26" rx="6" fill="#000" stroke="#000" stroke-width="2"/><text x="420" y="726.2" font-size="12" text-anchor="middle" fill="#fff">相棒→王都の学校へ</text><line x1="1434" y1="722" x2="587" y2="722" stroke="#000" stroke-width="2"  marker-end="url(#a)"/><text x="1700" y="759" font-size="14" text-anchor="end" font-weight="bold">グレタ</text><rect x="1435.0" y="741.0" width="190" height="26" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="1530" y="758.2" font-size="12" text-anchor="middle" fill="#000">逃げた守り手</text><rect x="255.0" y="741.0" width="330" height="26" rx="6" fill="#000" stroke="#000" stroke-width="2"/><text x="420" y="758.2" font-size="12" text-anchor="middle" fill="#fff">守り手に戻る</text><line x1="1434" y1="754" x2="587" y2="754" stroke="#000" stroke-width="2"  marker-end="url(#a)"/><text x="1700" y="791" font-size="14" text-anchor="end" font-weight="bold">セイル</text><rect x="1435.0" y="773.0" width="190" height="26" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="1530" y="790.2" font-size="12" text-anchor="middle" fill="#000">移送を推進</text><rect x="255.0" y="773.0" width="330" height="26" rx="6" fill="#000" stroke="#000" stroke-width="2"/><text x="420" y="790.2" font-size="12" text-anchor="middle" fill="#fff">分けて届ける</text><line x1="1434" y1="786" x2="587" y2="786" stroke="#000" stroke-width="2"  marker-end="url(#a)"/><text x="1700" y="823" font-size="14" text-anchor="end" font-weight="bold">ハルネ</text><rect x="1435.0" y="805.0" width="190" height="26" rx="6" fill="#fff" stroke="#000" stroke-width="2"/><text x="1530" y="822.2" font-size="12" text-anchor="middle" fill="#000">縮んでいく</text><rect x="255.0" y="805.0" width="330" height="26" rx="6" fill="#000" stroke="#000" stroke-width="2"/><text x="420" y="822.2" font-size="12" text-anchor="middle" fill="#fff">元の姿・おかわり</text><line x1="1434" y1="818" x2="587" y2="818" stroke="#000" stroke-width="2"  marker-end="url(#a)"/><text x="30" y="850" font-size="12">右から左へ読む・白黒</text></svg></template><script>
const D={"info": ["<h1>社畜だった俺、辺境の村で味噌汁を作ったら土地神様に懐かれました</h1>", "<p class='sub'>〜冬を越せる保存食は、ただの家庭料理なんですが〜</p>", "<p>全12話（第一章完結）</p>", "<h2>あらすじ</h2>", "<p>残業三十時間明け、コンビニで倒れた元社畜・柚木湯吾（28）。目覚めたのは、異世界アルディアの北の果て、トウカ辺境のミルフェ村だった。</p>", "<p>持っていたのは、亡き妹のために磨いた料理と、発酵・燻製・塩漬けの知識だけ。けれど冬に人が死ぬのが当たり前のこの村で、「春までもつ保存食」は奇跡だった。</p>", "<p>警戒する少年農夫ルカ、好奇心いっぱいの妹ミナ、毒舌の薬師グレタ婆さん。食卓を囲む人が一人ずつ増えていく。</p>", "<p>だが村の豊作を支える土地神ハルネの封印は、何者かに力を吸われ、ひび割れていた。王都の飢饉を救うため封印の移送を求める調査官セイル。冬至まで、あと四十日――。</p>", "<p>「今度は、間に合わせる。ひとりじゃなく、みんなで」</p>", "<p>ほっこりスローライフ×封印再生の、第一章・全十二話完結。</p>", "<h2>タグ</h2>", "<p>〔異世界転生〕　〔スローライフ〕　〔料理〕　〔保存食〕　〔飯テロ〕　〔辺境〕　〔土地神〕　〔ほのぼの〕　〔シリアス〕　〔兄妹〕　〔主人公最強ではない〕　〔男主人公〕　〔完結済み〕</p>", "<h2>目次</h2>", "<p class='toc'>第<span class=\"tcy\">1</span>話 終電のあとで、知らない朝</p>", "<p class='toc'>第<span class=\"tcy\">2</span>話 薬師の婆さんは文句を言いながら食べに来る</p>", "<p class='toc'>第<span class=\"tcy\">3</span>話 冬を越す瓶詰めと、答えられない質問</p>", "<p class='toc'>第<span class=\"tcy\">4</span>話 祠の小さな神様は、燻製の匂いに釣られて出てくる</p>", "<p class='toc'>第<span class=\"tcy\">5</span>話 雪解けの行商人と、王都から来た調査官</p>", "<p class='toc'>第<span class=\"tcy\">6</span>話 熱を出した女の子と、兄の作る卵粥</p>", "<p class='toc'>第<span class=\"tcy\">7</span>話 収穫祭の工程表と、調査官の帳面</p>", "<p class='toc'>第<span class=\"tcy\">8</span>話 割れた祠と、王都に移すという提案</p>", "<p class='toc'>第<span class=\"tcy\">9</span>話 五十年前に逃げた守り手</p>", "<p class='toc'>第<span class=\"tcy\">10</span>話 間に合わなかった誕生日と、名前の由来</p>", "<p class='toc'>第<span class=\"tcy\">11</span>話 逃げてもいいと言われた夜に、俺は残ると決めた</p>", "<p class='toc'>第<span class=\"tcy\">12</span>話 冬至の夜、みんなで結ぶ一杯の味噌汁</p>", "<p class='note'>右へスワイプ（または←キー）で次のページへ。各話は上6割が本文、下4割がその話のプロットカードです。</p>"], "arc": ["<h2>全体プロット</h2>", "<h3>全体（第一章）</h3>", "<p>舞台：異世界アルディア、北のトウカ辺境・ミルフェ村（王都レグナスから馬車で十日）。</p>", "<p>主題：誰かを温める人は、自分も温めていい。</p>", "<h3>編の構成（開始／転換／決着）</h3>", "<p>開始＝第1〜3話：到着と食卓、保存食で冬を越す。</p>", "<p>転換＝第6話：ハルネが自分を削ってミナを救い、湯吾は妹を重ねる。第8話：祠が割れ、王都への移送が提案される。</p>", "<p>決着＝第12話：村の一年分の手仕事と父の味噌汁で封印を結び直し、力を「分けて」王都へ届ける。</p>", "<h3>過去の段階的開示</h3>", "<p>第3話　はぐらかす→第6話　妹がいたと漏らす→第10話　誕生日の後悔と名前の由来をすべて語る→第11話　「今度は、ひとりで走らない」</p>", "<h3>人物の弧</h3>", "<p>湯吾：自分を削る→休憩欄を受け入れる。ルカ：警戒→相棒→王都の学校へ。グレタ：逃げた守り手→守り手に戻る。セイル：移送推進→分けて届ける道へ。ハルネ：縮む→元の姿へ。</p>", "<h3>第二章への引き</h3>", "<p>黒衣の顧問閣下、各地の流れ人（砂漠の井戸掘り、島の船大工）、ルカの王都受験、吸い尽くされた他の土地神。</p>"], "cast": ["<h2>登場人物</h2>", "<p class='cast'><b>柚木 湯吾（ゆずき ゆうご）</b>　28歳・男。元社畜の流れ人。定食屋の両親を十五で亡くし、心臓の弱い妹・澪を一人で育てた。父の願い「湯」だけを守り、母の願い「吾」を置き去りにしてきた。</p>", "<p class='cast'><b>柚木 澪（ゆずき みお）</b>　湯吾の七つ下の妹。二十歳の誕生日に「お兄ちゃんのお味噌汁」を待ちながら亡くなった。</p>", "<p class='cast'><b>ルカ</b>　17歳。亡き父の畑を守る若い農夫。王都の学校で農学を学びたい。警戒→相棒。</p>", "<p class='cast'><b>ミナ</b>　9歳。ルカの妹。胸が弱い。毎朝祠に木の実を供える、ハルネの一番の友達。</p>", "<p class='cast'><b>グレタ</b>　村の薬師。五十年前に恋人と王都へ逃げた最後の守り手。毎晩文句を言いながら湯吾の飯を食べる。</p>", "<p class='cast'><b>セイル・アーヴィング</b>　20代半ば。王立農務院の調査官。孤児院育ち。王都の飢饉を本気で止めたい。対立→協力。</p>", "<p class='cast'><b>ハルネ</b>　ミルフェ村の土地神。力が吸われ子どもの姿に。人のごはんが大好き。</p>", "<p class='cast'><b>オズワルド</b>　ミルフェ村の村長。流れ人を受け入れる穏やかな老人。</p>", "<p class='cast'><b>ジュード</b>　行商人（伏線）。各地の流れ人を知る。第二章以降の広い世界への入口。</p>", "<p class='cast'><b>クラウス／黒衣の男</b>　宮廷魔導顧問室の移送官と、その上にいる「顧問閣下」（伏線）。国中の土地神の力を王都に吸い集める。</p>"], "eps": [{"anchor": "木の椀に注ぐと、湯気が立った。", "title": "第<span class=\"tcy\">1</span>話 終電のあとで、知らない朝", "paras": ["<p>最後に見たのは、コンビニの白い光だった。</p>", "<p>午前二時。</p>", "<p>三十時間ぶりに会社を出て、俺はレジ横のおにぎりに手を伸ばして――そこで、床が近づいてきた。</p>", "<p>ああ、またやった。</p>", "<p>ちゃんと食べろって、澪に言われてたのにな。</p>", "<p>そう思ったのを、覚えている。</p>", "<p class='star'>＊</p>", "<p>目を開けると、天井がなかった。</p>", "<p>代わりに、青い空があった。</p>", "<p>秋の空だ。高くて、薄くて、ひんやりしている。</p>", "<p>「……どこだ、ここ」</p>", "<p>起き上がると、背中に枯れ草がついていた。</p>", "<p>見渡すかぎり、黄金色の畑。</p>", "<p>遠くに低い山並みと、煙を上げる小さな屋根がいくつか。</p>", "<p>スーツじゃない。</p>", "<p>麻のような粗い服を着ている。手のひらには、キーボードだこの代わりに、何もない。</p>", "<p>ポケットを探ると、スマホもない。社員証もない。</p>", "<p>あるのは、頭の奥に残った妙な感覚だけだった。</p>", "<p>――塩の量。麹の温度。燻す木の種類。</p>", "<p>誰かに教えられた覚えはないのに、そういう知識が、ちゃんと引き出しに入っている。</p>", "<p>「異世界転生……ってやつか」</p>", "<p>口に出したら、少し笑えた。</p>", "<p>笑ったのは、たぶん何年ぶりだった。</p>", "<p class='star'>＊</p>", "<p>「おい」</p>", "<p>声に振り向くと、鍬を担いだ少年が立っていた。</p>", "<p>十七、八だろうか。日に焼けた腕。警戒心を隠さない目。</p>", "<p>「うちの畑で何してる」</p>", "<p>「あ、ごめん。気づいたらここにいて」</p>", "<p>「……気づいたら？」</p>", "<p>少年の眉が、さらに寄った。</p>", "<p>当然だ。俺だって信じない。</p>", "<p>「名前は」</p>", "<p>「柚木湯吾。湯吾でいい」</p>", "<p>「ユーゴ。変な名前だな」</p>", "<p>そう言いながら、少年は鍬を下ろさなかった。</p>", "<p>「ルカだ。ここはミルフェ村。北の果てのトウカ辺境だよ。王都レグナスから馬車で十日。迷い込むような場所じゃない」</p>", "<p>「お兄ちゃーん！」</p>", "<p>畑の向こうから、小さな女の子が走ってきた。</p>", "<p>九つくらいか。麦わら色の髪を二つに結んで、手には野花を握っている。</p>", "<p>「ミナ、来るなって言っただろ」</p>", "<p>「だって、知らない人がいるもん！」</p>", "<p>女の子――ミナは、ルカの後ろから顔だけ出して、俺をじいっと見た。</p>", "<p>それから、ぱっと笑った。</p>", "<p>「お兄さん、おなかすいてる顔してる」</p>", "<p>……図星だった。</p>", "<p>最後に食べたものを思い出せない。</p>", "<p class='star'>＊</p>", "<p>ルカの家は、畑の端にある石造りの小さな家だった。</p>", "<p>父親は二年前に亡くなり、母親もいない。兄妹二人で暮らしているという。</p>", "<p>「泊めるわけじゃない。飯だけだ」</p>", "<p>ルカはそう言って、鍋を火にかけた。</p>", "<p>中身を覗いて、俺は少し固まった。</p>", "<p>塩で煮ただけの、芋と麦。</p>", "<p>それはいい。問題は、ルカの手つきだった。</p>", "<p>火が強すぎる。芋の皮が厚く残っている。塩は最後にまとめて放り込む。</p>", "<p>「……ちょっと、借りていいか」</p>", "<p>「は？」</p>", "<p>「台所。お礼に一品作らせてくれ」</p>", "<p>ルカは露骨に嫌な顔をした。</p>", "<p>でもミナが「見たい！」と言ったので、渋々場所を空けてくれた。</p>", "<p>棚には、干した茸と、痩せた玉ねぎと、豚の脂身がひとかけ。</p>", "<p>壁には、名前の知らない香草が吊るしてある。</p>", "<p>十分だ。</p>", "<p>脂身を刻んで、弱火でじっくり脂を出す。</p>", "<p>玉ねぎは薄く切って、焦がさないように、甘くなるまで。</p>", "<p>干し茸は水で戻して、その戻し汁ごと鍋へ。</p>", "<p>芋はルカの鍋から拝借して、角を落として煮崩れないように。</p>", "<p>塩は、三回に分けて。最後に香草をひとつまみ。</p>", "<p>手が、勝手に動いた。</p>", "<p>何千回も繰り返した動きだった。</p>", "<p>誰のために繰り返したのかは――今は、考えないことにした。</p>", "<p>「はい、どうぞ」</p>", "<p>木の椀に注ぐと、湯気が立った。</p>", "@@PIC", "<p>ミナが、ふうふう吹いてから、ひと口。</p>", "<p>「……っ」</p>", "<p>ミナの目が、まんまるになった。</p>", "<p>「お兄ちゃん、これ、すごい！　あったかいのが、おなかの奥まで来る！」</p>", "<p>「大げさだな」</p>", "<p>ルカは鼻で笑って、自分の椀に口をつけた。</p>", "<p>そして、黙った。</p>", "<p>もうひと口。さらにひと口。</p>", "<p>椀が空になるまで、ルカは一言もしゃべらなかった。</p>", "<p>「……同じ芋だよな？」</p>", "<p>「同じ芋だよ」</p>", "<p>「なんで、こうなる」</p>", "<p>「火を弱くして、塩を分けて入れただけ。ただの家庭料理だって」</p>", "<p>ルカは何か言いかけて、やめた。</p>", "<p>代わりに、空の椀を俺のほうへ押し出した。</p>", "<p>「……おかわり」</p>", "<p class='star'>＊</p>", "<p>その夜、俺は結局、ルカの家の納屋に泊めてもらった。</p>", "<p>干し草の匂いがした。</p>", "<p>不思議なことに、体が軽かった。</p>", "<p>三十時間働いたあとの、あの鉛みたいな疲れがない。</p>", "<p>ミナも、寝る前に「今日はせきが出ない」と言っていた。</p>", "<p>気のせいだろう。</p>", "<p>温かいものを食べれば、誰だって少しは楽になる。</p>", "<p>納屋の隙間から、星が見えた。</p>", "<p>こんなにたくさんの星を見たのは、いつ以来だろう。</p>", "<p>「誰かと食べる飯、か」</p>", "<p>最後にそうしたのは、いつだったか。</p>", "<p>思い出しかけて、俺は目を閉じた。</p>", "<p>遠くで、森の奥の何かが、小さく鳴った気がした。</p>", "<p>鈴のような、子どもの笑い声のような。</p>", "<p>――おいしそうな、においがする。</p>", "<p>夢の入り口で、誰かがそう言った。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">1</span>話　プロット</h3><p><b>依頼</b>畑で拾われ、ルカ兄妹に一杯のスープを作る</p><p><b>本筋</b>転生・村への到着</p><p><b>伏線</b>森の鈴の声「おいしそうなにおい」／体の疲れが消える</p><p><b>共感</b>誰かと食べる飯を取り戻す第一歩</p><p><b>工程</b>全体→第1編の開始</p>", "n": 1, "img": "images/ep01.jpg", "cap": "第1話　はじめての一杯"}, {"anchor": "", "title": "第<span class=\"tcy\">2</span>話 薬師の婆さんは文句を言いながら食べに来る", "paras": ["<p>翌朝、俺は村長に会いに行った。</p>", "<p>ミルフェ村は三十戸ほどの小さな村だ。</p>", "<p>村長のオズワルドさんは白い髭の穏やかな人で、俺の「気づいたら畑にいた」という話を、意外なほどあっさり受け入れた。</p>", "<p>「この辺境ではな、ときどき『流れ人』が来るんじゃよ。百年に一人くらいかの」</p>", "<p>「流れ人」</p>", "<p>「どこか遠くから流れてくる者。たいてい、何か一つ、変わった知恵を持っておる」</p>", "<p>村はずれの空き家を貸してもらえることになった。</p>", "<p>条件は一つ。村の仕事を手伝うこと。</p>", "<p>願ってもない話だった。</p>", "<p class='star'>＊</p>", "<p>空き家は、ひどい有様だった。</p>", "<p>屋根に穴。かまどは崩れかけ。床には鼠の通り道。</p>", "<p>「……前の会社の倉庫よりはマシだな」</p>", "<p>口に出してみると、なんだかやる気が出た。</p>", "<p>まずは段取りだ。</p>", "<p>屋根、かまど、水回り、寝床。今日中に終わらせるのは、かまどと寝床。屋根は晴れが続くうちに三日以内。</p>", "<p>頭の中でガントチャートを引くのは、もう癖みたいなものだ。</p>", "<p>昼過ぎ、かまどの石を積み直していると、背後から声がした。</p>", "<p>「ふん。よそ者が、ずいぶん偉そうに石を並べるもんだね」</p>", "<p>振り向くと、腰の曲がった老婆が杖をついて立っていた。</p>", "<p>皺だらけの顔に、鋭い灰色の目。首から、乾いた薬草の束を下げている。</p>", "<p>「グレタ婆さんだよ。村の薬師」</p>", "<p>いつの間にか来ていたミナが、こっそり耳打ちしてくれた。</p>", "<p>「口はすっごく悪いけど、熱が出たらいつも治してくれるの」</p>", "<p>「聞こえてるよ、ミナ」</p>", "<p>「ひゃっ」</p>", "<p>グレタ婆さんは、崩れかけのかまどを杖でこんこん叩いた。</p>", "<p>「この家はね、前の持ち主が逃げてった家だよ。縁起が悪い」</p>", "<p>「逃げた？」</p>", "<p>「冬にね。食い物が尽きて、町へ下りる途中で――まあ、いい」</p>", "<p>婆さんは言葉を切った。</p>", "<p>ミナの顔が、少し曇った。</p>", "<p>「この村じゃ、冬は人が減るもんなんだ。覚えときな、流れ人」</p>", "<p>そう言って、婆さんは背を向けた。</p>", "<p class='star'>＊</p>", "<p>その夜、俺はかまどの試運転を兼ねて、ルカの家からもらった麦で粥を炊いた。</p>", "<p>干した川魚を炙ってほぐし、刻んだ香草と一緒に混ぜる。</p>", "<p>仕上げに、裏庭に自生していた野生の葱。</p>", "<p>湯気が立った瞬間、戸口に影が立った。</p>", "<p>「……煙が上がってたから、火事かと思ってね」</p>", "<p>グレタ婆さんだった。</p>", "<p>目線は、まっすぐ鍋に向いている。</p>", "<p>「よかったら、食べていきます？」</p>", "<p>「誰がよそ者の飯なんか」</p>", "<p>「多めに炊いちゃったんで」</p>", "<p>婆さんは、たっぷり十秒黙った。</p>", "<p>それから、どかっと板の間に座った。</p>", "<p>「味見だよ。毒でも入ってたら困るからね」</p>", "<p>椀を受け取って、ひと口。</p>", "<p>婆さんの眉が、ぴくりと動いた。</p>", "<p>「……塩がきつい」</p>", "<p>「すみません」</p>", "<p>「魚が焦げてる」</p>", "<p>「次は気をつけます」</p>", "<p>「葱が多い」</p>", "<p>そう言いながら、婆さんは椀を空にした。</p>", "<p>そして、黙って差し出した。</p>", "<p>「……おかわり、いります？」</p>", "<p>「いらないなんて言ってないだろ」</p>", "<p class='star'>＊</p>", "<p>食べ終わった婆さんは、しばらく自分の手のひらを見つめていた。</p>", "<p>「あんた。これ、何を入れた」</p>", "<p>「麦と魚と香草と葱です。あと塩」</p>", "<p>「それだけかい」</p>", "<p>「それだけです」</p>", "<p>婆さんは、指を握ったり開いたりした。</p>", "<p>「膝の痛みが、引いてる」</p>", "<p>「温まったからじゃないですか」</p>", "<p>「四十年、この膝と付き合ってるんだ。温まったくらいで引くもんかね」</p>", "<p>灰色の目が、俺をじっと見た。</p>", "<p>何かを測るような、あるいは、何かを思い出そうとするような目だった。</p>", "<p>「……昔、似たようなことがあった」</p>", "<p>「え？」</p>", "<p>「なんでもないよ」</p>", "<p>婆さんは立ち上がり、戸口で振り返った。</p>", "<p>「明日も作るのかい」</p>", "<p>「たぶん」</p>", "<p>「ふん。塩は控えめにしな」</p>", "<p>それから毎晩、グレタ婆さんは文句を言いながら、うちに食べに来るようになった。</p>", "<p class='star'>＊</p>", "<p>一週間が経った。</p>", "<p>ルカの畑の収穫を手伝い、ミナに字を教わり、婆さんの文句を聞きながら夕食を作る。</p>", "<p>朝は鳥の声で起きて、夜は星を見て寝る。</p>", "<p>残業も、締め切りも、鳴りやまない通知もない。</p>", "<p>「……いいな、こういうの」</p>", "<p>かまどの火を見ながら、つぶやく。</p>", "<p>今のところ、俺の異世界生活は、驚くほど平和だった。</p>", "<p>ただ、一つだけ気になることがあった。</p>", "<p>村の畑は、どこも見事な豊作だった。</p>", "<p>痩せた土地のはずなのに、麦は重く頭を垂れ、芋はごろごろと大きい。</p>", "<p>「この村、いつもこんなに採れるのか？」</p>", "<p>ルカに聞くと、彼は当たり前のように頷いた。</p>", "<p>「ミルフェ村は昔から豊作なんだよ。ハルネ様のおかげだって、父さんは言ってた」</p>", "<p>「ハルネ様？」</p>", "<p>「森の祠の神様。ミナが毎朝、お供えに行ってる」</p>", "<p>その名前を聞いたとき、なぜか、夢の中で聞いた鈴の音を思い出した。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">2</span>話　プロット</h3><p><b>依頼</b>グレタ婆さんの膝痛と毎晩の夕食</p><p><b>本筋</b>村での居場所づくり／豊作の謎</p><p><b>伏線</b>婆さん「昔、似たようなことがあった」／ハルネ様の名</p><p><b>共感</b>毒舌の裏の孤独</p><p><b>工程</b>第1編・日常の積み上げ</p>", "n": 2, "img": null, "cap": ""}, {"anchor": "子どもたちは林檎を運び、年寄りは瓶を煮沸した。", "title": "第<span class=\"tcy\">3</span>話 冬を越す瓶詰めと、答えられない質問", "paras": ["<p>「ユーゴ、冬支度って知ってるか」</p>", "<p>ある朝、ルカが真剣な顔でやって来た。</p>", "<p>収穫が一段落して、空気が日ごとに冷たくなってきた頃だ。</p>", "<p>「この村の冬は長い。半年近く雪に閉ざされる。豊作でも、冬の終わりには食い物が尽きるんだ」</p>", "<p>「豊作なのに？」</p>", "<p>「腐るんだよ。芋は芽が出て、麦は湿気って、肉はすぐ傷む。干し肉にしても、春までもたない」</p>", "<p>ルカは拳を握った。</p>", "<p>「去年は、隣のトマスじいさんが死んだ。おととしは、赤ん坊が二人」</p>", "<p>言葉が出なかった。</p>", "<p>グレタ婆さんの「冬は人が減る」という言葉が、急に重みを持った。</p>", "<p>「……それで、俺に何を？」</p>", "<p>「ミナが言うんだ。ユーゴなら何とかできるって」</p>", "<p>ルカは目をそらした。</p>", "<p>頼るのが悔しい、という顔だった。</p>", "<p>「俺は、別にお前を信用したわけじゃない。でも――」</p>", "<p>「わかった。やろう」</p>", "<p>ルカが顔を上げた。</p>", "<p>「まず、村にある食材と、保存に使えそうなものを全部見せてくれ」</p>", "<p class='star'>＊</p>", "<p>村を一日かけて回った。</p>", "<p>芋、麦、豆、キャベツに似た葉野菜、根菜、豚が数頭、鶏、川魚。</p>", "<p>塩は、行商人から買う岩塩が少し。</p>", "<p>酢はない。でも、山葡萄と蜂蜜がある。</p>", "<p>森には、燻すのに良さそうな桜に似た木。</p>", "<p>頭の中で、引き出しが次々に開いていく。</p>", "<p>「葉野菜は塩漬けにして発酵させる。ザワークラウトみたいなもんだ。冬でも酸っぱいままもつ」</p>", "<p>「ざわー……？」</p>", "<p>「酸っぱい漬物。豚は塩をすり込んで、桜の木で燻す。燻製にすると、干すより格段に長くもつ。山葡萄からは酢を作る。酢があれば、根菜をピクルスにできる」</p>", "<p>ルカがぽかんとしていた。</p>", "<p>「芋は、湿気の少ない地下に、藁と砂で寝かせる。芽が出ないように、林檎と一緒に置くといい」</p>", "<p>「林檎と？　なんで」</p>", "<p>「林檎が出すガスが、芽を抑えるんだ」</p>", "<p>「……お前、どこでそんなこと覚えたんだ」</p>", "<p>その質問に、俺は一瞬、手を止めた。</p>", "<p>「まあ、昔ちょっとね」</p>", "<p class='star'>＊</p>", "<p>問題は、人手と時間だった。</p>", "<p>初雪まで、あと三週間。</p>", "<p>三十戸分の冬の保存食を、三週間で。</p>", "<p>「……納期、三週間か」</p>", "<p>懐かしい響きだった。嫌な意味で。</p>", "<p>でも、ここでのそれは、誰かの売上のための納期じゃない。</p>", "<p>誰かが冬を越すための納期だ。</p>", "<p>俺は村の集会所の壁に、炭で大きな表を書いた。</p>", "<p>縦に作業、横に日付。</p>", "<p>塩漬け班、燻製班、酢づくり班、芋の貯蔵班。</p>", "<p>誰が、いつ、何を、どれだけ。</p>", "<p>天候が崩れた日の代わりの作業まで。</p>", "<p>「なんだい、この落書きは」</p>", "<p>グレタ婆さんが、集会所の入り口で目を細めた。</p>", "<p>「工程表です。これを見れば、誰がいつ何をすればいいか、一目でわかる」</p>", "<p>「ふん。字が読めない連中はどうするんだい」</p>", "<p>「……あ」</p>", "<p>その日の夜、ミナと二人で、全部の作業に絵を描き足した。</p>", "<p>豚の絵、葉っぱの絵、瓶の絵。</p>", "<p>ミナは絵が上手かった。</p>", "<p class='star'>＊</p>", "<p>三週間は、あっという間だった。</p>", "<p>村じゅうの女たちが葉野菜を刻み、男たちが燻製小屋を建てた。</p>", "<p>子どもたちは林檎を運び、年寄りは瓶を煮沸した。</p>", "@@PIC", "<p>ルカは誰よりも早く来て、誰よりも遅く帰った。</p>", "<p>最初は半信半疑だった村人たちも、十日目に最初の燻製ハムを切り分けたとき、顔色が変わった。</p>", "<p>「……なんだ、この香り」</p>", "<p>「干し肉と全然違う。しっとりしてる」</p>", "<p>「これが、春までもつのか？」</p>", "<p>「ちゃんと作れば、夏までもちます」</p>", "<p>どよめきが起きた。</p>", "<p>誰かが拍手をして、それが広がった。</p>", "<p>俺は、どう反応していいかわからなかった。</p>", "<p>前の会社で、拍手をもらったことなんて一度もない。</p>", "<p>「すごいのは、作業した皆さんですよ。俺は段取りを決めただけで」</p>", "<p>「その段取りが、誰にもできなかったんだよ」</p>", "<p>ルカが、ぶっきらぼうに言った。</p>", "<p class='star'>＊</p>", "<p>初雪の前の晩。</p>", "<p>貯蔵庫いっぱいに並んだ瓶と樽と燻製を、ルカと二人で眺めた。</p>", "<p>「……ユーゴ」</p>", "<p>「ん？」</p>", "<p>「ありがとう。父さんが死んでから、冬が来るのが怖かった。ミナを、ちゃんと春まで食わせられるか」</p>", "<p>ルカは、そこで言葉を切った。</p>", "<p>「でも今年は、怖くない」</p>", "<p>俺は、何も言えなかった。</p>", "<p>胸の奥の、ずっと閉じていた扉が、少しだけきしんだ気がした。</p>", "<p>「なあ、ユーゴ」</p>", "<p>今度は、隣にいたミナが聞いた。</p>", "<p>「どうしてそんなに、料理がじょうずなの？」</p>", "<p>無邪気な質問だった。</p>", "<p>答えは、喉まで出かかった。</p>", "<p>――毎日、作っていたからだよ。</p>", "<p>食べてくれない誰かに、少しでも食べてほしくて。</p>", "<p>「……昔、料理人の家に生まれたんだ。それだけだよ」</p>", "<p>半分だけ、本当のことを言った。</p>", "<p>ミナは「ふーん」と言って、それ以上は聞かなかった。</p>", "<p>その夜、初雪が降った。</p>", "<p>静かな雪だった。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">3</span>話　プロット</h3><p><b>依頼</b>初雪まで三週間、村の冬支度</p><p><b>本筋</b>保存食＝冬越しの奇跡</p><p><b>伏線</b>「どこで覚えた？」→はぐらかす（過去・段階1）</p><p><b>共感</b>ルカ「今年は怖くない」</p><p><b>工程</b>段取り力の提示</p>", "n": 3, "img": "images/ep03.jpg", "cap": "第3話　冬を越す瓶詰め"}, {"anchor": "", "title": "第<span class=\"tcy\">4</span>話 祠の小さな神様は、燻製の匂いに釣られて出てくる", "paras": ["<p>雪に閉ざされた村は、静かだった。</p>", "<p>畑仕事がない冬の間、村人たちは家で糸を紡いだり、道具を直したりして過ごす。</p>", "<p>俺の家には、毎日誰かが来るようになった。</p>", "<p>「ユーゴさん、うちの漬物、なんか泡が出てるんだけど」</p>", "<p>「それは発酵してる証拠です。大丈夫」</p>", "<p>「ユーゴ、燻製の木、もう一回分けてくれ」</p>", "<p>「裏に積んであります」</p>", "<p>なんでも屋みたいだった。</p>", "<p>悪くない。</p>", "<p class='star'>＊</p>", "<p>ある朝、ミナが青い顔で駆け込んできた。</p>", "<p>「ユーゴ！　ハルネ様の祠が、変なの！」</p>", "<p>ミナに手を引かれて、雪の森へ入った。</p>", "<p>村から歩いて半刻。</p>", "<p>大きな樫の木の根元に、苔むした小さな石の祠があった。</p>", "<p>ミナが毎朝供えている木の実の皿が、凍りついている。</p>", "<p>それはいい。冬だから。</p>", "<p>おかしいのは、祠そのものだった。</p>", "<p>石の表面に、細い亀裂が走っている。</p>", "<p>そして、祠の周りだけ、雪が黒ずんで溶けていた。</p>", "<p>「昨日まで、こんなじゃなかったの」</p>", "<p>ミナの声が震えていた。</p>", "<p>俺は膝をついて、亀裂に触れた。</p>", "<p>冷たい。</p>", "<p>雪よりも、氷よりも冷たい。</p>", "<p>指先から、何かが吸い取られていくような――</p>", "<p>「――さわらないで」</p>", "<p>声がした。</p>", "<p>子どもの声だった。</p>", "<p>顔を上げると、祠の屋根の上に、小さな女の子が座っていた。</p>", "<p>六つか七つくらい。真っ白な髪に、葉っぱの冠。</p>", "<p>着ているのは、古い神社の巫女装束みたいな、ゆったりとした衣。</p>", "<p>雪の上なのに、裸足だった。</p>", "<p>「……誰？」</p>", "<p>「ハルネ様！」</p>", "<p>ミナが叫んだ。</p>", "<p>女の子――ハルネは、少しだけ驚いた顔をした。</p>", "<p>「ミナには、見えるの？」</p>", "<p>「見える！　ずっと、いるって思ってた！」</p>", "<p>ハルネは、ふわりと屋根から降りてきた。</p>", "<p>足跡が、雪につかない。</p>", "<p>「わたしは、ハルネ。この土地を見守ってる」</p>", "<p>それから、くん、と鼻を鳴らした。</p>", "<p>視線が、俺の腰の袋に向く。</p>", "<p>「……それ、なあに？」</p>", "<p>「え？　ああ、燻製ハム。おやつ代わりに持ってきた」</p>", "<p>「におい、する。ずっと、森までしてた。おいしそうなにおい」</p>", "<p>神様の目が、きらきらしていた。</p>", "<p>「……食べる？」</p>", "<p>「たべる」</p>", "<p>即答だった。</p>", "<p class='star'>＊</p>", "<p>ハルネは、薄く切ったハムを両手で持って、小さな口でかじった。</p>", "<p>そして、ぴたりと止まった。</p>", "<p>「…………！」</p>", "<p>ぱあっと、顔が明るくなった。</p>", "<p>同時に、祠の周りの黒い雪が、ほんの少しだけ白に戻った。</p>", "<p>「おいしい。あったかい。土の味がする」</p>", "<p>「土の味？」</p>", "<p>「この村の豚。この村の木の煙。この村の人が、手で塩をすりこんだ」</p>", "<p>ハルネは、ハムをもう一枚ねだりながら言った。</p>", "<p>「人のごはん、ひさしぶり。昔は、もっとたくさん、もらってたのに」</p>", "<p class='star'>＊</p>", "<p>祠の前の倒木に三人で腰かけて、話を聞いた。</p>", "<p>ハルネは、ずっと昔からこの土地にいる神様だという。</p>", "<p>この村の豊作は、ハルネの力が土地に満ちているからだ。</p>", "<p>でも、ハルネの力は、無限じゃない。</p>", "<p>「むかし、守り手がいたの。わたしと、ひとをつなぐひと。祠を清めて、ごはんを供えて、わたしの力を、土地にちゃんと流してくれるひと」</p>", "<p>「守り手……今は？」</p>", "<p>「いない。ずっと、いない」</p>", "<p>ハルネは、膝を抱えた。</p>", "<p>「だから、わたし、だんだん小さくなってる。前は、おとなの姿だったのに」</p>", "<p>「この亀裂は？」</p>", "<p>「わたしの力が、もれてる。このままだと――」</p>", "<p>ハルネは、そこで口をつぐんだ。</p>", "<p>代わりに、残りのハムを大事そうにかじった。</p>", "<p>「ユーゴのごはんは、ふしぎ。たべると、ちょっとだけ、もどる」</p>", "<p>俺は、自分の手を見た。</p>", "<p>グレタ婆さんの膝。ミナの咳。ルカの「なんで、こうなる」。</p>", "<p>ただの家庭料理のはずだった。</p>", "<p>「……ミナ。このこと、まだ村の人には言わないでおこう」</p>", "<p>「どうして？」</p>", "<p>「まだ、何がどうなってるのかわからない。みんなを怖がらせたくない」</p>", "<p>ミナは、こくんと頷いた。</p>", "<p class='star'>＊</p>", "<p>帰り道、雪がまた降り出した。</p>", "<p>「ユーゴ、ハルネ様、だいじょうぶかな」</p>", "<p>「わからない。でも、明日もハム持ってくよ」</p>", "<p>「わたしも、木の実もってく！」</p>", "<p>ミナが、俺の手を握った。</p>", "<p>小さくて、冷たい手だった。</p>", "<p>その感触に、一瞬だけ、別の手を思い出した。</p>", "<p>病院のベッドで、点滴の管につながれていた、細い手。</p>", "<p>――お兄ちゃん、今日は何作ってくれるの。</p>", "<p>「ユーゴ？」</p>", "<p>「……ん、なんでもない。寒いな。帰ったら、何か温かいもの作ろう」</p>", "<p>俺は、ミナの手を握り返した。</p>", "<p>今度は、ちゃんと離さないように。</p>", "<p>その夜、グレタ婆さんがいつものように食べに来た。</p>", "<p>俺が祠の話をそれとなく振ると、婆さんの匙が、ぴたりと止まった。</p>", "<p>「……祠に、行ったのかい」</p>", "<p>「ミナに連れられて」</p>", "<p>「そうかい」</p>", "<p>婆さんは、それ以上何も言わなかった。</p>", "<p>ただ、いつもの文句も、その夜は一つも出なかった。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">4</span>話　プロット</h3><p><b>依頼</b>祠の異変を確かめる</p><p><b>本筋</b>最初の違和感：祠の亀裂、守り手の不在</p><p><b>伏線</b>ハルネ登場／ミナの手→病院の手</p><p><b>共感</b>小さな神様の寂しさ</p><p><b>工程</b>本筋の起動</p>", "n": 4, "img": null, "cap": ""}, {"anchor": "", "title": "第<span class=\"tcy\">5</span>話 雪解けの行商人と、王都から来た調査官", "paras": ["<p>冬は、誰も死なずに終わった。</p>", "<p>それがどれだけすごいことか、俺は春になって初めて知った。</p>", "<p>村の広場で、オズワルド村長が涙ぐみながら言ったのだ。</p>", "<p>「この村ができて百二十年。冬に一人の死者も出なかったのは、初めてじゃ」</p>", "<p>村人たちが、俺を囲んだ。</p>", "<p>肩を叩かれ、手を握られ、パンや卵を押しつけられた。</p>", "<p>ルカは少し離れたところで、腕を組んで、でも嬉しそうに笑っていた。</p>", "<p class='star'>＊</p>", "<p>雪解けとともに、最初の行商人がやってきた。</p>", "<p>「いやあ、今年のミルフェ村は活気がありますな！」</p>", "<p>ジュードと名乗るその男は、丸眼鏡に赤ら顔、背中に大きな荷を背負った陽気な中年だった。</p>", "<p>各地を回って、塩や布や針を売り、代わりに村の産物を買っていく。</p>", "<p>「冬越しで痩せこけた村を見て回るのが、毎年つらいんですがね。ここは皆さん、血色がいい」</p>", "<p>「保存食を作ったんです」</p>", "<p>「ほう、保存食」</p>", "<p>ジュードは、俺が出した燻製ハムとザワークラウトを試食して、眼鏡の奥の目を細めた。</p>", "<p>「……これは、売れますな。王都でも、南の港町でも」</p>", "<p>「売り物にするつもりは」</p>", "<p>「いやいや、もったいない。ところで、あなた、流れ人でしょう」</p>", "<p>さらりと言われて、俺は固まった。</p>", "<p>「わかるんですよ。仕事柄、あちこちで流れ人の噂を聞くもんでね。東の砂漠には井戸を掘る流れ人、西の島には船を作る流れ人」</p>", "<p>ジュードは荷物を背負い直しながら、声を少しだけ低くした。</p>", "<p>「最近は、どこも土地が痩せてきてる。流れ人が増えてるのは、そのせいかもしれませんな」</p>", "<p>「……どういう意味ですか」</p>", "<p>「さあ。ただの行商人の、ただの与太話ですよ」</p>", "<p>ジュードは笑って、次の村へと去っていった。</p>", "<p>荷車の轍が、雪解けの泥に長く残った。</p>", "<p class='star'>＊</p>", "<p>その三日後。</p>", "<p>今度は、見たこともない立派な馬車が村に入ってきた。</p>", "<p>黒塗りの車体に、金の紋章。</p>", "<p>降りてきたのは、灰色の外套を着た若い男だった。</p>", "<p>二十代半ば。きちんと撫でつけた黒髪に、細い銀縁の眼鏡。</p>", "<p>手には分厚い帳面。</p>", "<p>「王立農務院、調査官のセイル・アーヴィングです」</p>", "<p>男は、集まった村人たちに、礼儀正しく頭を下げた。</p>", "<p>「ミルフェ村の、異常な豊作について調べに参りました」</p>", "<p>ざわめきが起きた。</p>", "<p>「異常、とはどういうことかね」</p>", "<p>村長が、穏やかに、でも警戒を込めて聞いた。</p>", "<p>セイルは帳面を開いた。</p>", "<p>「過去五十年の税の記録を調べました。トウカ辺境のどの村も、収穫量は年々減っています。平均して、五十年前の六割。ところがミルフェ村だけが、まったく減っていない」</p>", "<p>彼は、顔を上げた。</p>", "<p>「土壌は、周辺の村と同じです。気候も同じ。なのに、この村だけが豊かだ。理由があるはずです」</p>", "<p>誰も答えなかった。</p>", "<p>ルカが、ちらりと俺を見た。ミナが、俺の袖をぎゅっと掴んだ。</p>", "<p class='star'>＊</p>", "<p>セイルは、村長の家に滞在することになった。</p>", "<p>そして翌日から、村じゅうを歩き回った。</p>", "<p>畑の土を採り、水を汲み、村人に聞き取りをして、帳面に書きつけていく。</p>", "<p>その日の夕方、セイルは俺の家にやって来た。</p>", "<p>「あなたが、冬の保存食を作ったユーゴさんですね」</p>", "<p>「ええ、まあ」</p>", "<p>「村の皆さんが、口をそろえてあなたの話をする。冬に誰も死ななかったのは、あなたのおかげだと」</p>", "<p>セイルは、台所に並んだ瓶を見回した。</p>", "<p>「その技術を、記録させてもらえませんか」</p>", "<p>「技術、ってほどのものじゃ」</p>", "<p>「謙遜はいいです。塩漬けと燻製と酢漬け。それを体系立てて、村全体の工程として回した。それは技術です」</p>", "<p>彼の声には、皮肉も、見下しもなかった。</p>", "<p>ただ、切実さがあった。</p>", "<p>「……なんで、そこまで」</p>", "<p>セイルは、少しだけ黙った。</p>", "<p>「王都では、去年の冬、三千人が飢えで死にました」</p>", "<p>息が止まった。</p>", "<p>「南の穀倉地帯が、三年続けて不作なんです。理由はわからない。土が、ただ痩せていく。私は、その理由を探しています。そして、それを止める方法を」</p>", "<p>セイルは、まっすぐ俺を見た。</p>", "<p>「この村には、何かがある。私は、それを見つけなければならない」</p>", "<p class='star'>＊</p>", "<p>その夜、俺はハルネの祠に行った。</p>", "<p>セイルの話を伝えると、ハルネは、黙って亀裂を撫でた。</p>", "<p>冬の間に、亀裂は、また少し伸びていた。</p>", "<p>「おうと……ずっと遠く。でも、つながってる」</p>", "<p>「つながってる？」</p>", "<p>「土地は、ぜんぶ、どこかでつながってる。わたしみたいなのが、あちこちにいた。でも、みんな、だんだん、いなくなった」</p>", "<p>ハルネは、空を見上げた。</p>", "<p>春の夜空に、星が瞬いていた。</p>", "<p>「――だれかが、吸ってる」</p>", "<p>「え？」</p>", "<p>「なんでもない。ユーゴ、きょうのおやつは？」</p>", "<p>ハルネは、いつもの顔に戻って、両手を差し出した。</p>", "<p>俺は、蜂蜜漬けの林檎を渡しながら、今の言葉を胸の中で繰り返した。</p>", "<p>誰かが、吸ってる。</p>", "<p>王都の、ずっと奥。</p>", "<p>金と大理石の宮殿の、一番深い部屋で、黒衣の男が、誰にも見えない地図を眺めている――</p>", "<p>そんな光景を、なぜか、俺は一瞬だけ思い浮かべた。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">5</span>話　プロット</h3><p><b>依頼</b>雪解けの行商と調査官の聞き取り</p><p><b>本筋</b>王都の飢饉、五十年で六割の不作</p><p><b>伏線</b>行商人ジュード・他地方の流れ人／「だれかが吸ってる」黒衣の男</p><p><b>共感</b>セイルの切実さ</p><p><b>工程</b>世界の拡張・対立役登場</p>", "n": 5, "img": null, "cap": ""}, {"anchor": "ふわりと固まったところで、蓋をして、一呼吸。", "title": "第<span class=\"tcy\">6</span>話 熱を出した女の子と、兄の作る卵粥", "paras": ["<p>春の終わり、ミナが熱を出した。</p>", "<p>朝、ルカが真っ青な顔で家に飛び込んできた。</p>", "<p>「ユーゴ、ミナが……ミナが起きない」</p>", "<p>駆けつけると、ミナは寝台の上で、浅く速い息をしていた。</p>", "<p>額に手を当てると、焼けるように熱い。</p>", "<p>グレタ婆さんがすでに来ていて、薬草を煎じていた。</p>", "<p>「流行り風邪だよ。この時期、子どもがよくかかる」</p>", "<p>「治りますか」</p>", "<p>「たいていはね。でも――」</p>", "<p>婆さんは、ミナの顔を見下ろした。</p>", "<p>「この子は、生まれつき胸が弱い。冬を越すたびに、母親も心配してた」</p>", "<p>ルカが、拳を壁に押しつけた。</p>", "<p class='star'>＊</p>", "<p>婆さんの煎じ薬を飲ませても、ミナの熱は下がらなかった。</p>", "<p>それどころか、食べ物を受けつけない。</p>", "<p>水を少し飲んでは、吐いてしまう。</p>", "<p>「何か食べないと、体力がもたない」</p>", "<p>婆さんの声が、珍しく揺れていた。</p>", "<p>俺は、台所に立った。</p>", "<p>鍋に、水と、少しの麦。</p>", "<p>卵を一つ。</p>", "<p>干した茸の戻し汁で、ほんのり出汁を。</p>", "<p>塩は、ほんのひとつまみ。</p>", "<p>生姜に似た根を、すりおろして汁だけ。</p>", "<p>弱火で、ゆっくり。</p>", "<p>麦が花のように開くまで、焦がさないように、混ぜ続ける。</p>", "<p>溶き卵は、火を止める直前に、細く、細く回し入れる。</p>", "<p>ふわりと固まったところで、蓋をして、一呼吸。</p>", "@@PIC", "<p>手が、覚えていた。</p>", "<p>何百回も、何千回も作った味だった。</p>", "<p>――お兄ちゃん、今日はちょっとだけ食べられそう。</p>", "<p>声が聞こえた気がして、手が止まった。</p>", "<p>「……ユーゴ？」</p>", "<p>ルカが、怪訝な顔で俺を見ていた。</p>", "<p>俺は首を振って、椀に粥をよそった。</p>", "<p class='star'>＊</p>", "<p>「ミナ。ちょっとだけ、食べられるか」</p>", "<p>ミナが、うっすら目を開けた。</p>", "<p>匙に少しだけすくって、ふうふうと冷ます。</p>", "<p>唇に、そっと当てる。</p>", "<p>ミナは、ほんの少しだけ、口を開けた。</p>", "<p>飲み込んだ。</p>", "<p>吐かなかった。</p>", "<p>「……あったかい」</p>", "<p>かすれた声で、ミナが言った。</p>", "<p>「もうひと口、いけるか」</p>", "<p>「……うん」</p>", "<p>ひと口。またひと口。</p>", "<p>椀の半分ほどを食べたところで、ミナは、すうっと眠りに落ちた。</p>", "<p>さっきまでの浅い息が、少しだけ、深くなっていた。</p>", "<p>婆さんが、ミナの額に手を当てた。</p>", "<p>しばらくして、目を見開いた。</p>", "<p>「熱が、引き始めてる」</p>", "<p>ルカが、その場に崩れるように座り込んだ。</p>", "<p class='star'>＊</p>", "<p>夜更け。</p>", "<p>ミナの寝息を聞きながら、俺とルカは台所の床に並んで座っていた。</p>", "<p>「……ユーゴ」</p>", "<p>「ん」</p>", "<p>「さっきの粥。手慣れてたな。病人に食わせるのに」</p>", "<p>俺は、黙っていた。</p>", "<p>ルカも、急かさなかった。</p>", "<p>かまどの残り火が、ぱち、と鳴った。</p>", "<p>「……妹がいたんだ」</p>", "<p>自分の口から出た言葉に、自分で驚いた。</p>", "<p>「澪っていう。七つ下でさ。ちょうど、ミナみたいに、体が弱かった」</p>", "<p>ルカが、こちらを見た。</p>", "<p>「親が早くに死んで、俺が育てた。あいつ、すぐ食欲がなくなるんだよ。だから毎日、何なら食べてくれるか、そればっかり考えてた。粥も、スープも、百通りくらい作った」</p>", "<p>「……それで、料理が」</p>", "<p>「それだけだよ。料理人の家ってのは、半分だけ本当。残りの半分は、ただ、あいつに食べてほしかっただけ」</p>", "<p>ルカは、しばらく黙っていた。</p>", "<p>それから、ぽつりと聞いた。</p>", "<p>「その妹は、今――」</p>", "<p>俺は、答えなかった。</p>", "<p>答えられなかった。</p>", "<p>ルカは、それ以上聞かなかった。</p>", "<p>ただ、俺の肩に、ごつい手を一度だけ置いた。</p>", "<p>「ミナを、助けてくれて、ありがとう」</p>", "<p class='star'>＊</p>", "<p>明け方、ミナが目を覚ました。</p>", "<p>熱は、すっかり下がっていた。</p>", "<p>「ユーゴ……おなか、すいた」</p>", "<p>その一言で、ルカが泣いた。</p>", "<p>声を殺して、肩を震わせて。</p>", "<p>俺は、見ないふりをして、また粥を炊いた。</p>", "<p class='star'>＊</p>", "<p>ミナがすっかり元気になった数日後。</p>", "<p>祠に行くと、ハルネが、いつもより小さく見えた。</p>", "<p>いや、気のせいじゃない。</p>", "<p>明らかに、背が縮んでいる。</p>", "<p>「ハルネ、お前……」</p>", "<p>「ミナが、くるしかったとき。わたし、すこしだけ、力をつかった」</p>", "<p>ハルネは、へへ、と笑った。</p>", "<p>「ユーゴのおかゆに、のせたの。この土地の、ちから」</p>", "<p>俺は、言葉を失った。</p>", "<p>あの粥が効いたのは、俺の料理だけじゃなかった。</p>", "<p>ハルネが、自分を削って――</p>", "<p>「ばか。そんなことしたら、お前が」</p>", "<p>「ミナは、まいにち、きのみをくれる。わたしの、いちばんの、ともだち」</p>", "<p>ハルネは、ひび割れた祠を見上げた。</p>", "<p>亀裂は、もう祠の半分まで届いていた。</p>", "<p>「ユーゴ。わたし、たぶん、あと――」</p>", "<p>「言うな」</p>", "<p>俺は、ハルネの前にしゃがみ込んだ。</p>", "<p>「なんとかする。方法を探す。だから、それ以上言うな」</p>", "<p>言いながら、自分の声が震えているのに気づいた。</p>", "<p>また、間に合わないのか。</p>", "<p>また、俺は――</p>", "<p>ハルネは、小さな手で、俺の頬に触れた。</p>", "<p>ひんやりと、冷たい手だった。</p>", "<p>「ユーゴは、やさしいね。でも、ユーゴも、たべてね。ちゃんと」</p>", "<p>それは、遠い昔に、誰かに言われた言葉に、よく似ていた。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">6</span>話　プロット</h3><p><b>依頼</b>熱を出したミナに卵粥</p><p><b>本筋</b>ハルネが力を削ってミナを救う</p><p><b>伏線</b>妹・澪の存在（過去・段階2）／「ユーゴも、たべてね」</p><p><b>共感</b>兄として重ねてしまう痛み</p><p><b>工程</b>中間転換</p>", "n": 6, "img": "images/ep06.jpg", "cap": "第6話　兄の作る卵粥"}, {"anchor": "", "title": "第<span class=\"tcy\">7</span>話 収穫祭の工程表と、調査官の帳面", "paras": ["<p>夏が過ぎ、二度目の秋が来た。</p>", "<p>今年も、ミルフェ村は豊作だった。</p>", "<p>ただ、去年ほどではなかった。</p>", "<p>麦の穂が、ほんの少し軽い。芋が、ほんの少し小さい。</p>", "<p>村人の誰も気づかないくらいの差だった。</p>", "<p>でも、セイルは気づいていた。</p>", "<p>「去年より、一割ほど少ないですね」</p>", "<p>畑の畦で、帳面を見ながら、セイルが言った。</p>", "<p>彼は結局、春から秋まで、ずっと村に滞在していた。</p>", "<p>「理由に、心当たりは？」</p>", "<p>「……さあ」</p>", "<p>俺は、目をそらした。</p>", "<p>ハルネのことは、まだ誰にも言っていない。</p>", "<p class='star'>＊</p>", "<p>「収穫祭をやろう」</p>", "<p>言い出したのは、オズワルド村長だった。</p>", "<p>「去年の冬を、誰一人欠けずに越えられた。その感謝を、ハルネ様に捧げたい。昔は毎年やっておったのじゃが、守り手がいなくなってから、いつの間にか途絶えてしもうてな」</p>", "<p>守り手。</p>", "<p>その言葉に、俺は顔を上げた。</p>", "<p>「祭りの差配を、ユーゴに頼みたい」</p>", "<p>「俺ですか」</p>", "<p>「冬支度の、あの工程表。あれで、祭りも回してくれんか」</p>", "<p>断る理由はなかった。</p>", "<p>それに、祭りでハルネに供え物をすれば、少しでも力が戻るかもしれない。</p>", "<p class='star'>＊</p>", "<p>祭りまで、二週間。</p>", "<p>集会所の壁に、また大きな表を書いた。</p>", "<p>料理班、飾りつけ班、舞台班、供物班。</p>", "<p>村人三十戸、百二十人。</p>", "<p>誰が何を得意で、誰が誰と仲が悪いか、この一年でだいたいわかっていた。</p>", "<p>「パン焼きはエルザさんの班。窯の火加減は、村で一番だから」</p>", "<p>「飾りつけは子どもたちと、手先の器用なボリスじいさん」</p>", "<p>「舞台は若い衆。力仕事だから、ルカがまとめ役」</p>", "<p>「供物は――ミナ。ハルネ様のことは、ミナが一番よく知ってる」</p>", "<p>ミナが、目を輝かせた。</p>", "<p>「それと、これ」</p>", "<p>表の端に、小さな欄を書き足した。</p>", "<p>『休憩』</p>", "<p>「……なんだい、これは」</p>", "<p>グレタ婆さんが、怪訝そうに覗き込んだ。</p>", "<p>「全員、半日ごとに必ず休む。休んでない人がいたら、班長が止める」</p>", "<p>「祭りの準備に、そんな悠長な」</p>", "<p>「無理して倒れたら、祭りどころじゃないですから」</p>", "<p>婆さんは、じっと俺を見た。</p>", "<p>「あんたが言うかね、それを」</p>", "<p>図星だった。</p>", "<p>俺はこの一年、自分の休憩欄を、一度も埋めたことがなかった。</p>", "<p class='star'>＊</p>", "<p>準備の最中、セイルが手伝いを申し出てきた。</p>", "<p>「調査の役に立つかもしれません。祭りの起源や、古い習わしを知りたい」</p>", "<p>彼は意外なほど器用で、飾りの紙細工を、子どもたちに混じって黙々と折っていた。</p>", "<p>「セイルさん、じょうず！」</p>", "<p>「王都の孤児院で育ったので。こういうのは、得意なんです」</p>", "<p>ミナに褒められて、セイルは少しだけ照れたように眼鏡を押し上げた。</p>", "<p>その夜、俺はセイルを夕食に誘った。</p>", "<p>グレタ婆さんとルカとミナと、五人で囲む食卓。</p>", "<p>燻製ハムと、根菜のスープと、焼きたてのパン。</p>", "<p>「……おいしい」</p>", "<p>セイルが、驚いたように呟いた。</p>", "<p>「温かい食事を、誰かと囲むのは、久しぶりです」</p>", "<p>「王都では？」</p>", "<p>「農務院の宿舎で、一人で。食事は、仕事をしながら」</p>", "<p>俺は、匙を止めた。</p>", "<p>その姿が、あまりにも見覚えがあった。</p>", "<p>「孤児院にいた頃、冬になると、毎年何人かが消えました。食べ物が足りなくて」</p>", "<p>セイルは、スープを見つめていた。</p>", "<p>「だから私は、農務院に入った。誰も飢えない国にしたかった。でも、去年は三千人です。私の帳面は、死んだ人の数を数えるためのものじゃないのに」</p>", "<p>誰も、何も言えなかった。</p>", "<p>「この村の豊作の理由が分かれば、王都を救えるかもしれない。私は、そのためならなんでもする」</p>", "<p>セイルの目は、真剣だった。</p>", "<p>悪意は、どこにもなかった。</p>", "<p>だからこそ、怖かった。</p>", "<p class='star'>＊</p>", "<p>収穫祭の当日は、よく晴れた。</p>", "<p>広場に屋台が並び、パンと燻製と蜂蜜酒の匂いが満ちた。</p>", "<p>子どもたちが紙の飾りを振って走り回り、若い衆が組んだ舞台で、村の娘たちが古い踊りを踊った。</p>", "<p>ミナが、祠への供物を運ぶ行列の先頭を歩いた。</p>", "<p>籠いっぱいの、新しい麦のパンと、燻製と、林檎と、木の実。</p>", "<p>祠の前に供物を並べると、ハルネが、樫の木の枝に腰かけて、ぽかんと口を開けていた。</p>", "<p>ミナと俺にしか見えない姿で。</p>", "<p>「……こんなに、たくさん」</p>", "<p>「みんなが、ハルネ様にありがとうって」</p>", "<p>ミナが、小さく手を振った。</p>", "<p>ハルネは、泣きそうな顔で笑った。</p>", "<p>その瞬間、祠の亀裂が、ほんのわずかに、閉じた。</p>", "<p class='star'>＊</p>", "<p>祭りの夜。</p>", "<p>焚き火の周りで踊る村人たちを、少し離れたところで眺めていると、セイルが隣に来た。</p>", "<p>「ユーゴさん」</p>", "<p>「はい」</p>", "<p>「祭りの最中、祠のそばで、帳面に変な数字が出ました」</p>", "<p>セイルは、懐から小さな水晶の計器を取り出した。</p>", "<p>農務院の、土地の力を測る道具だという。</p>", "<p>「祠の周りだけ、異常に強い反応がある。そして、供物を捧げた瞬間に、それが跳ね上がった」</p>", "<p>彼は、俺の目を、まっすぐ見た。</p>", "<p>「あの祠に、何がいるんですか」</p>", "<p>焚き火が、ぱちんと爆ぜた。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">7</span>話　プロット</h3><p><b>依頼</b>収穫祭の差配</p><p><b>本筋</b>豊作一割減、供物で亀裂が一瞬閉じる</p><p><b>伏線</b>『休憩』欄（自分は空欄）／セイルの水晶計器</p><p><b>共感</b>孤児院育ちのセイル</p><p><b>工程</b>積み上げ→疑問の提示</p>", "n": 7, "img": null, "cap": ""}, {"anchor": "祠は、真っ二つに割れていた。", "title": "第<span class=\"tcy\">8</span>話 割れた祠と、王都に移すという提案", "paras": ["<p>俺は、セイルに全部話した。</p>", "<p>ハルネのこと。祠の亀裂のこと。守り手がいなくなったこと。</p>", "<p>嘘をつき続けることは、できなかった。</p>", "<p>彼の帳面に並んだ三千という数字を、知ってしまったから。</p>", "<p>セイルは、黙って聞いていた。</p>", "<p>そして、最後に一言だけ言った。</p>", "<p>「……会わせてください」</p>", "<p class='star'>＊</p>", "<p>翌朝、ミナとセイルと三人で、祠へ向かった。</p>", "<p>森に入った瞬間、異変に気づいた。</p>", "<p>空気が、冷たい。</p>", "<p>秋の朝の冷たさじゃない。冬の、それも真冬の、骨にしみる冷たさ。</p>", "<p>木々の葉が、祠に近づくにつれて、茶色く枯れていた。</p>", "<p>足元の草も、色を失っている。</p>", "<p>「ハルネ様！」</p>", "<p>ミナが駆け出した。</p>", "<p>祠は、真っ二つに割れていた。</p>", "@@PIC", "<p>昨夜の祭りで少しだけ閉じた亀裂が、一晩で、祠を貫いていた。</p>", "<p>割れ目から、黒い霧のようなものが、細く、細く、空へと立ち上っている。</p>", "<p>その割れた祠の前に、ハルネが倒れていた。</p>", "<p>「ハルネ！」</p>", "<p>抱き起こすと、羽のように軽かった。</p>", "<p>姿が、さらに小さくなっている。四つか五つの、幼子の大きさ。</p>", "<p>白い髪の先が、透けかけていた。</p>", "<p>「……ユーゴ。ミナ」</p>", "<p>ハルネが、うっすらと目を開けた。</p>", "<p>「ごめんね。おまつり、うれしくて。がんばりすぎちゃった」</p>", "<p>「しゃべるな」</p>", "<p>「でも、いわなきゃ。きいて」</p>", "<p>ハルネは、黒い霧が昇っていく空を、震える指でさした。</p>", "<p>「わたしのちから、すわれてる。とおく、とおくに」</p>", "<p class='star'>＊</p>", "<p>セイルが、水晶の計器を取り出した。</p>", "<p>針が、振り切れていた。</p>", "<p>「……流れている。土地の力が、この祠から、どこかへ」</p>", "<p>セイルは、計器を空に向けて、ゆっくり回した。</p>", "<p>針が、ある一点で止まった。</p>", "<p>南。</p>", "<p>「王都の方角です」</p>", "<p>セイルの顔から、血の気が引いた。</p>", "<p>「南の穀倉地帯の不作。王都の飢饉。そして、辺境の村々の収穫が、五十年で六割に落ちたこと。全部、同じ方向を向いている」</p>", "<p>彼は、帳面を握りしめた。</p>", "<p>「誰かが、国中の土地の力を、王都に集めている」</p>", "<p>ハルネの言葉が、蘇った。</p>", "<p>――だれかが、すってる。</p>", "<p>「なら、その誰かを止めれば――」</p>", "<p>「それは、時間がかかります。王都の、それも中枢にいる誰かでなければ、こんな大がかりなことはできない」</p>", "<p>セイルは、ハルネを見下ろした。</p>", "<p>そして、震える声で言った。</p>", "<p>「……ハルネ様の、残っている力を、王都に移すことはできませんか」</p>", "<p class='star'>＊</p>", "<p>「何、言ってんだ」</p>", "<p>俺の声は、自分でも驚くほど低かった。</p>", "<p>「農務院には、土地の力を封じて運ぶ術があります。祠ごと、王都に。そうすれば、王都の畑に力が戻る。何万人も救える」</p>", "<p>「この村は、どうなる」</p>", "<p>「……この村の豊作は、なくなります。でも、ユーゴさんの保存食の技術があれば、普通の村として、冬は越せる」</p>", "<p>「ハルネは」</p>", "<p>セイルは、答えなかった。</p>", "<p>答えられないことが、答えだった。</p>", "<p>「ふざけるな」</p>", "<p>俺は立ち上がった。</p>", "<p>「ハルネは、ミナの友達なんだ。この村の、みんなの神様なんだ。燃料みたいに運んで使っていいもんじゃない」</p>", "<p>「わかっています！」</p>", "<p>セイルが、初めて声を荒げた。</p>", "<p>「わかっています。でも、王都では今この瞬間も、子どもが飢えて死んでいる。一つの村と、王都の何万人。私に、どちらを選べと言うんですか！」</p>", "<p>森が、しんと静まり返った。</p>", "<p>ミナが、ハルネを抱きしめて、泣いていた。</p>", "<p>「やだ……ハルネ様、つれてかないで……」</p>", "<p>セイルは、唇を噛んだ。</p>", "<p>そして、俺たちから目をそらした。</p>", "<p>「……農務院に、報告を送ります。判断は、上がします。それが、私の仕事です」</p>", "<p>彼は、森を出ていった。</p>", "<p>背中が、ひどく小さく見えた。</p>", "<p class='star'>＊</p>", "<p>その夜、村の集会所に、村人全員が集まった。</p>", "<p>俺とミナとルカで、全部を話した。</p>", "<p>ハルネのこと。祠のこと。力が吸われていること。</p>", "<p>このままだと、次の冬までに、村の豊作は消える。</p>", "<p>そして、王都に祠を移す話が、出ていること。</p>", "<p>集会所は、怒号と悲鳴で揺れた。</p>", "<p>「冗談じゃない！」</p>", "<p>「ハルネ様がいなくなったら、俺たちはどうなる！」</p>", "<p>「去年は誰も死ななかったのに、また冬に――」</p>", "<p>オズワルド村長が、杖で床を三度叩いた。</p>", "<p>静まった集会所で、村長は、ゆっくりと口を開いた。</p>", "<p>「……守り手が、おらんからじゃ」</p>", "<p>そして、部屋の隅を見た。</p>", "<p>「そうじゃろう、グレタ」</p>", "<p>全員の目が、一人の老婆に集まった。</p>", "<p>グレタ婆さんは、杖を握りしめたまま、俯いていた。</p>", "<p>「……ああ」</p>", "<p>かすれた声だった。</p>", "<p>「最後の守り手は、あたしだよ。五十年前に、逃げ出した」</p>", "<p class='star'>＊</p>", "<p>集会所を出た婆さんを、俺は追いかけた。</p>", "<p>婆さんは、村はずれの、俺の家の前で立ち止まっていた。</p>", "<p>かまどの煙突から、残り火の煙が細く上がっている。</p>", "<p>「……腹が減ったね」</p>", "<p>婆さんは、振り返らずに言った。</p>", "<p>「何か、作りな。流れ人」</p>", "<p>その背中は、初めて会った日より、ずっと小さく見えた。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">8</span>話　プロット</h3><p><b>依頼</b>セイルをハルネに会わせる</p><p><b>本筋</b>祠が割れる／力は王都へ／移送の提案</p><p><b>伏線</b>グレタ＝最後の守り手の告白</p><p><b>共感</b>一つの村か、何万人か</p><p><b>工程</b>危機の明確化</p>", "n": 8, "img": "images/ep08.jpg", "cap": "第8話　割れた祠"}, {"anchor": "", "title": "第<span class=\"tcy\">9</span>話 五十年前に逃げた守り手", "paras": ["<p>残っていた麦と、干し茸と、燻製を少し。</p>", "<p>根菜を刻んで、雑炊にした。</p>", "<p>婆さんは、黙って食べた。</p>", "<p>文句は、一つも言わなかった。</p>", "<p>半分ほど食べたところで、匙を置いた。</p>", "<p>「……あたしはね、十五で守り手になったんだ」</p>", "<p class='star'>＊</p>", "<p>守り手は、代々この村の、ある家の娘が継ぐものだった。</p>", "<p>毎朝祠を清め、季節ごとに供物を捧げ、ハルネ様の力を土地に流す。</p>", "<p>その代わり、守り手は、村から出られない。</p>", "<p>祠から半日以上離れると、ハルネ様とのつながりが切れてしまうから。</p>", "<p>「あたしの母親も、祖母も、そうやって一生をこの村で終えた。あたしもそうなるはずだった」</p>", "<p>婆さんは、窓の外の闇を見た。</p>", "<p>「でもね。二十のとき、好きな男ができたんだ。王都から来た、若い薬師見習いだった」</p>", "<p>婆さんの口元が、ほんのわずかに緩んだ。</p>", "<p>俺が初めて見る表情だった。</p>", "<p>「一緒に王都に来てくれって言われた。王都で薬を学んで、二人で診療所を開こうって」</p>", "<p>「……行ったんですか」</p>", "<p>「行ったよ。守り手の務めを捨てて。誰にも言わずに、夜中に村を出た」</p>", "<p>婆さんの声が、乾いていた。</p>", "<p>「王都の暮らしは、楽しかったよ。三年は。でも、男は流行り病で死んだ。あたしは一人で、薬師として食べていくしかなかった」</p>", "<p>「それで、村に戻った」</p>", "<p>「戻ったのは、それから四十年もあとさ。年寄りになって、行くところがなくなって」</p>", "<p>婆さんは、自分の手のひらを見つめた。</p>", "<p>節くれだった、薬草の染みがついた手。</p>", "<p>「戻ってきたら、ハルネ様は、もう姿を見せてくれなかった。祠に何度行っても、声もしなかった。あたしが捨てたんだから、当然だよ」</p>", "<p>「……違うと思います」</p>", "<p>婆さんが、顔を上げた。</p>", "<p>「ハルネは、ずっと待ってたんだと思います。守り手を。グレタさんを」</p>", "<p class='star'>＊</p>", "<p>翌朝、俺は婆さんを祠に連れていった。</p>", "<p>割れた祠の前で、ハルネは、ミナに抱かれて眠っていた。</p>", "<p>ミナは、一晩中、そこにいたらしい。</p>", "<p>ルカが毛布を持ってきて、二人にかけていた。</p>", "<p>婆さんが、杖をついて、ゆっくり近づいた。</p>", "<p>ハルネが、目を開けた。</p>", "<p>透けかけた小さな体で、婆さんを見上げた。</p>", "<p>「……グレタ？」</p>", "<p>婆さんの杖が、手から落ちた。</p>", "<p>「見えるのかい……あたしに……」</p>", "<p>「みえるよ。ずっと、みえてた。グレタが、みえなかっただけ」</p>", "<p>ハルネは、小さな手を伸ばした。</p>", "<p>「おかえり、グレタ」</p>", "<p>婆さんは、その場に崩れ落ちた。</p>", "<p>皺だらけの顔を両手で覆って、子どものように泣いた。</p>", "<p>「ごめんよ……ごめんよ、ハルネ様……あたしが逃げたから……あたしが……」</p>", "<p>「いいの。グレタは、しあわせだった？」</p>", "<p>「……っ」</p>", "<p>「おうとで、すきなひとと、いっしょで。しあわせだった？」</p>", "<p>婆さんは、しばらく嗚咽していた。</p>", "<p>それから、小さく、頷いた。</p>", "<p>「……三年だけだったけど。幸せだったよ」</p>", "<p>「よかった」</p>", "<p>ハルネは、笑った。</p>", "<p>「なら、いいの」</p>", "<p class='star'>＊</p>", "<p>婆さんが落ち着いてから、祠の前で、話し合った。</p>", "<p>俺と、婆さんと、ルカと、ミナ。そしてハルネ。</p>", "<p>「守り手の務めを、もう一度やれば、祠は直りますか」</p>", "<p>俺が聞くと、婆さんは首を振った。</p>", "<p>「祠を直す儀式は、知ってる。でも、それだけじゃ足りない。吸われていく力を、上回る力を、ハルネ様に戻さなきゃならない」</p>", "<p>「力を戻す方法は」</p>", "<p>「昔はね、村じゅうの人が、心を込めて作ったものを捧げた。その年の収穫で、その土地の人の手で作ったもの。それが、ハルネ様の力になった」</p>", "<p>婆さんは、俺を見た。</p>", "<p>「あんたの料理が、ハルネ様に効いたのは、そういうことさ。あんたは、この土地のものを、この土地の人のために、本気で作った。それが、力になったんだ」</p>", "<p>「なら」</p>", "<p>ルカが、身を乗り出した。</p>", "<p>「村じゅうで、作ればいい。ユーゴの工程表で。収穫祭の何倍もの供物を」</p>", "<p>「足りるかどうか、わからないよ」</p>", "<p>「やってみなきゃわからないだろ」</p>", "<p>ルカの目は、まっすぐだった。</p>", "<p>一年前、俺を畑で警戒していた少年の目とは、まるで違った。</p>", "<p>「でも、時間がない」</p>", "<p>婆さんが、割れた祠を見た。</p>", "<p>「この割れ方なら、もって冬至まで。それまでに、すべてを揃えなきゃならない」</p>", "<p>冬至まで、あと四十日。</p>", "<p class='star'>＊</p>", "<p>その夜、セイルが俺の家を訪ねてきた。</p>", "<p>王都からの、返事の手紙を持って。</p>", "<p>「農務院の上層部は、祠の移送を承認しました。冬至の前に、移送隊が来ます」</p>", "<p>セイルの顔は、蒼白だった。</p>", "<p>「……それと、もう一つ」</p>", "<p>彼は、手紙の最後の行を指でなぞった。</p>", "<p>「移送の命令を出したのは、農務院じゃない。宮廷の、魔導顧問室です。私は、その部署の存在すら、知らなかった」</p>", "<p>宮廷の、魔導顧問。</p>", "<p>王都の奥。誰にも見えない地図。</p>", "<p>「セイルさん」</p>", "<p>俺は、彼の目を見た。</p>", "<p>「冬至まで、四十日あります。手伝ってくれませんか」</p>", "<p>「何を」</p>", "<p>「祠を、直します。そして、王都にも、ちゃんと届く方法を探します」</p>", "<p>セイルは、しばらく俺を見つめていた。</p>", "<p>そして、眼鏡を外して、目元を押さえた。</p>", "<p>「……私は、命令に逆らうことになります」</p>", "<p>「わかってます」</p>", "<p>「首になるかもしれない」</p>", "<p>「その時は、うちで働けばいい。帳面つける人、ちょうど欲しかったんです」</p>", "<p>セイルは、小さく吹き出した。</p>", "<p>初めて見る、彼の笑顔だった。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">9</span>話　プロット</h3><p><b>依頼</b>グレタ婆さんの昔話</p><p><b>本筋</b>守り手の再起／冬至まで四十日</p><p><b>伏線</b>魔導顧問室の命令／セイル協力へ</p><p><b>共感</b>「おかえり、グレタ」</p><p><b>工程</b>第1編・後半の目標設定</p>", "n": 9, "img": null, "cap": ""}, {"anchor": "「……『人のためばっかりじゃなくて、自分も大事にしてね』って」", "title": "第<span class=\"tcy\">10</span>話 間に合わなかった誕生日と、名前の由来", "paras": ["<p>冬至まで、あと三十日。</p>", "<p>集会所の壁の工程表は、収穫祭のときの三倍の大きさになっていた。</p>", "<p>村じゅうの食材で、ハルネへの供物を作る。</p>", "<p>燻製、塩漬け、酢漬け、蜂蜜漬け、焼き菓子、干し果物。</p>", "<p>同時に、村の冬支度も進めなければならない。</p>", "<p>供物に全部回したら、今度は村人が冬を越せない。</p>", "<p>段取りは、ぎりぎりだった。</p>", "<p>いや、ぎりぎりを、少し超えていた。</p>", "<p>だから俺は、自分の欄を増やした。</p>", "<p>燻製小屋の火の番。夜通し。</p>", "<p>酢の仕込み。明け方。</p>", "<p>工程の確認と、班の調整。昼。</p>", "<p>供物の味見と、仕上げ。夕方から夜。</p>", "<p>自分の『休憩』の欄は、消した。</p>", "<p class='star'>＊</p>", "<p>「ユーゴ、寝てるのか」</p>", "<p>ルカに聞かれるたび、「寝てるよ」と答えた。</p>", "<p>嘘だった。</p>", "<p>燻製小屋の煙の中で、目をこすりながら火を見ていると、懐かしい感覚が戻ってきた。</p>", "<p>三十時間ぶっ通しの、あの頭の痺れ。</p>", "<p>手足の先が、少しずつ冷えていく感じ。</p>", "<p>でも、止まれなかった。</p>", "<p>止まったら、また間に合わない。</p>", "<p class='star'>＊</p>", "<p>二十日目の夕方。</p>", "<p>供物の燻製を吊るそうとして、梯子を登ったところで、視界が白くなった。</p>", "<p>気づいたら、床に倒れていた。</p>", "<p>「ユーゴ！」</p>", "<p>ルカの声。ミナの泣き声。</p>", "<p>誰かに担がれて、どこかに運ばれた。</p>", "<p>目が覚めると、グレタ婆さんの家の寝台にいた。</p>", "<p>薬草の匂いがした。</p>", "<p>窓の外は、もう夜だった。</p>", "<p>「……馬鹿だね、あんたは」</p>", "<p>寝台の横で、婆さんが薬を煎じていた。</p>", "<p>「三日、ろくに寝てなかったろ。ルカが、燻製小屋の灰が冷えたことがないって言ってたよ」</p>", "<p>「すみません。でも、工程が」</p>", "<p>「工程は、ルカとセイルが回してる。あんたの表のとおりに。誰も困っちゃいないよ」</p>", "<p>婆さんは、煎じ薬の椀を俺の手に押しつけた。</p>", "<p>「飲みな。それから、話しな」</p>", "<p>「……何をですか」</p>", "<p>「あんたが、なんでそこまで自分を削るのか」</p>", "<p class='star'>＊</p>", "<p>苦い薬を、ひと口飲んだ。</p>", "<p>喉の奥が、焼けるように熱かった。</p>", "<p>「……妹がいたんです。澪っていう」</p>", "<p>ルカには、半分だけ話した。</p>", "<p>今度は、全部話そうと思った。</p>", "<p>「両親は、小さな定食屋をやってました。俺が十五のとき、二人とも事故で死にました。澪は八つでした」</p>", "<p>婆さんは、黙って聞いていた。</p>", "<p>「澪は、生まれつき心臓が弱くて。すぐ食欲がなくなるんです。だから俺は、毎日、何なら食べてくれるか考えて、作りました。父さんの店の味を思い出しながら。粥も、スープも、味噌汁も」</p>", "<p>「みそしる？」</p>", "<p>「豆を発酵させた調味料で作る、汁物です。父さんの店の看板で。父さんは毎朝、店の誰より早く起きて、出汁を取ってました」</p>", "<p>あの湯気の匂いを、今でも覚えている。</p>", "<p>「澪の治療には、金がかかりました。だから俺は、働きました。昼も夜も。会社に泊まり込んで、病院には週に一度しか行けなくなって」</p>", "<p>婆さんの手が、止まった。</p>", "<p>「澪の、二十歳の誕生日。約束してたんです。その日だけは、絶対に早く帰って、病院の厨房を借りて、父さんの味噌汁を作るって。澪が、一番好きだったから」</p>", "<p>声が、詰まった。</p>", "<p>「……でも、その日、仕事が終わらなくて。終わらせなきゃいけない納期があって。病院に着いたのは、夜中の一時でした」</p>", "<p>婆さんは、何も言わなかった。</p>", "<p>「澪は、もう、意識がなくて。そのまま、明け方に」</p>", "<p>涙は、出なかった。</p>", "<p>何年も前に、出しきってしまったから。</p>", "<p>「あいつ、ずっと待ってたらしいです。看護師さんが言ってました。『お兄ちゃんのお味噌汁、まだかな』って、何度も」</p>", "<p class='star'>＊</p>", "<p>かまどの火が、ぱちりと鳴った。</p>", "<p>「それから、俺は、ただ働きました。澪の葬式が終わって、次の日には会社にいました。止まったら、考えてしまうから。間に合わなかったことを」</p>", "<p>「それで、倒れて、ここに来たのかい」</p>", "<p>「たぶん」</p>", "<p>婆さんは、長い息をついた。</p>", "<p>「……あんた、名前の意味は、なんだい。ゆうご、ってのは」</p>", "<p>不意の質問に、俺は少し戸惑った。</p>", "<p>「湯、は、お湯の湯です。父さんがつけました。『冷えて帰ってきた人を、温かい一杯で迎えられる子になれ』って。店の味噌汁みたいに」</p>", "<p>「いい名前じゃないか」</p>", "<p>「吾、は、自分っていう意味で。母さんが」</p>", "<p>言いかけて、俺は止まった。</p>", "<p>母さんの口癖を、思い出した。</p>", "<p>店で働きづめの父さんに、いつも言っていた言葉。</p>", "<p>俺が澪の看病で徹夜したとき、母さんが生きていたら、きっと言っただろう言葉。</p>", "<p>「……『人のためばっかりじゃなくて、自分も大事にしてね』って」</p>", "@@PIC", "<p>声が、震えた。</p>", "<p>「母さんの口癖でした。だから、吾、って字を入れたんだって」</p>", "<p>婆さんが、俺の手を取った。</p>", "<p>しわだらけの、温かい手だった。</p>", "<p>「あんたは、親父さんの願いだけを、守ってきたんだね」</p>", "<p>「……」</p>", "<p>「母親の願いのほうは、ずっと、置き去りにしてきた」</p>", "<p>その瞬間、喉の奥から、何かがせり上がってきた。</p>", "<p>何年も出なかったものが。</p>", "<p>「……っ」</p>", "<p>俺は、泣いた。</p>", "<p>婆さんの手を握ったまま、子どものように。</p>", "<p>婆さんは、何も言わずに、ずっと手を握っていてくれた。</p>", "<p class='star'>＊</p>", "<p>どれくらい経っただろう。</p>", "<p>戸口に、人の気配がした。</p>", "<p>ルカと、ミナと、セイルだった。</p>", "<p>三人とも、目が赤かった。</p>", "<p>たぶん、途中から聞いていたのだろう。</p>", "<p>ミナが、小さな椀を持っていた。</p>", "<p>「ユーゴ。これ、つくったの」</p>", "<p>湯気の立つ、少し不格好な、野菜のスープだった。</p>", "<p>「ユーゴがいつも作ってるの、見てたから。お兄ちゃんとセイルさんと、三人で」</p>", "<p>ひと口、飲んだ。</p>", "<p>塩が少しきつかった。野菜が少し硬かった。</p>", "<p>今まで飲んだ、どんなスープよりも、温かかった。</p>", "<p>「……おいしいよ」</p>", "<p>「ほんと？」</p>", "<p>「ほんと」</p>", "<p>ミナが、ぱっと笑った。</p>", "<p>「ユーゴ」</p>", "<p>ルカが、ぶっきらぼうに言った。</p>", "<p>「工程表の、お前の欄。俺が書き直しといた。『休憩』、ちゃんと入れたからな」</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">10</span>話　プロット</h3><p><b>依頼</b>倒れた湯吾を看病する婆さん</p><p><b>本筋</b>供物づくりの総力戦</p><p><b>伏線</b>名前の由来・誕生日の後悔（過去・段階3回収）</p><p><b>共感</b>母の二つ目の願いに気づく</p><p><b>工程</b>主人公の内面の転換</p>", "n": 10, "img": "images/ep10.jpg", "cap": "第10話　名前の由来"}, {"anchor": "", "title": "第<span class=\"tcy\">11</span>話 逃げてもいいと言われた夜に、俺は残ると決めた", "paras": ["<p>冬至まで、あと七日。</p>", "<p>供物は、予定の八割まで揃っていた。</p>", "<p>ルカとセイルが、俺の工程表を回し続けてくれたおかげだった。</p>", "<p>俺は、一日に二回、必ず休憩を取るようになった。</p>", "<p>ルカが見張っていて、取らないと燻製小屋から叩き出されるからだ。</p>", "<p>その日の夕方。</p>", "<p>村の入り口に、移送隊がやってきた。</p>", "<p>黒い外套の兵士が十人。</p>", "<p>先頭に立つのは、背の高い、表情のない男だった。</p>", "<p>胸に、見たことのない紋章。蛇が麦の穂を咥えている。</p>", "<p>「宮廷魔導顧問室、移送官のクラウスだ。土地神の祠を、王都へ移送する」</p>", "<p>男の声には、抑揚がなかった。</p>", "<p>「冬至の夜、祠の力が最も弱まる。その時に封じて運ぶ。それまで、村人は祠に近づくな」</p>", "<p class='star'>＊</p>", "<p>セイルが、移送官の前に進み出た。</p>", "<p>「待ってください。私は農務院の調査官です。祠の修復の目処が立っています。移送は――」</p>", "<p>「農務院に、この件の権限はない」</p>", "<p>クラウスは、セイルを一瞥した。</p>", "<p>「アーヴィング調査官。君の報告は、よく役に立った。君の帳面がなければ、この村の祠を見つけるのに、あと十年はかかっただろう」</p>", "<p>セイルの顔が、凍りついた。</p>", "<p>「……役に、立った？」</p>", "<p>「この五十年、我々は国中の土地神を探してきた。ほとんどは、もう吸い尽くした。この祠が、最後に近い」</p>", "<p>吸い尽くした。</p>", "<p>ハルネの言葉が、またよみがえる。</p>", "<p>「あなたたちが……王都の飢饉の原因を……」</p>", "<p>「原因？　違う。我々は、王都を守っている。顧問閣下のお考えは、君のような下級官吏には理解できん」</p>", "<p>クラウスは、背を向けた。</p>", "<p>「冬至の夜まで、村の外れに陣を張る。邪魔をすれば、反逆とみなす」</p>", "<p class='star'>＊</p>", "<p>その夜、俺の家に、ルカとミナとグレタ婆さんとセイルが集まった。</p>", "<p>食卓には、温かいシチューと、焼きたてのパン。</p>", "<p>どんな時でも、飯は食う。それが、この村の決まりになっていた。</p>", "<p>「……逃げるなら、今だよ」</p>", "<p>食後、婆さんが、ぽつりと言った。</p>", "<p>「あんたは流れ人だ。この村に、義理なんかない。冬至の夜に連中とやりあったら、どうなるかわからない」</p>", "<p>婆さんは、俺を見た。</p>", "<p>「あんたは、ずっと人のために自分を削ってきた。ここでまた、同じことをしなくていい。南の港町にでも行って、のんびり飯屋でもやればいい。それも、自分を大事にするってことだよ」</p>", "<p>ルカが、何か言いかけて、黙った。</p>", "<p>ミナが、俺の袖を握った。</p>", "<p>セイルも、静かに言った。</p>", "<p>「ユーゴさん。私のせいで、この村は見つかった。あなたまで、巻き込むわけにはいかない」</p>", "<p>俺は、黙っていた。</p>", "<p>逃げてもいい。</p>", "<p>そう言われたのは、生まれて初めてだった。</p>", "<p>前の世界で、誰かにそう言ってもらえていたら。</p>", "<p>もしかしたら、俺は――</p>", "<p class='star'>＊</p>", "<p>外に出た。</p>", "<p>雪が、降り始めていた。</p>", "<p>祠の方角の森が、暗く沈んでいる。</p>", "<p>その上空に、黒い霧が、細い糸のように南へと伸びているのが見えた。</p>", "<p>「ユーゴ」</p>", "<p>いつの間にか、ハルネが隣にいた。</p>", "<p>もう、三つか四つの幼子の大きさだった。</p>", "<p>透けた髪に、雪がすり抜けていく。</p>", "<p>「にげて、いいよ」</p>", "<p>「お前まで、そう言うのか」</p>", "<p>「ユーゴが、つらいのは、いや」</p>", "<p>ハルネは、俺の手を握った。</p>", "<p>もう、ほとんど感触がなかった。</p>", "<p>「ユーゴは、いっぱい、くれた。ハム、りんご、おかゆ、スープ。ミナのともだちを、たすけてくれた。グレタを、つれてきてくれた。もう、じゅうぶん」</p>", "<p>俺は、しゃがんで、ハルネと目線を合わせた。</p>", "<p>「ハルネ。俺さ、前の世界で、一回、間に合わなかったんだ」</p>", "<p>「……うん」</p>", "<p>「大事な約束に。たった一杯の味噌汁に。それで、一番大事な人が、待ったまま、いなくなった」</p>", "<p>ハルネは、黙って聞いていた。</p>", "<p>「あれから、ずっと思ってた。俺が自分を削ってでも、もっと早く走っていれば、間に合ったんじゃないかって」</p>", "<p>雪が、静かに積もっていく。</p>", "<p>「でも、違ったんだよな。母さんが言ってたのは、そういうことじゃなかった」</p>", "<p>自分も大事にしてね。</p>", "<p>それは、ひとりで全部背負うな、という意味だった。</p>", "<p>倒れるまで走るな、という意味だった。</p>", "<p>誰かを温めたいなら、まず自分が冷えきるな、という意味だった。</p>", "<p>「今度は、ひとりで走らない。ルカがいる。ミナがいる。グレタさんも、セイルも、村のみんなもいる。俺の欄には、休憩がちゃんと書いてある」</p>", "<p>俺は、立ち上がった。</p>", "<p>「だから、逃げない。今度は、みんなで、間に合わせる」</p>", "<p class='star'>＊</p>", "<p>家に戻ると、四人がまだ食卓にいた。</p>", "<p>誰も、帰っていなかった。</p>", "<p>「残ります」</p>", "<p>俺がそう言うと、ルカが、ふっと息を吐いて笑った。</p>", "<p>「知ってた」</p>", "<p>「……知ってた？」</p>", "<p>「お前、工程表に、冬至の次の日の欄まで書いてたろ。『みんなで朝飯』って」</p>", "<p>婆さんが、鼻を鳴らした。</p>", "<p>「まったく、馬鹿な流れ人だね」</p>", "<p>でも、その目は、笑っていた。</p>", "<p>「冬至の夜。祠の儀式は、あたしがやる。五十年ぶりの、守り手の務めだ」</p>", "<p>セイルが、眼鏡を押し上げた。</p>", "<p>「移送隊の術式の構造は、農務院の資料で見たことがあります。封じる力より、祠に戻る力が強ければ、術は成立しない。それと――」</p>", "<p>彼は、帳面を開いた。</p>", "<p>「祠の力を王都に『奪って』運ぶのではなく、『分けて』届ける方法。一つ、考えがあります」</p>", "<p>ミナが、俺の手を握った。</p>", "<p>「わたしは、ハルネ様のそばにいる。ずっと」</p>", "<p>外では、雪が強くなっていた。</p>", "<p>冬至まで、あと七日。</p>", "<p class='after'>（後書き）読んでくださってありがとうございます。次話もぜひ。</p>"], "plot": "<h3>第<span class=\"tcy\">11</span>話　プロット</h3><p><b>依頼</b>移送隊の到着</p><p><b>本筋</b>敵の正体：土地神を吸い尽くす顧問室</p><p><b>伏線</b>「逃げていい」と言われる／冬至翌日の欄</p><p><b>共感</b>逃げずに、ひとりで走らずに残る選択</p><p><b>工程</b>クライマックス直前の選択</p>", "n": 11, "img": null, "cap": ""}, {"anchor": "泣きながら、笑った。", "title": "第<span class=\"tcy\">12</span>話 冬至の夜、みんなで結ぶ一杯の味噌汁", "paras": ["<p>冬至の日は、朝から雪だった。</p>", "<p>集会所の工程表は、最後の一列だけが空いていた。</p>", "<p>『冬至の夜』。</p>", "<p>そこに、村人百二十人の名前が、全部書き込まれていた。</p>", "<p class='star'>＊</p>", "<p>日が落ちると、村じゅうの家から、人が出てきた。</p>", "<p>手に手に、籠や樽や瓶を抱えて。</p>", "<p>燻製ハム。ザワークラウト。根菜の酢漬け。蜂蜜漬けの林檎。干し葡萄のパン。</p>", "<p>この一年、村の人たちが自分の手で作ってきたものだった。</p>", "<p>松明の列が、雪の森へと続いていく。</p>", "<p>先頭は、杖をついたグレタ婆さん。</p>", "<p>その後ろに、ハルネを抱いたミナ。</p>", "<p>ルカと、セイルと、俺。</p>", "<p>祠の前には、すでに移送隊が陣を張っていた。</p>", "<p>地面に、蛇と麦の穂の紋様が、黒い光で描かれている。</p>", "<p>その中心で、割れた祠が、黒い霧を吐き続けていた。</p>", "<p>「近づくなと言ったはずだ」</p>", "<p>クラウスが、こちらを振り向いた。</p>", "<p>兵士たちが、槍を構えた。</p>", "<p>グレタ婆さんが、一歩、前に出た。</p>", "<p>「ここは、守り手の場所だよ。どきな、若造」</p>", "<p>「守り手？　五十年前に逃げた女が、何を――」</p>", "<p>「ああ、逃げたさ。だから、戻ってきたんだ」</p>", "<p>婆さんは、杖で、雪の地面を三度叩いた。</p>", "<p>祠の周りの雪が、ふわりと舞い上がった。</p>", "<p class='star'>＊</p>", "<p>婆さんが、古い言葉で祝詞を唱え始めた。</p>", "<p>五十年ぶりのはずなのに、その声は、少しも途切れなかった。</p>", "<p>村人たちが、一人ずつ、祠の前に供物を置いていく。</p>", "<p>「ハルネ様。去年の冬、うちの婆ちゃんを生かしてくれて、ありがとう」</p>", "<p>「ハルネ様。今年の麦で焼いたパンです」</p>", "<p>「ハルネ様、うちの子が、初めて燻製を作りました」</p>", "<p>一つ置かれるたびに、祠の亀裂から漏れる黒い霧が、少しずつ、細くなっていく。</p>", "<p>「止めろ！　術式を急げ！」</p>", "<p>クラウスが叫んだ。</p>", "<p>兵士たちが、紋様に手をかざした。</p>", "<p>黒い光が強くなり、祠が、きしんだ。</p>", "<p>ハルネが、ミナの腕の中で、苦しそうに身をよじった。</p>", "<p>「ハルネ様！」</p>", "<p>「――足りない」</p>", "<p>婆さんが、祝詞の合間に、絞り出すように言った。</p>", "<p>「供物だけじゃ、あと一押し、足りない」</p>", "<p class='star'>＊</p>", "<p>俺は、背負ってきた荷を、雪の上に下ろした。</p>", "<p>鍋と、小さなかまど石と、炭。</p>", "<p>そして、一年かけて仕込んできた、小さな樽。</p>", "<p>蓋を開けると、懐かしい匂いが立ちのぼった。</p>", "<p>「……ユーゴ、それ」</p>", "<p>「味噌だよ」</p>", "<p>この世界の豆と、塩と、麦麹で、去年の冬から仕込んできた。</p>", "<p>誰にも言わずに。</p>", "<p>いつか、誰かのために作れる日が来たら、と思って。</p>", "<p>かまど石を組み、炭に火をつけた。</p>", "<p>鍋に、村の井戸水。</p>", "<p>干し茸と、川魚の燻製で、出汁を取る。</p>", "<p>父さんが、毎朝そうしていたように。</p>", "<p>湯が沸くまでの間、俺は、空を見上げた。</p>", "<p>雪が、松明の明かりの中で、金色に光っていた。</p>", "<p>――澪。</p>", "<p>今日は、間に合わせるよ。</p>", "<p>でも今度は、ひとりじゃないんだ。</p>", "<p>「ルカ、芋を切ってくれ。ミナ、葱をちぎって。グレタさん、祝詞は続けて。セイル」</p>", "<p>「はい」</p>", "<p>「術式のほう、頼む」</p>", "<p>セイルは頷いて、移送隊の紋様の端に、農務院の水晶の計器を、次々と突き立てていった。</p>", "<p>「何をしている、アーヴィング！」</p>", "<p>「流れを、組み替えています」</p>", "<p>セイルは、クラウスを振り返らなかった。</p>", "<p>「あなたたちの術は、祠の力を奪って王都に送る一本道だ。だから、逆にする。祠の力を、この村で作られた食べ物に宿して、運べる形にする。奪うんじゃない。分けて、届けるんです」</p>", "<p class='star'>＊</p>", "<p>味噌を、溶いた。</p>", "<p>湯気が、立ちのぼった。</p>", "<p>その湯気が、雪の夜空に、白く、まっすぐに昇っていった。</p>", "<p>一杯目を、椀によそった。</p>", "<p>ハルネの前に、しゃがんだ。</p>", "<p>「ハルネ。味噌汁だ。俺の、父さんの味」</p>", "<p>ハルネが、透けかけた手で、椀を受け取った。</p>", "<p>小さな口で、ひと口。</p>", "<p>ハルネの体が、光った。</p>", "<p>最初は、ろうそくくらいの、小さな光だった。</p>", "<p>それが、村人たちの供物の一つ一つに、ぽつ、ぽつと灯っていった。</p>", "<p>燻製に。漬物に。パンに。林檎に。</p>", "<p>みんなが一年かけて作った、手の跡のついたものに。</p>", "<p>光の糸が、祠に集まっていく。</p>", "<p>割れ目が、縫い合わされるように閉じていく。</p>", "<p>「ばかな……術式が……」</p>", "<p>クラウスの足元の紋様が、ひび割れた。</p>", "<p>黒い光が、雪に溶けるように消えていった。</p>", "<p class='star'>＊</p>", "<p>光がおさまったとき、祠は、元の形に戻っていた。</p>", "<p>苔むした、小さな石の祠。</p>", "<p>亀裂は、一本もなかった。</p>", "<p>その屋根の上に、ハルネが座っていた。</p>", "<p>六つか七つの、初めて会ったときの姿で。</p>", "<p>白い髪が、もう透けていなかった。</p>", "<p>「……ユーゴ」</p>", "<p>ハルネが、空になった椀を、両手で差し出した。</p>", "<p>「おかわり」</p>", "<p>村じゅうが、笑った。</p>", "<p>泣きながら、笑った。</p>", "@@PIC", "<p>ミナがハルネに飛びついた。</p>", "<p>ルカが、俺の背中を、思いきり叩いた。</p>", "<p>グレタ婆さんは、杖にすがって、何度も何度も、空を見上げていた。</p>", "<p>「……間に合ったね、流れ人」</p>", "<p>「みんなで、間に合わせたんです」</p>", "<p class='star'>＊</p>", "<p>クラウスと移送隊は、その夜のうちに、村を去った。</p>", "<p>紋様が消えた以上、彼らには何もできなかった。</p>", "<p>「顧問閣下に、伝えておく」</p>", "<p>去り際に、クラウスはそれだけ言った。</p>", "<p>表情は、最後まで読めなかった。</p>", "<p class='star'>＊</p>", "<p>冬至の翌朝。</p>", "<p>工程表の、最後の欄。</p>", "<p>『みんなで朝飯』</p>", "<p>集会所に、村人全員が集まった。</p>", "<p>大鍋の味噌汁と、焼きたてのパンと、燻製と、漬物。</p>", "<p>ハルネも、ミナの隣で、ちゃっかり椀を抱えていた。</p>", "<p>セイルは、帳面を広げていた。</p>", "<p>「ハルネ様の力を宿した保存食は、普通の保存食の何倍も、土地を癒す力があります。王都の痩せた畑に撒けば、少しずつ回復する。食べれば、飢えた人の体が持ち直す」</p>", "<p>「つまり」</p>", "<p>「この村の保存食を、王都に届ければいい。春までに、樽で百」</p>", "<p>ルカが、目を丸くした。</p>", "<p>「百！？」</p>", "<p>「工程表、引けますか、ユーゴさん」</p>", "<p>「……納期、春まで？」</p>", "<p>「春まで」</p>", "<p>俺は、少し考えて、笑った。</p>", "<p>「引けるよ。休憩込みで」</p>", "<p class='star'>＊</p>", "<p>春。</p>", "<p>雪解けの道を、樽を積んだ荷車の列が、南へ向かっていった。</p>", "<p>先導するのは、セイル。</p>", "<p>道案内には、例の行商人、ジュードが手を挙げてくれた。</p>", "<p>「いやあ、とうとう流れ人の保存食が王都に！　これは商売になりますな！」</p>", "<p>「売りませんよ。届けるんです」</p>", "<p>「わかってますとも。ところで――」</p>", "<p>ジュードは、眼鏡の奥で、意味ありげに笑った。</p>", "<p>「東の砂漠の井戸掘りの流れ人と、西の島の船大工の流れ人。そのうち、会ってみませんか。似たような悩みを、抱えてるらしいですよ」</p>", "<p>荷車が見えなくなるまで、俺は丘の上で手を振った。</p>", "<p>隣には、ルカと、ミナと、グレタ婆さんと、ハルネ。</p>", "<p>「ユーゴ」</p>", "<p>ルカが言った。</p>", "<p>「俺さ、来年、王都の学校、受けてみようと思う。農学を学びたい。畑は――」</p>", "<p>「俺が見るよ。ミナもいるし」</p>", "<p>「……頼む」</p>", "<p>ルカは、照れくさそうに頭をかいた。</p>", "<p>「おなかすいた」</p>", "<p>ハルネが言って、ミナが笑った。</p>", "<p>「ユーゴ、きょうのおひるは？」</p>", "<p>俺は、空を見上げた。</p>", "<p>高くて、柔らかい、春の空だった。</p>", "<p>「味噌汁、作ろうか。みんなで」</p>", "<p class='star'>＊</p>", "<p>同じ頃。</p>", "<p>王都レグナスの、宮殿の一番深い部屋。</p>", "<p>黒衣の男が、誰にも見えない地図を見下ろしていた。</p>", "<p>北の辺境の一点に灯っていた、消えかけの光が――</p>", "<p>今は、春の野火のように、強く、明るく、燃えている。</p>", "<p>「……面白い」</p>", "<p>男は、細い指で、その光をなぞった。</p>", "<p>「流れ人、か」</p>", "<p>（第一章 完）</p>", "<p class='after'>（後書き）第一章、完結です。湯吾たちの次の冬もお楽しみに。</p>"], "plot": "<h3>第<span class=\"tcy\">12</span>話　プロット</h3><p><b>依頼</b>冬至の夜の儀式とみんなの朝飯</p><p><b>本筋</b>封印の結び直し／力を『分けて届ける』</p><p><b>伏線</b>味噌の樽の回収／黒衣の男「流れ人、か」（次章へ）</p><p><b>共感</b>みんなで間に合わせた一杯</p><p><b>工程</b>第1編の決着→第2編の引き</p>", "n": 12, "img": "images/ep12.jpg", "cap": "第12話　冬至の夜の味噌汁"}], "cover": "images/cover.jpg", "title": "社畜だった俺、辺境の村で味噌汁を作ったら土地神様に懐かれました", "sub": "〜冬を越せる保存食は、ただの家庭料理なんですが〜"};const book=document.getElementById('book');
let SEC='cover';function pg(cls){const d=document.createElement('section');d.className='pg '+cls;d.dataset.sec=SEC;book.appendChild(d);return d}
function over(el){return el.scrollWidth>el.clientWidth+1||el.scrollHeight>el.clientHeight+1}
function flow(blocks,mk,onPic){ // mk() returns text container in new page
  let box=mk();
  for(const h of blocks){
    if(h==='@@PIC'){if(!box.children.length)box.closest('.pg').remove();onPic();box=mk();continue}
    const t=document.createElement('div');t.innerHTML=h;const el=t.firstElementChild;
    box.appendChild(el);
    if(!over(box))continue;
    box.removeChild(el);
    if(box.children.length>(box.dataset.min|0)){box=mk();box.appendChild(el);if(!over(box))continue;box.removeChild(el)}
    // split long paragraph by characters
    let txt=el.innerHTML, tag=el.tagName, cls=el.className;
    while(txt.length){
      const p=document.createElement(tag);p.className=cls;box.appendChild(p);
      let lo=1,hi=txt.length,best=0;
      while(lo<=hi){const m=(lo+hi)>>1;p.innerHTML=txt.slice(0,m);if(over(box))hi=m-1;else{best=m;lo=m+1}}
      if(best===0){box.removeChild(p);box=mk();continue}
      p.innerHTML=txt.slice(0,best);txt=txt.slice(best);
      if(txt.length){box=mk();cls+=' cont'}
    }
  }
}

let wAcc=0,wLock=false,wT,wLast=0;
addEventListener('wheel',e=>{if(e.ctrlKey)return;const k=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;const dx=e.deltaX*k,dy=e.deltaY*k;if(!act&&Math.abs(dy)>=Math.abs(dx))return;e.preventDefault();const d=Math.abs(dx)>Math.abs(dy)?-dx:dy;
 clearTimeout(wT);wT=setTimeout(()=>{wLock=false;wAcc=0},220);if(wLock||performance.now()-wLast<380)return;wAcc+=d;if(Math.abs(wAcc)>=30){go(cur+(wAcc>0?1:-1));save();wLock=true;wLast=performance.now()}},{passive:false});
let rt,lw=innerWidth,lh=innerHeight;addEventListener('resize',()=>{if(innerWidth===lw&&Math.abs(innerHeight-lh)<120)return;lw=innerWidth;lh=innerHeight;clearTimeout(rt);rt=setTimeout(()=>{const l=loc();ready=false;build();go(resolve(l));ready=true},250)});
addEventListener('hashchange',()=>{go(resolve(fromHash()))});
const th=document.getElementById('theme');function setTheme(t){document.documentElement.classList.toggle('dark',t==='dark');th.textContent=t==='dark'?'☀':'☾';th.title=t==='dark'?'ライトにする':'ダークにする';try{localStorage.setItem('yugo-theme',t)}catch(e){}document.querySelector('meta[name=theme-color]').content=t==='dark'?'#121212':'#ffffff'}
setTheme(document.documentElement.classList.contains('dark')?'dark':'light');th.onclick=()=>setTheme(document.documentElement.classList.contains('dark')?'light':'dark');
function start(){build();let l=fromHash();if(!l){try{l=JSON.parse(localStorage.getItem('yugo-pos'))}catch(e){}}go(resolve(l));ready=true;save();document.body.dataset.ready='1'}
(document.fonts?document.fonts.ready:Promise.resolve()).then(start);
