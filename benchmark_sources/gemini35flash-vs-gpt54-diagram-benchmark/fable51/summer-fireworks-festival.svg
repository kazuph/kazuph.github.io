    <path d="M502 790 C502 731 538 731 538 790 Z"/><circle cx="520" cy="722" r="10"/>
    <path d="M559 790 C559 738 591 738 591 790 Z"/><circle cx="575" cy="729" r="10"/>
    <path d="M601 790 C601 725 639 725 639 790 Z"/><circle cx="620" cy="716" r="10"/>
    <path d="M655 790 C655 747 685 747 685 790 Z"/><circle cx="670" cy="738" r="10"/>
    <path d="M698 790 C698 732 732 732 732 790 Z"/><circle cx="715" cy="723" r="10"/>
    <path d="M752 790 C752 727 788 727 788 790 Z"/><circle cx="770" cy="718" r="10"/>
    <path d="M804 790 C804 743 836 743 836 790 Z"/><circle cx="820" cy="734" r="10"/>
    <path d="M852 790 C852 731 888 731 888 790 Z"/><circle cx="870" cy="722" r="10"/>
    <path d="M899 790 C899 738 931 738 931 790 Z"/><circle cx="915" cy="729" r="10"/>
    <path d="M941 790 C941 723 979 723 979 790 Z"/><circle cx="960" cy="714" r="10"/>
    <path d="M995 790 C995 745 1025 745 1025 790 Z"/><circle cx="1010" cy="736" r="10"/>
    <path d="M1038 790 C1038 734 1072 734 1072 790 Z"/><circle cx="1055" cy="725" r="10"/>
