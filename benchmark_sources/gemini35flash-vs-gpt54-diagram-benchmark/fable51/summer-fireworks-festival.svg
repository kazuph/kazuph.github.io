    <path d="M110 790 C110 745 140 745 140 790 Z"/><circle cx="125" cy="736" r="10"/>
    <path d="M171 790 C171 725 209 725 209 790 Z"/><circle cx="190" cy="716" r="10"/>
    <path d="M219 790 C219 736 251 736 251 790 Z"/><circle cx="235" cy="727" r="10"/>
    <path d="M266 790 C266 750 294 750 294 790 Z"/><circle cx="280" cy="741" r="10"/>
