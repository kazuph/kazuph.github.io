  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="170" y="536">YAKISOBA</text><text x="440" y="536">KAKIGORI</text><text x="710" y="536">TAKOYAKI</text>
  </g>

