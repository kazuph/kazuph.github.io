  <g fill="#FFD9A8" opacity="0.5">
    <ellipse cx="60" cy="800" rx="18" ry="3"/><ellipse cx="140" cy="800" rx="18" ry="3"/><ellipse cx="220" cy="800" rx="18" ry="3"/><ellipse cx="590" cy="800" rx="18" ry="3"/><ellipse cx="660" cy="800" rx="18" ry="3"/><ellipse cx="730" cy="800" rx="18" ry="3"/><ellipse cx="1120" cy="800" rx="18" ry="3"/>
  </g>
</svg>
