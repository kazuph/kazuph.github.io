    <g stroke="#FFD166"><line x1="740" y1="805" x2="880" y2="805"/><line x1="770" y1="825" x2="960" y2="825"/><line x1="730" y1="845" x2="900" y2="845"/><line x1="800" y1="865" x2="940" y2="865"/><line x1="760" y1="885" x2="890" y2="885"/></g>
    <g stroke="#6EE7F9"><line x1="960" y1="808" x2="1040" y2="808"/><line x1="990" y1="830" x2="1100" y2="830"/><line x1="950" y1="852" x2="1060" y2="852"/><line x1="1000" y1="874" x2="1080" y2="874"/></g>
  </g>
  <!-- riverbank -->
