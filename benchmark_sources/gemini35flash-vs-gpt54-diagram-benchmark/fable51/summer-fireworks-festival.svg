    <line x1="430" y1="715" x2="415" y2="680" stroke="#05040F" stroke-width="5" stroke-linecap="round"/>
    <rect x="952" y="682" width="16" height="26" rx="4"/><circle cx="960" cy="675" r="8"/>
    <line x1="960" y1="690" x2="942" y2="665" stroke="#05040F" stroke-width="4" stroke-linecap="round"/><line x1="960" y1="690" x2="978" y2="665" stroke="#05040F" stroke-width="4" stroke-linecap="round"/>
