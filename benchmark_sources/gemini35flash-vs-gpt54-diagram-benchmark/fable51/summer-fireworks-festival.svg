<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060B2A"/><stop offset="55%" stop-color="#0F1E5A"/><stop offset="100%" stop-color="#2A3C86"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF5E7E" stop-opacity="0.35"/><stop offset="100%" stop-color="#FF5E7E" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFD166" stop-opacity="0.35"/><stop offset="100%" stop-color="#FFD166" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6EE7F9" stop-opacity="0.35"/><stop offset="100%" stop-color="#6EE7F9" stop-opacity="0"/></radialGradient>
    <radialGradient id="lg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FF8C42" stop-opacity="0.55"/><stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/></radialGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFD9A8" stop-opacity="0.6"/><stop offset="100%" stop-color="#FF8C42" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D1B4B"/><stop offset="100%" stop-color="#060B2A"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <!-- one spoke pattern reused by rotation -->
    <g id="spoke1"><line x1="0" y1="0" x2="0" y2="-200" stroke="#FF5E7E" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/><line x1="0" y1="0" x2="0" y2="-120" stroke="#FFC1CF" stroke-width="1.2"/><circle cx="0" cy="-200" r="4.5" fill="#FFC1CF"/><line x1="0" y1="-140" x2="0" y2="-175" stroke="#FFC1CF" stroke-width="1.6" opacity="0.8" transform="rotate(5)"/><circle cx="0" cy="-175" r="3" fill="#FFFFFF" transform="rotate(5)"/></g>
    <g id="spoke2"><path d="M0 0 C0 -60 0 -120 -6 -160" fill="none" stroke="#FFD166" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/><circle cx="-6" cy="-160" r="4" fill="#FFF3C4"/><line x1="0" y1="0" x2="0" y2="-105" stroke="#FFF3C4" stroke-width="1.2" opacity="0.85" transform="rotate(6)"/></g>
    <g id="spoke3"><line x1="0" y1="0" x2="0" y2="-85" stroke="#6EE7F9" stroke-width="2" stroke-linecap="round" opacity="0.9"/><circle cx="0" cy="-85" r="3" fill="#D4FBFF"/></g>
    <g id="lantern"><circle r="28" fill="url(#lg)"/><ellipse rx="11" ry="14" fill="#FF8C42"/><ellipse cx="-3" cy="-4" rx="4" ry="6" fill="#FFD9A8" opacity="0.7"/><line x1="-8" y1="0" x2="8" y2="0" stroke="#1A1530" stroke-width="1"/></g>
    <g id="stall">
      <rect x="0" y="0" width="220" height="125" fill="#1A1530"/>
      <rect x="15" y="25" width="190" height="70" fill="url(#counter)"/>
      <rect x="-10" y="-40" width="40" height="40" fill="#C0392B"/><rect x="30" y="-40" width="40" height="40" fill="#F4F1EA"/><rect x="70" y="-40" width="40" height="40" fill="#C0392B"/><rect x="110" y="-40" width="40" height="40" fill="#F4F1EA"/><rect x="150" y="-40" width="40" height="40" fill="#C0392B"/><rect x="190" y="-40" width="40" height="40" fill="#F4F1EA"/>
      <polygon points="-10,-40 230,-40 210,-70 10,-70" fill="#C0392B"/>
      <path d="M-10 -40 Q110 -10 230 -40" fill="none" stroke="#7A6146" stroke-width="1"/>
      <use href="#lantern" x="35" y="-13"/><use href="#lantern" x="80" y="-5"/><use href="#lantern" x="125" y="-3"/><use href="#lantern" x="170" y="-8"/>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="50" cy="60" r="3"/><circle cx="130" cy="140" r="2"/><circle cx="210" cy="30" r="2.5"/><circle cx="290" cy="210" r="2"/><circle cx="360" cy="80" r="3"/><circle cx="520" cy="40" r="2"/><circle cx="640" cy="110" r="2.5"/><circle cx="710" cy="50" r="2"/><circle cx="830" cy="180" r="3"/><circle cx="900" cy="60" r="2"/><circle cx="980" cy="220" r="2.5"/><circle cx="1060" cy="90" r="3"/><circle cx="1140" cy="160" r="2"/><circle cx="90" cy="280" r="2"/><circle cx="1100" cy="310" r="2"/><circle cx="440" cy="260" r="2"/><circle cx="180" cy="340" r="1.8"/><circle cx="1020" cy="140" r="2"/><circle cx="690" cy="240" r="1.8"/><circle cx="320" cy="120" r="2"/><circle cx="560" cy="300" r="1.6"/><circle cx="760" cy="330" r="1.6"/>
  </g>
  <!-- moon -->
  <circle cx="1090" cy="100" r="32" fill="#FFF3C4" opacity="0.9"/>
  <circle cx="1105" cy="90" r="28" fill="#060B2A"/>

  <!-- firework 1: pink chrysanthemum -->
  <g transform="translate(420 280)">
    <circle r="235" fill="url(#g1)"/>
    <use href="#spoke1"/><use href="#spoke1" transform="rotate(10)"/><use href="#spoke1" transform="rotate(20)"/><use href="#spoke1" transform="rotate(30)"/><use href="#spoke1" transform="rotate(40)"/><use href="#spoke1" transform="rotate(50)"/><use href="#spoke1" transform="rotate(60)"/><use href="#spoke1" transform="rotate(70)"/><use href="#spoke1" transform="rotate(80)"/><use href="#spoke1" transform="rotate(90)"/><use href="#spoke1" transform="rotate(100)"/><use href="#spoke1" transform="rotate(110)"/><use href="#spoke1" transform="rotate(120)"/><use href="#spoke1" transform="rotate(130)"/><use href="#spoke1" transform="rotate(140)"/><use href="#spoke1" transform="rotate(150)"/><use href="#spoke1" transform="rotate(160)"/><use href="#spoke1" transform="rotate(170)"/><use href="#spoke1" transform="rotate(180)"/><use href="#spoke1" transform="rotate(190)"/><use href="#spoke1" transform="rotate(200)"/><use href="#spoke1" transform="rotate(210)"/><use href="#spoke1" transform="rotate(220)"/><use href="#spoke1" transform="rotate(230)"/><use href="#spoke1" transform="rotate(240)"/><use href="#spoke1" transform="rotate(250)"/><use href="#spoke1" transform="rotate(260)"/><use href="#spoke1" transform="rotate(270)"/><use href="#spoke1" transform="rotate(280)"/><use href="#spoke1" transform="rotate(290)"/><use href="#spoke1" transform="rotate(300)"/><use href="#spoke1" transform="rotate(310)"/><use href="#spoke1" transform="rotate(320)"/><use href="#spoke1" transform="rotate(330)"/><use href="#spoke1" transform="rotate(340)"/><use href="#spoke1" transform="rotate(350)"/>
