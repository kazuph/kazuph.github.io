<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Block Gradients -->
    <linearGradient id="predGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <linearGradient id="updateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <linearGradient id="measGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <linearGradient id="gainGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- Marker Arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <!-- Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  <rect x="40" y="30" width="1120" height="840" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="600" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#0f172a" text-anchor="middle">カルマンフィルターのブロック線図 (Kalman Filter Block Diagram)</text>
  <text x="600" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Recursive State Estimation: Prediction (Time Update) &amp; Correction (Measurement Update)</text>

  <!-- SECTION 1: PREDICTION STAGE (TIME UPDATE) -->
  <!-- Left Outer Dashed Boundary Box -->
  <g id="prediction-stage">
    <rect x="80" y="160" width="460" height="490" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" stroke-dasharray="8,6"/>
    <rect x="100" y="145" width="200" height="30" rx="6" fill="#0284c7"/>
    <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">PREDICTION (予測ステップ)</text>

    <!-- Inputs to Prediction -->
    <!-- Control Input u_k -->
    <rect x="120" y="210" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="180" y="235" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Control Input</text>
    <text x="180" y="252" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0284c7" text-anchor="middle">u<tspan dy="3" font-size="10">k</tspan></text>
    <line x1="240" y1="235" x2="290" y2="235" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Process Noise Q_k -->
    <rect x="120" y="320" width="120" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="180" y="345" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Process Noise</text>
    <text x="180" y="362" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0284c7" text-anchor="middle">Q<tspan dy="3" font-size="10">k</tspan></text>
    <line x1="240" y1="345" x2="290" y2="345" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- State Prediction Block -->
    <rect x="290" y="195" width="220" height="90" rx="10" fill="url(#predGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="400" y="225" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">State Prediction (状態予測)</text>
    <text x="400" y="260" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#0f172a" text-anchor="middle">x̂<tspan dy="4" font-size="11">k|k-1</tspan><tspan dy="-4"> = F</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">x̂</tspan><tspan dy="4" font-size="11">k-1|k-1</tspan><tspan dy="-4"> + B</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">u</tspan><tspan dy="4" font-size="11">k</tspan></text>

    <!-- Covariance Prediction Block -->
    <rect x="290" y="315" width="220" height="90" rx="10" fill="url(#predGrad)" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <text x="400" y="345" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Covariance Prediction (共分散予測)</text>
    <text x="400" y="380" font-family="Georgia, serif" font-size="16" font-style="italic" fill="#0f172a" text-anchor="middle">P<tspan dy="4" font-size="11">k|k-1</tspan><tspan dy="-4"> = F</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">P</tspan><tspan dy="4" font-size="11">k-1|k-1</tspan><tspan dy="-4">F</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-8" font-size="10">T</tspan><tspan dy="4"> + Q</tspan><tspan dy="4" font-size="11">k</tspan></text>

    <!-- Unit Delay (Feedback Block) inside prediction bottom -->
    <rect x="290" y="520" width="220" height="75" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <text x="400" y="550" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">Unit Delay (1ステップ遅延)</text>
    <text x="400" y="575" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#0284c7" text-anchor="middle">z<tspan dy="-6" font-size="11">-1</tspan><tspan dy="6"> (Store x̂</tspan><tspan dy="4" font-size="11">k|k</tspan><tspan dy="-4">, P</tspan><tspan dy="4" font-size="11">k|k</tspan><tspan dy="-4">)</tspan></text>
    <line x1="400" y1="520" x2="400" y2="415" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- FORWARD ARROWS (PREDICTION -> UPDATE) -->
  <!-- State x_hat_{k|k-1} -->
  <line x1="510" y1="240" x2="650" y2="240" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="535" y="215" width="90" height="24" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="580" y="232" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#0284c7" text-anchor="middle">x̂<tspan dy="3" font-size="10">k|k-1</tspan></text>

  <!-- Covariance P_{k|k-1} -->
  <line x1="510" y1="360" x2="650" y2="360" stroke="#0284c7" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="535" y="335" width="90" height="24" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="580" y="352" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#0284c7" text-anchor="middle">P<tspan dy="3" font-size="10">k|k-1</tspan></text>

  <!-- SECTION 2: UPDATE STAGE (MEASUREMENT UPDATE) -->
  <!-- Right Outer Dashed Boundary Box -->
  <g id="update-stage">
    <rect x="650" y="160" width="470" height="490" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,6"/>
    <rect x="670" y="145" width="180" height="30" rx="6" fill="#16a34a"/>
    <text x="760" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">UPDATE (更新ステップ)</text>

    <!-- Measurement Input z_k -->
    <rect x="980" y="200" width="110" height="50" rx="8" fill="url(#measGrad)" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="1035" y="222" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Measurement</text>
    <text x="1035" y="240" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#b45309" text-anchor="middle">z<tspan dy="3" font-size="10">k</tspan></text>
    <line x1="980" y1="225" x2="935" y2="225" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

    <!-- Summing / Residual Junction (Circle with +/-) -->
    <circle cx="915" cy="225" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <text x="915" y="229" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">+</text>
    <text x="900" y="248" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#dc2626">-</text>

    <!-- H_k measurement matrix branch -->
    <rect x="730" y="215" width="70" height="40" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="765" y="240" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#334155" text-anchor="middle">H<tspan dy="3" font-size="10">k</tspan></text>
    <line x1="800" y1="235" x2="895" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Residual / Innovation y_k -->
    <line x1="915" y1="243" x2="915" y2="280" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="850" y="260" width="130" height="24" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="915" y="277" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#b91c1c" text-anchor="middle">Residual y<tspan dy="3" font-size="10">k</tspan><tspan dy="-3"> = z</tspan><tspan dy="3" font-size="10">k</tspan><tspan dy="-3"> - H</tspan><tspan dy="3" font-size="10">k</tspan><tspan dy="-3">x̂</tspan><tspan dy="3" font-size="10">k|k-1</tspan></text>

    <!-- Kalman Gain Block K_k -->
    <rect x="680" y="325" width="250" height="85" rx="10" fill="url(#gainGrad)" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
    <text x="805" y="352" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#7e22ce" text-anchor="middle">Kalman Gain (カルマンゲイン)</text>
    <text x="805" y="385" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#0f172a" text-anchor="middle">K<tspan dy="4" font-size="11">k</tspan><tspan dy="-4"> = P</tspan><tspan dy="4" font-size="11">k|k-1</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-8" font-size="10">T</tspan><tspan dy="4">(H</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">P</tspan><tspan dy="4" font-size="11">k|k-1</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-8" font-size="10">T</tspan><tspan dy="4"> + R</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">)</tspan><tspan dy="-8" font-size="10">-1</tspan></text>

    <!-- Measurement Noise R_k Input -->
    <rect x="980" y="340" width="110" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1035" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">Meas. Noise</text>
    <text x="1035" y="378" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#0284c7" text-anchor="middle">R<tspan dy="3" font-size="10">k</tspan></text>
    <line x1="980" y1="365" x2="930" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- State & Covariance Update Block (Output of correction) -->
    <rect x="680" y="445" width="410" height="95" rx="10" fill="url(#updateGrad)" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <text x="885" y="475" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Updated State &amp; Covariance (状態・共分散更新)</text>
    <text x="885" y="505" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#0f172a" text-anchor="middle">x̂<tspan dy="4" font-size="11">k|k</tspan><tspan dy="-4"> = x̂</tspan><tspan dy="4" font-size="11">k|k-1</tspan><tspan dy="-4"> + K</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">y</tspan><tspan dy="4" font-size="11">k</tspan></text>
    <text x="885" y="528" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#334155" text-anchor="middle">P<tspan dy="4" font-size="11">k|k</tspan><tspan dy="-4"> = (I - K</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="11">k</tspan><tspan dy="-4">)P</tspan><tspan dy="4" font-size="11">k|k-1</tspan></text>

    <!-- Connectors inside Update -->
    <line x1="805" y1="410" x2="805" y2="445" stroke="#9333ea" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>

  <!-- FEEDBACK LOOP (UPDATE -> UNIT DELAY -> PREDICTION) -->
  <path d="M 885,540 L 885,560 L 515,560" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <rect x="630" y="548" width="160" height="24" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
  <text x="710" y="565" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">Feedback Loop (k → k+1)</text>

  <!-- FINAL OUTPUT ARROW (RIGHTWARDS) -->
  <line x1="1090" y1="492" x2="1140" y2="492" stroke="#16a34a" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1145" y="497" font-family="Georgia, serif" font-size="16" font-style="italic" font-weight="bold" fill="#15803d">x̂<tspan dy="4" font-size="12">k|k</tspan></text>

  <!-- SUMMARY TABLE AT BOTTOM -->
  <g id="summary-legend" transform="translate(80, 680)">
    <rect x="0" y="0" width="1040" height="150" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Column 1: Time Update -->
    <rect x="25" y="20" width="220" height="28" rx="6" fill="#e0f2fe"/>
    <text x="135" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Time Update (Prior)</text>
    <text x="35" y="70" font-family="Georgia, serif" font-size="14" fill="#334155">• Prior Estimate: x̂<tspan dy="3" font-size="10">k|k-1</tspan></text>
    <text x="35" y="95" font-family="Georgia, serif" font-size="14" fill="#334155">• Prior Covariance: P<tspan dy="3" font-size="10">k|k-1</tspan></text>
    <text x="35" y="120" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">• 制御入力に基づく前進予測</text>

    <!-- Column 2: Measurement -->
    <rect x="290" y="20" width="220" height="28" rx="6" fill="#fef3c7"/>
    <text x="400" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Measurement (観測)</text>
    <text x="300" y="70" font-family="Georgia, serif" font-size="14" fill="#334155">• Sensor Input: z<tspan dy="3" font-size="10">k</tspan></text>
    <text x="300" y="95" font-family="Georgia, serif" font-size="14" fill="#334155">• Residual: y<tspan dy="3" font-size="10">k</tspan> = z<tspan dy="3" font-size="10">k</tspan> - Hx̂</text>
    <text x="300" y="120" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">• 観測値と予測値の残差を算出</text>

    <!-- Column 3: Kalman Gain -->
    <rect x="550" y="20" width="220" height="28" rx="6" fill="#f3e8ff"/>
    <text x="660" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">Optimal Weight (ゲイン)</text>
    <text x="560" y="70" font-family="Georgia, serif" font-size="14" fill="#334155">• Gain: K<tspan dy="3" font-size="10">k</tspan> = P H<tspan dy="-4" font-size="9">T</tspan><tspan dy="4"> S</tspan><tspan dy="-4" font-size="9">-1</tspan></text>
    <text x="560" y="95" font-family="Georgia, serif" font-size="14" fill="#334155">• Weight between Prior &amp; Sensor</text>
    <text x="560" y="120" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">• 不確かさに応じた最適重み</text>

    <!-- Column 4: Measurement Update -->
    <rect x="800" y="20" width="215" height="28" rx="6" fill="#dcfce7"/>
    <text x="907" y="39" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">Measurement Update (Posterior)</text>
    <text x="810" y="70" font-family="Georgia, serif" font-size="14" fill="#334155">• Posterior Estimate: x̂<tspan dy="3" font-size="10">k|k</tspan></text>
    <text x="810" y="95" font-family="Georgia, serif" font-size="14" fill="#334155">• Posterior Covariance: P<tspan dy="3" font-size="10">k|k</tspan></text>
    <text x="810" y="120" font-family="-apple-system, sans-serif" font-size="13" fill="#64748b">• 残差を反映して状態を確定</text>
  </g>
</svg>
