<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Metal Cylinder Gradient -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Steel Rod Gradient -->
    <linearGradient id="rod-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Pressurized Hydraulic Oil Gradient (Left / Extending: High Pressure Blue) -->
    <linearGradient id="fluid-high" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Returning Hydraulic Oil Gradient (Right / Return: Lower Pressure Light Blue/Amber) -->
    <linearGradient id="fluid-low" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Arrowhead Markers -->
    <marker id="arrow-flow-in" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-flow-out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-motion" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#22c55e"/>
    </marker>

    <!-- Hatch Pattern for Cut Section Walls -->
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#475569" stroke-width="2"/>
    </pattern>

    <filter id="diagram-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-grad)"/>

  <!-- Title & Subtitle Header -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="70" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">Double-Acting Hydraulic Cylinder</text>
    <text x="600" y="105" font-size="16" fill="#94a3b8">Cross-Sectional Structure &amp; Working Principle (Extension Stroke)</text>
  </g>

  <!-- Main Technical Diagram Group -->
  <g id="cylinder-system" transform="translate(100, 220)" filter="url(#diagram-shadow)">

    <!-- 1. FLUID CHAMBERS (Interior) -->
    <!-- Cap-End Chamber (High Pressure Inflow) : x from 70 to 390, y from 90 to 310 -->
    <rect x="70" y="90" width="320" height="220" fill="url(#fluid-high)"/>

    <!-- Rod-End Chamber (Return/Low Pressure Outflow) : x from 450 to 730, y from 90 to 310, minus rod in center -->
    <rect x="450" y="90" width="280" height="220" fill="url(#fluid-low)"/>

    <!-- Fluid Inflow & Outflow Ports Internal Volume -->
    <!-- Port A (Cap-end inlet, left top) -->
    <rect x="150" y="30" width="60" height="60" fill="url(#fluid-high)"/>
    <!-- Port B (Rod-end outlet, right top) -->
    <rect x="570" y="30" width="60" height="60" fill="url(#fluid-low)"/>

    <!-- 2. PISTON & ROD ASSEMBLY -->
    <!-- Piston Rod (Shaft extending to the right) -->
    <rect x="450" y="165" width="460" height="70" fill="url(#rod-grad)" stroke="#475569" stroke-width="2"/>
    <!-- Rod End Clevis / Eye -->
    <path d="M 910 160 L 960 160 Q 990 200 960 240 L 910 240 Z" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <circle cx="950" cy="200" r="16" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Piston Head (Center block) : width = 60, x = 390 to 450, y = 90 to 310 -->
    <rect x="390" y="90" width="60" height="220" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>

    <!-- Piston Seals (Top & Bottom rubber seals on piston) -->
    <rect x="410" y="85" width="20" height="15" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="410" y="300" width="20" height="15" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="412" y="190" width="16" height="20" fill="#f59e0b"/>

    <!-- 3. CYLINDER HOUSING & BARREL WALLS (Cross-Section Top & Bottom) -->
    <!-- Top Cylinder Barrel Wall with Port Openings -->
    <path d="M 40 50 L 150 50 L 150 90 L 210 90 L 210 50 L 570 50 L 570 90 L 630 90 L 630 50 L 760 50 L 760 90 L 40 90 Z"
          fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <path d="M 40 50 L 150 50 L 150 90 L 210 90 L 210 50 L 570 50 L 570 90 L 630 90 L 630 50 L 760 50 L 760 90 L 40 90 Z"
          fill="url(#hatch)"/>

    <!-- Bottom Cylinder Barrel Wall -->
    <rect x="40" y="310" width="720" height="40" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <rect x="40" y="310" width="720" height="40" fill="url(#hatch)"/>

    <!-- Left Cap End (Blind End) -->
    <path d="M 10 50 L 70 50 L 70 350 L 10 350 Q -10 200 10 50 Z" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <path d="M 10 50 L 70 50 L 70 350 L 10 350 Q -10 200 10 50 Z" fill="url(#hatch)"/>
    <!-- Cap Mount Eye -->
    <circle cx="25" cy="200" r="14" fill="#1e293b" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Right Rod Gland / Head (Front End with Rod Hole & Seals) -->
    <path d="M 730 50 L 770 50 L 770 165 L 730 165 Z" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <path d="M 730 50 L 770 50 L 770 165 L 730 165 Z" fill="url(#hatch)"/>
    <path d="M 730 235 L 770 235 L 770 350 L 730 350 Z" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <path d="M 730 235 L 770 235 L 770 350 L 730 350 Z" fill="url(#hatch)"/>

    <!-- Rod Seals / Wiper Seal -->
    <rect x="740" y="155" width="16" height="12" fill="#ef4444"/>
    <rect x="740" y="233" width="16" height="12" fill="#ef4444"/>

    <!-- Port Tubes -->
    <!-- Port A Tube -->
    <rect x="150" y="0" width="60" height="35" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>
    <!-- Port B Tube -->
    <rect x="570" y="0" width="60" height="35" fill="url(#metal-grad)" stroke="#334155" stroke-width="2"/>

    <!-- 4. FLUID FLOW & MOTION ARROWS -->
    <!-- Inflow Stream Arrows (Port A -> Chamber) -->
    <g stroke="#38bdf8" stroke-width="3.5" fill="none">
      <line x1="180" y1="-30" x2="180" y2="60" marker-end="url(#arrow-flow-in)"/>
      <path d="M 180 75 Q 180 130 140 160" marker-end="url(#arrow-flow-in)"/>
      <path d="M 180 75 Q 180 150 260 170" marker-end="url(#arrow-flow-in)"/>
      <path d="M 180 75 Q 180 220 180 250" marker-end="url(#arrow-flow-in)"/>
    </g>

    <!-- Outflow Stream Arrows (Chamber -> Port B) -->
    <g stroke="#fbbf24" stroke-width="3" fill="none">
      <path d="M 520 130 Q 570 110 590 75" marker-end="url(#arrow-flow-out)"/>
      <path d="M 680 130 Q 620 110 610 75" marker-end="url(#arrow-flow-out)"/>
      <line x1="600" y1="50" x2="600" y2="-25" marker-end="url(#arrow-flow-out)"/>
    </g>

    <!-- Pressure Force Distribution Arrows on Piston Face -->
    <g stroke="#38bdf8" stroke-width="3" fill="none">
      <line x1="330" y1="120" x2="385" y2="120" marker-end="url(#arrow-flow-in)"/>
      <line x1="330" y1="160" x2="385" y2="160" marker-end="url(#arrow-flow-in)"/>
      <line x1="330" y1="200" x2="385" y2="200" marker-end="url(#arrow-flow-in)"/>
      <line x1="330" y1="240" x2="385" y2="240" marker-end="url(#arrow-flow-in)"/>
      <line x1="330" y1="280" x2="385" y2="280" marker-end="url(#arrow-flow-in)"/>
    </g>

    <!-- Piston Extension Motion Arrow -->
    <g filter="url(#diagram-shadow)">
      <line x1="680" y1="200" x2="840" y2="200" stroke="#22c55e" stroke-width="6" marker-end="url(#arrow-motion)"/>
      <rect x="690" y="165" width="130" height="24" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="1.2"/>
      <text x="755" y="182" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4ade80" text-anchor="middle">MOTION (F = P·A)</text>
    </g>

    <!-- Center Axis Line (Dashed Red/Gray) -->
    <line x1="-30" y1="200" x2="1010" y2="200" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="14,4,3,4" opacity="0.6"/>

  </g>

  <!-- 5. LABELS & CALLOUTS -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="14">

    <!-- Port A Label -->
    <g transform="translate(200, 150)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="21" fill="#38bdf8" font-weight="700" text-anchor="middle">Port A (Fluid Inlet: P₁)</text>
      <line x1="80" y1="32" x2="80" y2="60" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- Port B Label -->
    <g transform="translate(620, 150)">
      <rect x="0" y="0" width="160" height="32" rx="6" fill="#713f12" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="80" y="21" fill="#fbbf24" font-weight="700" text-anchor="middle">Port B (Fluid Return: P₂)</text>
      <line x1="80" y1="32" x2="80" y2="60" stroke="#fbbf24" stroke-width="1.5"/>
    </g>

    <!-- Cylinder Barrel Label -->
    <g transform="translate(390, 130)">
      <rect x="0" y="0" width="140" height="30" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="70" y="20" fill="#f8fafc" font-weight="600" text-anchor="middle">Cylinder Barrel</text>
      <line x1="70" y1="30" x2="70" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="70" cy="130" r="3" fill="#94a3b8"/>
    </g>

    <!-- Cap-End Chamber (Bottom Left) -->
    <g transform="translate(180, 620)">
      <rect x="0" y="0" width="170" height="42" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <text x="85" y="19" fill="#38bdf8" font-weight="700" text-anchor="middle">Cap-End Chamber</text>
      <text x="85" y="35" fill="#94a3b8" font-size="12" text-anchor="middle">(Full Piston Area A₁)</text>
      <line x1="85" y1="0" x2="85" y2="-100" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="85" cy="-100" r="3" fill="#0284c7"/>
    </g>

    <!-- Piston & Seals Label -->
    <g transform="translate(430, 620)">
      <rect x="0" y="0" width="150" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
      <text x="75" y="19" fill="#f87171" font-weight="700" text-anchor="middle">Piston &amp; Seals</text>
      <text x="75" y="35" fill="#94a3b8" font-size="12" text-anchor="middle">(Dynamic O-Rings)</text>
      <line x1="75" y1="0" x2="75" y2="-90" stroke="#ef4444" stroke-width="1.5"/>
      <circle cx="75" cy="-90" r="3" fill="#ef4444"/>
    </g>

    <!-- Rod-End Chamber (Bottom Center-Right) -->
    <g transform="translate(640, 620)">
      <rect x="0" y="0" width="170" height="42" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="85" y="19" fill="#fbbf24" font-weight="700" text-anchor="middle">Rod-End Chamber</text>
      <text x="85" y="35" fill="#94a3b8" font-size="12" text-anchor="middle">(Annular Area A₂)</text>
      <line x1="85" y1="0" x2="85" y2="-100" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="85" cy="-100" r="3" fill="#f59e0b"/>
    </g>

    <!-- Piston Rod Label -->
    <g transform="translate(860, 620)">
      <rect x="0" y="0" width="140" height="42" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="70" y="19" fill="#f8fafc" font-weight="700" text-anchor="middle">Piston Rod</text>
      <text x="70" y="35" fill="#94a3b8" font-size="12" text-anchor="middle">(Hard Chrome Plated)</text>
      <line x1="70" y1="0" x2="70" y2="-170" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="70" cy="-170" r="3" fill="#cbd5e1"/>
    </g>

    <!-- Cylinder Gland & Wiper Seal (Top Right) -->
    <g transform="translate(840, 240)">
      <rect x="0" y="0" width="160" height="34" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="80" y="22" fill="#f8fafc" font-weight="600" text-anchor="middle">Rod Gland &amp; Wiper</text>
      <line x1="0" y1="17" x2="-65" y2="45" stroke="#94a3b8" stroke-width="1.5"/>
      <circle cx="-65" cy="45" r="3" fill="#94a3b8"/>
    </g>

  </g>

  <!-- Technical Summary Card (Bottom) -->
  <g transform="translate(180, 770)" font-family="system-ui, sans-serif">
    <rect width="840" height="75" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="30" font-size="15" font-weight="700" fill="#38bdf8">Extension Force:</text>
    <text x="160" y="30" font-size="15" fill="#f8fafc">F_ext = P₁ · A_piston - P₂ · (A_piston - A_rod)</text>
    <text x="30" y="55" font-size="14" fill="#94a3b8">Pressurized hydraulic fluid enters Port A, pushing the piston to the right while discharging fluid through Port B.</text>
  </g>
</svg>
