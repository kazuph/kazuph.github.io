<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Industrial Metal Gradients -->
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="link-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="joint-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <!-- Arrowhead Markers -->
    <marker id="arr-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-roll" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#facc15"/>
    </marker>

    <filter id="arm-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-grad)"/>

  <!-- Title Header -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="60" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">7-DOF Articulated Robotic Manipulator</text>
    <text x="600" y="92" font-size="15" fill="#94a3b8">Kinematic Chain Structure &amp; Joint Axis Definitions (J1 – J7 + Gripper)</text>
  </g>

  <!-- Ground Floor Pedestal Grid -->
  <ellipse cx="380" cy="790" rx="260" ry="60" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <ellipse cx="380" cy="790" rx="200" ry="45" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

  <!-- Main 7-Axis Robot Kinematic Body -->
  <g id="robot-kinematic-chain" filter="url(#arm-shadow)">

    <!-- BASE & J1 (Base Yaw Rotation) -->
    <!-- Base Mounting Flange -->
    <ellipse cx="380" cy="770" rx="140" ry="40" fill="url(#metal-dark)" stroke="#475569" stroke-width="2"/>
    <rect x="260" y="720" width="240" height="50" fill="url(#metal-dark)" stroke="#475569" stroke-width="2"/>
    <ellipse cx="380" cy="720" rx="120" ry="35" fill="url(#metal-dark)" stroke="#475569" stroke-width="2"/>

    <!-- J1: Base Swivel Turntable -->
    <rect x="290" y="660" width="180" height="60" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
    <ellipse cx="380" cy="660" rx="90" ry="28" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>

    <!-- J1 Axis Line & Rotation Arrow -->
    <line x1="380" y1="800" x2="380" y2="610" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M 330 685 A 50 16 0 1 0 430 685" fill="none" stroke="#facc15" stroke-width="3" marker-end="url(#arr-roll)"/>

    <!-- J2: Shoulder Pitch Joint (Transverse Axis) -->
    <g transform="translate(380, 600)">
      <!-- Shoulder Casting -->
      <path d="M -70 0 L 70 0 L 50 -70 L -50 -70 Z" fill="url(#link-orange)" stroke="#7c2d12" stroke-width="2"/>
      <!-- J2 Cylindrical Pivot (Horizontal) -->
      <ellipse cx="0" cy="0" rx="65" ry="35" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="14" fill="#1e293b"/>
      <!-- J2 Pitch Rotation Arrow -->
      <path d="M -45 -25 A 35 35 0 0 1 45 -25" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-axis)"/>
    </g>

    <!-- LINK 1 / Upper Arm (J2 to J4, with J3 in-line Roll) -->
    <!-- Lower part of Link 1 -->
    <path d="M 330 530 L 430 530 L 460 410 L 360 410 Z" fill="url(#link-orange)" stroke="#7c2d12" stroke-width="2"/>

    <!-- J3: Upper Arm Roll Joint (Twist along link axis) -->
    <g transform="translate(410, 410) rotate(-18)">
      <ellipse cx="0" cy="0" rx="55" ry="22" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <rect x="-55" y="-28" width="110" height="28" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <ellipse cx="0" cy="-28" rx="55" ry="22" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <!-- J3 Roll Arrow around link -->
      <path d="M -40 -14 A 40 16 0 1 0 40 -14" fill="none" stroke="#facc15" stroke-width="3" marker-end="url(#arr-roll)"/>
    </g>

    <!-- Upper part of Link 1 to Elbow -->
    <path d="M 380 380 L 480 350 L 520 250 L 420 280 Z" fill="url(#link-orange)" stroke="#7c2d12" stroke-width="2"/>

    <!-- J4: Elbow Pitch Joint -->
    <g transform="translate(470, 265)">
      <circle cx="0" cy="0" r="45" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="16" fill="#1e293b"/>
      <!-- J4 Pitch Rotation Arrow -->
      <path d="M -30 -25 A 35 35 0 0 1 30 -25" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-axis)"/>
    </g>

    <!-- LINK 2 / Forearm (J4 to J6, with J5 Forearm Roll) -->
    <path d="M 490 240 L 520 280 L 680 230 L 650 190 Z" fill="url(#link-orange)" stroke="#7c2d12" stroke-width="2"/>

    <!-- J5: Forearm Roll Joint (Twist) -->
    <g transform="translate(665, 210) rotate(-15)">
      <ellipse cx="0" cy="0" rx="20" ry="42" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <rect x="0" y="-42" width="30" height="84" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <ellipse cx="30" cy="0" rx="20" ry="42" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <!-- J5 Roll Arrow -->
      <path d="M 15 -30 A 15 30 0 1 1 15 30" fill="none" stroke="#facc15" stroke-width="3" marker-end="url(#arr-roll)"/>
    </g>

    <!-- Forearm Extension to Wrist -->
    <path d="M 695 198 L 780 180 L 790 225 L 705 242 Z" fill="url(#link-orange)" stroke="#7c2d12" stroke-width="2"/>

    <!-- J6: Wrist Pitch / Yaw Joint -->
    <g transform="translate(790, 205)">
      <circle cx="0" cy="0" r="30" fill="url(#joint-silver)" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b"/>
      <!-- J6 Pitch Arrow -->
      <path d="M -18 -20 A 25 25 0 0 1 18 -20" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-axis)"/>
    </g>

    <!-- J7: Tool Flange Roll & Wrist Roll -->
    <g transform="translate(820, 200) rotate(-12)">
      <rect x="0" y="-22" width="25" height="44" rx="3" fill="url(#joint-silver)" stroke="#334155" stroke-width="1.8"/>
      <ellipse cx="25" cy="0" rx="10" ry="22" fill="url(#joint-silver)" stroke="#334155" stroke-width="1.8"/>
      <!-- J7 Roll Arrow -->
      <path d="M 12 -16 A 12 16 0 1 1 12 16" fill="none" stroke="#facc15" stroke-width="2.5" marker-end="url(#arr-roll)"/>
    </g>

    <!-- END EFFECTOR / 2-FINGER PARALLEL GRIPPER -->
    <g transform="translate(850, 195) rotate(-12)">
      <!-- Gripper Palm Body -->
      <rect x="0" y="-28" width="35" height="56" rx="4" fill="url(#metal-dark)" stroke="#475569" stroke-width="2"/>
      <circle cx="16" cy="0" r="6" fill="#22c55e"/>

      <!-- Upper Finger -->
      <path d="M 35 -20 L 80 -25 L 90 -12 L 60 -10 L 35 -12 Z" fill="url(#joint-silver)" stroke="#334155" stroke-width="1.5"/>
      <rect x="75" y="-20" width="12" height="6" fill="#ef4444"/> <!-- Rubber Grip Pad -->

      <!-- Lower Finger -->
      <path d="M 35 20 L 80 25 L 90 12 L 60 10 L 35 12 Z" fill="url(#joint-silver)" stroke="#334155" stroke-width="1.5"/>
      <rect x="75" y="14" width="12" height="6" fill="#ef4444"/> <!-- Rubber Grip Pad -->

      <!-- Target Object (Precision Sphere/Cube being manipulated) -->
      <circle cx="85" cy="0" r="12" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
    </g>

  </g>

  <!-- LABELS & CALLOUTS FOR ALL 7 JOINTS -->
  <g font-family="system-ui, -apple-system, sans-serif">

    <!-- J1 Base Label -->
    <g transform="translate(130, 680)">
      <rect width="140" height="50" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
      <text x="70" y="24" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">J1: Base Yaw</text>
      <text x="70" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">±170° (Waist Roll)</text>
      <line x1="140" y1="25" x2="280" y2="25" stroke="#facc15" stroke-width="1.2"/>
    </g>

    <!-- J2 Shoulder Label -->
    <g transform="translate(130, 560)">
      <rect width="140" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="24" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">J2: Shoulder Pitch</text>
      <text x="70" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">-120° / +120°</text>
      <line x1="140" y1="25" x2="310" y2="25" stroke="#38bdf8" stroke-width="1.2"/>
    </g>

    <!-- J3 Shoulder Roll Label -->
    <g transform="translate(160, 380)">
      <rect width="150" height="50" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
      <text x="75" y="24" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">J3: Arm Roll</text>
      <text x="75" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">±170° (Redundancy)</text>
      <line x1="150" y1="25" x2="350" y2="25" stroke="#facc15" stroke-width="1.2"/>
    </g>

    <!-- J4 Elbow Label -->
    <g transform="translate(390, 150)">
      <rect width="140" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="24" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">J4: Elbow Pitch</text>
      <text x="70" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">-120° / +120°</text>
      <line x1="70" y1="50" x2="70" y2="90" stroke="#38bdf8" stroke-width="1.2"/>
    </g>

    <!-- J5 Forearm Roll Label -->
    <g transform="translate(590, 110)">
      <rect width="150" height="50" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
      <text x="75" y="24" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">J5: Forearm Roll</text>
      <text x="75" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">±170° (Twist)</text>
      <line x1="75" y1="50" x2="75" y2="75" stroke="#facc15" stroke-width="1.2"/>
    </g>

    <!-- J6 Wrist Pitch Label -->
    <g transform="translate(760, 100)">
      <rect width="140" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="70" y="24" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">J6: Wrist Pitch</text>
      <text x="70" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">-120° / +120°</text>
      <line x1="70" y1="50" x2="70" y2="80" stroke="#38bdf8" stroke-width="1.2"/>
    </g>

    <!-- J7 Tool Flange Roll Label -->
    <g transform="translate(940, 110)">
      <rect width="150" height="50" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
      <text x="75" y="24" font-size="15" font-weight="700" fill="#facc15" text-anchor="middle">J7: Flange Roll</text>
      <text x="75" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">±360° (Continuous)</text>
      <line x1="75" y1="50" x2="75" y2="70" stroke="#facc15" stroke-width="1.2"/>
    </g>

    <!-- End Effector Gripper Label -->
    <g transform="translate(980, 250)">
      <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
      <text x="80" y="24" font-size="15" font-weight="700" fill="#4ade80" text-anchor="middle">End Effector</text>
      <text x="80" y="42" font-size="12" fill="#94a3b8" text-anchor="middle">Parallel Servo Gripper</text>
      <line x1="0" y1="25" x2="-40" y2="0" stroke="#22c55e" stroke-width="1.2"/>
    </g>

  </g>

  <!-- Summary Kinematics Info Card (Bottom Right) -->
  <g transform="translate(700, 680)" font-family="system-ui, sans-serif">
    <rect width="440" height="150" rx="10" fill="#1e293b" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" font-size="15" font-weight="700" fill="#f8fafc">7-DOF Kinematic Configuration:</text>
    <text x="25" y="58" font-size="13" fill="#38bdf8">Structure: Spherical - Revolute - Spherical (SRS)</text>
    <text x="25" y="82" font-size="13" fill="#facc15">Redundancy: 1 Kinematic Redundant Degree of Freedom</text>
    <text x="25" y="106" font-size="13" fill="#94a3b8">Enables singularity avoidance and obstacle collision avoidance</text>
    <text x="25" y="130" font-size="13" fill="#4ade80">while maintaining fixed end-effector position and orientation.</text>
  </g>
</svg>
