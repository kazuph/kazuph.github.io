  <text x="90" y="765" font-family="Times New Roman, Times, serif" font-size="18" fill="#222222">        + e<tspan baseline-shift="super" font-size="12">i&#966;</tspan> sin(&#952;/2)|1&#9001;</text>
  <text x="90" y="800" font-family="Times New Roman, Times, serif" font-size="16" fill="#555555">0 &#8804; &#952; &#8804; &#960;,  0 &#8804; &#966; &lt; 2&#960;</text>
