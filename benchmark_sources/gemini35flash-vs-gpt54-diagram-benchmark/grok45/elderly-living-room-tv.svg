<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E8D4BC"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4A574"/>
      <stop offset="100%" stop-color="#A8845A"/>
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C45C4A"/>
      <stop offset="50%" stop-color="#D4705E"/>
      <stop offset="100%" stop-color="#B84E3C"/>
    </linearGradient>
    <linearGradient id="tvGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EC8E8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7EC8E8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8A0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFE8A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ceilingGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFF5D6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Room background -->
