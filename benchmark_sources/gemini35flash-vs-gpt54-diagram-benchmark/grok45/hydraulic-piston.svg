<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="cylWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9299"/>
      <stop offset="50%" stop-color="#5c656e"/>
      <stop offset="100%" stop-color="#8a9299"/>
    </linearGradient>
    <linearGradient id="pistonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d4450"/>
      <stop offset="40%" stop-color="#6b7380"/>
      <stop offset="100%" stop-color="#3d4450"/>
    </linearGradient>
    <linearGradient id="rodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5ccd4"/>
      <stop offset="50%" stop-color="#9aa3ad"/>
      <stop offset="100%" stop-color="#c5ccd4"/>
    </linearGradient>
    <linearGradient id="oilA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c040" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d49820" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="oilB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eb8e8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2a7fb8" stop-opacity="0.6"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a3a5c"/>
    </marker>
    <marker id="arrowHeadRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#b33a1a"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1a5a8c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#f7f5f0"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" fill="#1a2430">Hydraulic Piston Cross-Section</text>
  <text x="600" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#5a6570">Double-acting cylinder structure and fluid flow</text>

  <!-- Main diagram area frame -->
  <rect x="60" y="110" width="1080" height="520" rx="6" fill="#eef1f4" stroke="#c8ced6" stroke-width="1"/>

  <!-- ========== CYLINDER ASSEMBLY (cross-section) ========== -->
  <!-- Outer cylinder body top wall -->
  <rect x="180" y="200" width="720" height="36" fill="url(#cylWall)" stroke="#3a424a" stroke-width="1.5"/>
  <!-- Outer cylinder body bottom wall -->
  <rect x="180" y="444" height="36" width="720" fill="url(#cylWall)" stroke="#3a424a" stroke-width="1.5"/>

  <!-- Left end cap (blind end) -->
  <rect x="150" y="200" width="30" height="280" fill="url(#cylWall)" stroke="#3a424a" stroke-width="1.5"/>
  <!-- Cap bolts hint -->
  <circle cx="165" cy="220" r="5" fill="#4a525a" stroke="#2a323a" stroke-width="1"/>
  <circle cx="165" cy="460" r="5" fill="#4a525a" stroke="#2a323a" stroke-width="1"/>

  <!-- Right end cap (rod end) with gland -->
  <rect x="900" y="200" width="40" height="280" fill="url(#cylWall)" stroke="#3a424a" stroke-width="1.5"/>
  <!-- Rod seal / gland bore -->
  <rect x="900" y="310" width="40" height="60" fill="#4a525a"/>

  <!-- Inner bore outline -->
  <rect x="180" y="236" width="720" height="208" fill="none" stroke="#2a323a" stroke-width="2"/>

  <!-- Cap side pressure chamber (left / head end) - pressurized oil -->
  <rect x="180" y="236" width="280" height="208" fill="url(#oilA)"/>

  <!-- Rod side pressure chamber (right / rod end) - return oil -->
  <rect x="520" y="236" width="380" height="208" fill="url(#oilB)"/>

  <!-- Piston (thick disc) -->
  <rect x="460" y="242" width="60" height="196" rx="2" fill="url(#pistonGrad)" stroke="#1a2028" stroke-width="2"/>
  <!-- Piston seal rings -->
  <rect x="462" y="250" width="56" height="8" fill="#2a8a6a" stroke="#1a5a45" stroke-width="0.8"/>
  <rect x="462" y="422" width="56" height="8" fill="#2a8a6a" stroke="#1a5a45" stroke-width="0.8"/>
  <rect x="468" y="280" width="44" height="6" fill="#c07020" stroke="#8a5010" stroke-width="0.8"/>
  <rect x="468" y="394" width="44" height="6" fill="#c07020" stroke="#8a5010" stroke-width="0.8"/>

  <!-- Piston rod -->
  <rect x="520" y="318" width="480" height="44" fill="url(#rodGrad)" stroke="#3a424a" stroke-width="1.5"/>
  <!-- Rod end (external load attachment) -->
  <rect x="1000" y="310" width="50" height="60" rx="4" fill="#6b7380" stroke="#3a424a" stroke-width="1.5"/>
  <circle cx="1025" cy="340" r="12" fill="none" stroke="#2a323a" stroke-width="3"/>
  <circle cx="1025" cy="340" r="4" fill="#2a323a"/>

  <!-- Port A (head-end inlet) on left bottom -->
  <rect x="260" y="480" width="36" height="28" fill="#5c656e" stroke="#3a424a" stroke-width="1.5"/>
  <rect x="268" y="508" width="20" height="22" fill="#8a9299" stroke="#3a424a" stroke-width="1"/>
  <!-- Port channel into chamber -->
  <rect x="272" y="444" width="12" height="36" fill="#d49820"/>

  <!-- Port B (rod-end outlet) on right bottom -->
  <rect x="760" y="480" width="36" height="28" fill="#5c656e" stroke="#3a424a" stroke-width="1.5"/>
  <rect x="768" y="508" width="20" height="22" fill="#8a9299" stroke="#3a424a" stroke-width="1"/>
  <rect x="772" y="444" width="12" height="36" fill="#2a7fb8"/>

  <!-- ========== FLOW ARROWS ========== -->
  <!-- Inlet flow into Port A (up into chamber) -->
  <line x1="278" y1="560" x2="278" y2="520" stroke="#b33a1a" stroke-width="3" marker-end="url(#arrowHeadRed)"/>
  <!-- Flow inside left chamber pushing piston right -->
  <line x1="220" y1="300" x2="430" y2="300" stroke="#b33a1a" stroke-width="2.5" marker-end="url(#arrowHeadRed)"/>
  <line x1="220" y1="380" x2="430" y2="380" stroke="#b33a1a" stroke-width="2.5" marker-end="url(#arrowHeadRed)"/>

  <!-- Flow in right chamber exiting via Port B -->
  <line x1="700" y1="300" x2="860" y2="300" stroke="#1a5a8c" stroke-width="2.5" marker-end="url(#arrowHeadBlue)"/>
  <line x1="700" y1="380" x2="860" y2="380" stroke="#1a5a8c" stroke-width="2.5" marker-end="url(#arrowHeadBlue)"/>
  <line x1="778" y1="520" x2="778" y2="560" stroke="#1a5a8c" stroke-width="3" marker-end="url(#arrowHeadBlue)"/>

  <!-- Piston motion arrow (extension) -->
  <line x1="560" y1="180" x2="720" y2="180" stroke="#1a3a5c" stroke-width="3.5" marker-end="url(#arrowHead)"/>
  <text x="640" y="170" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a3a5c">Extension</text>

  <!-- ========== LABELS WITH LEADERS ========== -->
  <!-- Cylinder barrel -->
  <line x1="540" y1="200" x2="540" y2="145" stroke="#3a424a" stroke-width="1"/>
  <circle cx="540" cy="200" r="3" fill="#3a424a"/>
  <text x="540" y="138" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a2430">Cylinder Barrel</text>

  <!-- Blind end / left cap -->
  <line x1="165" y1="340" x2="90" y2="340" stroke="#3a424a" stroke-width="1"/>
  <text x="85" y="336" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a2430">Blind End</text>
  <text x="85" y="352" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6570">(Head Cap)</text>

  <!-- Cap-side / head-end chamber -->
  <text x="320" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6a4a08">Cap-Side Chamber</text>
  <text x="320" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6a4a08">(High Pressure)</text>

  <!-- Piston -->
  <line x1="490" y1="242" x2="490" y2="125" stroke="#3a424a" stroke-width="1"/>
  <circle cx="490" cy="242" r="3" fill="#3a424a"/>
  <text x="420" y="118" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a2430">Piston</text>

  <!-- Seal rings label -->
  <line x1="520" y1="254" x2="600" y2="125" stroke="#2a8a6a" stroke-width="1"/>
  <text x="640" y="122" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a5a45">Seal Rings</text>

  <!-- Rod-side chamber -->
  <text x="700" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#0a3a5c">Rod-Side Chamber</text>
  <text x="700" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0a3a5c">(Return / Low P)</text>

  <!-- Piston rod -->
  <line x1="920" y1="340" x2="980" y2="270" stroke="#3a424a" stroke-width="1"/>
  <circle cx="920" cy="340" r="3" fill="#3a424a"/>
  <text x="990" y="265" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a2430">Piston Rod</text>

  <!-- Rod end / gland -->
  <line x1="920" y1="250" x2="960" y2="155" stroke="#3a424a" stroke-width="1"/>
  <text x="965" y="150" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a2430">Rod End Cap</text>
  <text x="965" y="166" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5a6570">(&amp; Gland Seal)</text>

  <!-- Clevis / load attachment -->
  <line x1="1025" y1="370" x2="1025" y2="420" stroke="#3a424a" stroke-width="1"/>
  <text x="1025" y="438" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a2430">Load Clevis</text>

  <!-- Port A label -->
  <text x="278" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#b33a1a">Port A (IN)</text>
  <text x="278" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8a4a2a">Pressure Supply</text>

  <!-- Port B label -->
  <text x="778" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a5a8c">Port B (OUT)</text>
  <text x="778" y="602" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3a5a7a">Return to Tank</text>

  <!-- ========== LEGEND / NOTES PANEL ========== -->
  <rect x="60" y="660" width="1080" height="200" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1"/>
  <text x="90" y="695" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#1a2430">How It Works (Extension Stroke)</text>

  <!-- Legend color swatches -->
  <rect x="90" y="720" width="28" height="18" rx="2" fill="#d49820" stroke="#8a6810" stroke-width="1"/>
  <text x="128" y="734" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">Pressurized hydraulic oil (cap-side)</text>

  <rect x="90" y="752" width="28" height="18" rx="2" fill="#2a7fb8" stroke="#1a5080" stroke-width="1"/>
  <text x="128" y="766" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">Displaced oil returning (rod-side)</text>

  <rect x="90" y="784" width="28" height="18" rx="2" fill="#6b7380" stroke="#3a424a" stroke-width="1"/>
  <text x="128" y="798" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">Metal parts: barrel, piston, rod, end caps</text>

  <rect x="90" y="816" width="28" height="18" rx="2" fill="#2a8a6a" stroke="#1a5a45" stroke-width="1"/>
  <text x="128" y="830" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">Seals (prevent leakage past piston / rod)</text>

  <!-- Process steps -->
  <text x="520" y="734" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">1. Oil enters Port A into the cap-side chamber.</text>
  <text x="520" y="758" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">2. Pressure acts on the piston face, force = P x Area.</text>
  <text x="520" y="782" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">3. Piston and rod extend to the right (load moves).</text>
  <text x="520" y="806" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2430">4. Rod-side oil exits via Port B back to the tank.</text>
  <text x="520" y="830" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#5a6570">Retraction: reverse ports (B supply, A return).</text>
</svg>
