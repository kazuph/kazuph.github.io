<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2980b9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#fafafa"/>
  <text x="600" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#2c3e50">Michelson Interferometer</text>

  <!-- Laser (left) -->
  <rect x="80" y="400" width="120" height="60" rx="6" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <text x="140" y="438" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">Laser</text>

  <!-- Beam Splitter (center) -->
  <g transform="translate(560,400)">
    <rect x="0" y="0" width="80" height="80" fill="#f5b041" stroke="#b9770e" stroke-width="2" transform="rotate(45 40 40)"/>
  </g>
  <text x="600" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7d6608">Beam Splitter</text>

  <!-- Mirror A (top) -->
  <rect x="560" y="100" width="80" height="24" rx="2" fill="#5dade2" stroke="#1a5276" stroke-width="2"/>
  <text x="600" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a5276">Mirror A</text>

  <!-- Mirror B (right) -->
  <rect x="960" y="400" width="24" height="80" rx="2" fill="#5dade2" stroke="#1a5276" stroke-width="2"/>
  <text x="972" y="380" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1a5276">Mirror B</text>

  <!-- Screen (bottom) -->
  <rect x="540" y="740" width="120" height="40" rx="4" fill="#58d68d" stroke="#1e8449" stroke-width="2"/>
  <text x="600" y="766" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#145a32">Screen</text>

  <!-- Optical paths -->
  <!-- Laser to Beam Splitter -->
  <line x1="200" y1="430" x2="545" y2="430" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Beam Splitter to Mirror A (up) -->
  <line x1="600" y1="400" x2="600" y2="134" stroke="#2980b9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <!-- Mirror A return -->
  <line x1="585" y1="124" x2="585" y2="395" stroke="#2980b9" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowBlue)"/>

  <!-- Beam Splitter to Mirror B (right) -->
  <line x1="640" y1="440" x2="950" y2="440" stroke="#2980b9" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <!-- Mirror B return -->
  <line x1="960" y1="425" x2="655" y2="425" stroke="#2980b9" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowBlue)"/>

  <!-- Combined beam to Screen -->
  <line x1="600" y1="480" x2="600" y2="730" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- Legends / notes -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#34495e">
    <line x1="80" y1="820" x2="140" y2="820" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="150" y="825">Incident beam</text>
    <line x1="320" y1="820" x2="380" y2="820" stroke="#2980b9" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="390" y="825">Split / return paths</text>
    <line x1="600" y1="820" x2="660" y2="820" stroke="#2980b9" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="670" y="825">Reflected return</text>
    <line x1="860" y1="820" x2="920" y2="820" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <text x="930" y="825">Interference</text>
  </g>

  <!-- Arm labels -->
  <text x="520" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7f8c8d">Arm A</text>
  <text x="800" y="400" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7f8c8d">Arm B</text>
</svg>
