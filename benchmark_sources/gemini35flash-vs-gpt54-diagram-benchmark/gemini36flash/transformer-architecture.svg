<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2D3748"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E53E3E"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Encoder Container (Left) -->
  <rect x="80" y="80" width="460" height="740" fill="#FFF5F5" stroke="#E53E3E" stroke-width="3" stroke-dasharray="8,8" rx="15"/>
  <text x="110" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#E53E3E">Encoder (N×)</text>

  <!-- Decoder Container (Right) -->
  <rect x="660" y="80" width="460" height="740" fill="#EBF8FF" stroke="#3182CE" stroke-width="3" stroke-dasharray="8,8" rx="15"/>
  <text x="690" y="125" font-family="sans-serif" font-size="26" font-weight="bold" fill="#3182CE">Decoder (N×)</text>

  <!-- Helper Styles for Blocks -->
  <!-- Encoder Blocks -->
  <g text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">
    <!-- Encoder Inputs & Embedding -->
    <text x="310" y="800" fill="#2D3748">Inputs</text>
    <line x1="310" y1="780" x2="310" y2="730" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <rect x="180" y="670" width="260" height="60" fill="#B794F4" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="310" y="707" fill="#FFFFFF">Input Embedding</text>

    <!-- Positional Encoding Sum -->
    <circle cx="310" cy="610" r="20" fill="#FFFFFF" stroke="#2D3748" stroke-width="3"/>
    <text x="310" y="617" fill="#2D3748">+</text>
    <line x1="310" y1="670" x2="310" y2="630" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Encoder Layer Nodes -->
    <!-- Multi-Head Attn -->
    <rect x="180" y="470" width="260" height="80" fill="#F6AD55" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="310" y="517" fill="#1A202C">Multi-Head Attention</text>
    <line x1="310" y1="590" x2="310" y2="550" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Add & Norm 1 -->
    <rect x="180" y="370" width="260" height="60" fill="#F6E05E" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="310" y="407" fill="#1A202C">Add &amp; Norm</text>
    <line x1="310" y1="470" x2="310" y2="430" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Feed Forward -->
    <rect x="180" y="240" width="260" height="80" fill="#68D391" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="310" y="287" fill="#1A202C">Feed Forward</text>
    <line x1="310" y1="370" x2="310" y2="320" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Add & Norm 2 -->
    <rect x="180" y="140" width="260" height="60" fill="#F6E05E" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="310" y="177" fill="#1A202C">Add &amp; Norm</text>
    <line x1="310" y1="240" x2="310" y2="200" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>


    <!-- Decoder Inputs & Embedding -->
    <text x="890" y="800" fill="#2D3748">Outputs (shifted right)</text>
    <line x1="890" y1="780" x2="890" y2="730" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <rect x="760" y="670" width="260" height="60" fill="#B794F4" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="707" fill="#FFFFFF">Output Embedding</text>

    <!-- Positional Encoding Sum -->
    <circle cx="890" cy="610" r="20" fill="#FFFFFF" stroke="#2D3748" stroke-width="3"/>
    <text x="890" y="617" fill="#2D3748">+</text>
    <line x1="890" y1="670" x2="890" y2="630" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Masked Multi-Head Attn -->
    <rect x="760" y="500" width="260" height="70" fill="#F6AD55" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="542" fill="#1A202C">Masked Multi-Head Attn</text>
    <line x1="890" y1="590" x2="890" y2="570" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Add & Norm 1 -->
    <rect x="760" y="410" width="260" height="50" fill="#F6E05E" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="442" fill="#1A202C">Add &amp; Norm</text>
    <line x1="890" y1="500" x2="890" y2="460" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Cross Attention -->
    <rect x="760" y="300" width="260" height="70" fill="#F6AD55" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="342" fill="#1A202C">Multi-Head Cross Attn</text>
    <line x1="890" y1="410" x2="890" y2="370" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Add & Norm 2 -->
    <rect x="760" y="220" width="260" height="50" fill="#F6E05E" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="252" fill="#1A202C">Add &amp; Norm</text>
    <line x1="890" y1="300" x2="890" y2="270" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Feed Forward -->
    <rect x="760" y="140" width="260" height="50" fill="#68D391" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="172" fill="#1A202C">Feed Forward</text>
    <line x1="890" y1="220" x2="890" y2="190" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Add & Norm 3 -->
    <rect x="760" y="60" width="260" height="50" fill="#F6E05E" stroke="#2D3748" stroke-width="3" rx="8"/>
    <text x="890" y="92" fill="#1A202C">Add &amp; Norm</text>
    <line x1="890" y1="140" x2="890" y2="110" stroke="#2D3748" stroke-width="3" marker-end="url(#arr)"/>

    <!-- Cross Attention Arrow from Encoder -->
    <path d="M 440,170 L 600,170 L 600,335 L 760,335" fill="none" stroke="#E53E3E" stroke-width="4" marker-end="url(#arrRed)"/>
    <text x="600" y="320" font-size="16" fill="#E53E3E">K, V</text>
  </g>
</svg>
