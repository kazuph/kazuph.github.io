<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="rotArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD6B20"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#F7FAFC"/>

  <g transform="translate(100, 100)">
    <!-- Base Platform (J1) -->
    <polygon points="120,700 480,700 440,640 160,640" fill="#2B6CB0" stroke="#000000" stroke-width="4"/>
    <rect x="160" y="580" width="280" height="60" fill="#3182CE" stroke="#000000" stroke-width="4"/>
    <text x="300" y="620" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BASE</text>

    <!-- Joint 1 (J1: Base Yaw) -->
    <rect x="220" y="520" width="160" height="60" fill="#ED8936" stroke="#000000" stroke-width="4"/>
    <path d="M 170,550 A 130 40 0 0 0 430,550" fill="none" stroke="#DD6B20" stroke-width="5" marker-end="url(#rotArr)"/>
    <text x="460" y="555" font-family="sans-serif" font-size="24" font-weight="bold" fill="#DD6B20">J1 (Base Yaw)</text>

    <!-- Link 1 -->
    <rect x="250" y="440" width="100" height="80" fill="#CBD5E0" stroke="#718096" stroke-width="4"/>

    <!-- Joint 2 (J2: Shoulder Pitch) -->
    <circle cx="210" cy="400" r="50" fill="#ED8936" stroke="#000000" stroke-width="4"/>
    <path d="M 210,330 A 70 70 0 0 1 210,470" fill="none" stroke="#DD6B20" stroke-width="5" marker-end="url(#rotArr)"/>
    <text x="120" y="410" font-family="sans-serif" font-size="24" font-weight="bold" fill="#DD6B20" text-anchor="end">J2 (Shoulder Pitch)</text>

    <!-- Link 2 (Upper Arm) -->
    <g transform="rotate(-35 210 400)">
      <rect x="210" y="375" width="260" height="50" fill="#CBD5E0" stroke="#718096" stroke-width="4"/>
    </g>

    <!-- Joint 3 (J3: Shoulder Roll) -->
    <g transform="translate(420, 250)">
      <circle cx="0" cy="0" r="45" fill="#ED8936" stroke="#000000" stroke-width="4"/>
      <path d="M -60,0 A 60 20 0 0 0 60,0" fill="none" stroke="#DD6B20" stroke-width="5" marker-end="url(#rotArr)"/>
      <text x="-30" y="-55" font-family="sans-serif" font-size="24" font-weight="bold" fill="#DD6B20">J3 (Shoulder Roll)</text>

      <!-- Link 3 (Elbow Link) -->
      <g transform="rotate(25)">
        <rect x="0" y="-25" width="200" height="50" fill="#CBD5E0" stroke="#718096" stroke-width="4"/>
      </g>
    </g>

    <!-- Joint 4 (J4: Elbow Pitch) -->
    <g transform="translate(600, 330)">
      <circle cx="0" cy="0" r="42" fill="#ED8936" stroke="#000000" stroke-width="4"/>
      <path d="M 0,-55 A 55 55 0 0 1 0,55" fill="none" stroke="#DD6B20" stroke-width="5" marker-end="url(#rotArr)"/>
      <text x="65" y="-30" font-family="sans-serif" font-size="24" font-weight="bold" fill="#DD6B20">J4 (Elbow Pitch)</text>

      <!-- Link 4 (Forearm) -->
      <g transform="rotate(-40)">
        <rect x="0" y="-20" width="160" height="40" fill="#CBD5E0" stroke="#718096" stroke-width="4"/>
      </g>
    </g>

    <!-- Joint 5 (J5: Wrist Roll) -->
    <g transform="translate(720, 230)">
      <circle cx="0" cy="0" r="36" fill="#ED8936" stroke="#000000" stroke-width="4"/>
      <text x="-40" y="-45" font-family="sans-serif" font-size="22" font-weight="bold" fill="#DD6B20">J5 (Wrist Roll)</text>
    </g>

    <!-- Joint 6 (J6: Wrist Pitch) -->
    <g transform="translate(790, 250)">
      <circle cx="0" cy="0" r="32" fill="#ED8936" stroke="#000000" stroke-width="4"/>
      <text x="0" y="-40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#DD6B20" text-anchor="middle">J6 (Wrist Pitch)</text>
    </g>

    <!-- Joint 7 (J7: Wrist Twist) -->
    <g transform="translate(850, 250)">
      <rect x="-15" y="-25" width="30" height="50" fill="#DD6B20" stroke="#000000" stroke-width="4"/>
      <text x="0" y="55" font-family="sans-serif" font-size="22" font-weight="bold" fill="#DD6B20" text-anchor="middle">J7 (Twist)</text>
    </g>

    <!-- End Effector Gripper -->
    <g transform="translate(880, 220)">
      <rect x="0" y="0" width="40" height="60" fill="#E53E3E" stroke="#000000" stroke-width="4"/>
      <rect x="40" y="5" width="60" height="15" fill="#E53E3E" stroke="#000000" stroke-width="3"/>
      <rect x="40" y="40" width="60" height="15" fill="#E53E3E" stroke="#000000" stroke-width="3"/>
      <text x="115" y="35" font-family="sans-serif" font-size="24" font-weight="bold" fill="#E53E3E">End Effector</text>
    </g>
  </g>
</svg>
