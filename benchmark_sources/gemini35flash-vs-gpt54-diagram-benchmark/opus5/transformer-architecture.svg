<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="arwres" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
    <marker id="arwx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c3fb5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <text x="60" y="56" font-size="24" font-weight="bold" fill="#1f2933">Transformer Architecture</text>
  <text x="60" y="82" font-size="13" fill="#5c6b7a">Encoder-Decoder stack, residual (Add &amp; Norm) paths and cross-attention</text>

  <!-- legend -->
  <rect x="155" y="150" width="350" height="255" rx="8" fill="#fafafa" stroke="#cccccc"/>
  <text x="175" y="176" font-size="14" font-weight="bold" fill="#1f2933">Legend</text>

  <rect x="175" y="185" width="22" height="15" rx="3" fill="#f6c8c8" stroke="#c0392b"/>
  <text x="207" y="197" font-size="12" fill="#333333">Self-Attention (Multi-Head)</text>

  <rect x="175" y="217" width="22" height="15" rx="3" fill="#f7d9b0" stroke="#c87f0a"/>
  <text x="207" y="229" font-size="12" fill="#333333">Masked Self-Attention (decoder)</text>

  <rect x="175" y="249" width="22" height="15" rx="3" fill="#d9c8f0" stroke="#6c3fb5"/>
  <text x="207" y="261" font-size="12" fill="#333333">Cross-Attention (K,V from encoder)</text>

  <rect x="175" y="281" width="22" height="15" rx="3" fill="#cfe3f7" stroke="#2e6da4"/>
  <text x="207" y="293" font-size="12" fill="#333333">Position-wise Feed Forward</text>

  <rect x="175" y="313" width="22" height="15" rx="3" fill="#fdf0b8" stroke="#b8952a"/>
  <text x="207" y="325" font-size="12" fill="#333333">Add &amp; Norm (residual + LayerNorm)</text>

  <rect x="175" y="345" width="22" height="15" rx="3" fill="#d8f0d8" stroke="#3d8b3d"/>
  <text x="207" y="357" font-size="12" fill="#333333">Embedding / Linear projection</text>

  <line x1="175" y1="384" x2="197" y2="384" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="207" y="389" font-size="12" fill="#333333">Residual (skip) connection</text>

  <!-- stack containers -->
  <rect x="170" y="440" width="320" height="265" rx="10" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="650" y="310" width="320" height="395" rx="10" fill="none" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="235" y="432" font-size="14" font-weight="bold" fill="#66727f">ENCODER</text>
  <text x="655" y="302" font-size="14" font-weight="bold" fill="#66727f">DECODER</text>
  <text x="140" y="578" font-size="15" font-weight="bold" fill="#66727f">N x</text>
  <text x="985" y="510" font-size="15" font-weight="bold" fill="#66727f">x N</text>

  <!-- ================= ENCODER ================= -->
  <text x="330" y="874" font-size="14" font-weight="bold" fill="#1f2933">Inputs</text>
  <line x1="330" y1="858" x2="330" y2="820" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="200" y="770" width="260" height="46" rx="6" fill="#d8f0d8" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="330" y="798" font-size="14" text-anchor="middle" fill="#1f2933">Input Embedding</text>
  <line x1="330" y1="770" x2="330" y2="757" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <circle cx="330" cy="740" r="13" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="330" y="745" font-size="15" text-anchor="middle" fill="#333333">+</text>
  <rect x="40" y="716" width="140" height="48" rx="6" fill="#d8f0d8" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="110" y="736" font-size="12" text-anchor="middle" fill="#1f2933">Positional</text>
  <text x="110" y="752" font-size="12" text-anchor="middle" fill="#1f2933">Encoding</text>
  <line x1="180" y1="740" x2="315" y2="740" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <line x1="330" y1="727" x2="330" y2="690" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
  <circle cx="330" cy="715" r="3.5" fill="#7a7a7a"/>

  <rect x="200" y="640" width="260" height="46" rx="6" fill="#f6c8c8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="330" y="668" font-size="14" text-anchor="middle" fill="#1f2933">Multi-Head Attention</text>
  <line x1="330" y1="640" x2="330" y2="620" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="200" y="580" width="260" height="36" rx="6" fill="#fdf0b8" stroke="#b8952a" stroke-width="1.5"/>
  <text x="330" y="603" font-size="14" text-anchor="middle" fill="#1f2933">Add &amp; Norm</text>
  <line x1="330" y1="580" x2="330" y2="555" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
  <circle cx="330" cy="566" r="3.5" fill="#7a7a7a"/>

  <rect x="200" y="505" width="260" height="46" rx="6" fill="#cfe3f7" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="330" y="533" font-size="14" text-anchor="middle" fill="#1f2933">Feed Forward</text>
  <line x1="330" y1="505" x2="330" y2="490" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="200" y="450" width="260" height="36" rx="6" fill="#fdf0b8" stroke="#b8952a" stroke-width="1.5"/>
  <text x="330" y="473" font-size="14" text-anchor="middle" fill="#1f2933">Add &amp; Norm</text>

  <polyline points="330,715 185,715 185,598 197,598" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwres)"/>
  <polyline points="330,566 185,566 185,468 197,468" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwres)"/>

  <!-- ================= DECODER ================= -->
  <text x="810" y="874" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">Outputs (shifted right)</text>
  <line x1="810" y1="858" x2="810" y2="820" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="680" y="770" width="260" height="46" rx="6" fill="#d8f0d8" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="810" y="798" font-size="14" text-anchor="middle" fill="#1f2933">Output Embedding</text>
  <line x1="810" y1="770" x2="810" y2="757" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <circle cx="810" cy="740" r="13" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="810" y="745" font-size="15" text-anchor="middle" fill="#333333">+</text>
  <rect x="1020" y="716" width="140" height="48" rx="6" fill="#d8f0d8" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="1090" y="736" font-size="12" text-anchor="middle" fill="#1f2933">Positional</text>
  <text x="1090" y="752" font-size="12" text-anchor="middle" fill="#1f2933">Encoding</text>
  <line x1="1020" y1="740" x2="825" y2="740" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <line x1="810" y1="727" x2="810" y2="690" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
  <circle cx="810" cy="715" r="3.5" fill="#7a7a7a"/>

  <rect x="680" y="640" width="260" height="46" rx="6" fill="#f7d9b0" stroke="#c87f0a" stroke-width="1.5"/>
  <text x="810" y="663" font-size="13" text-anchor="middle" fill="#1f2933">Masked Multi-Head Attention</text>
  <text x="810" y="678" font-size="10.5" text-anchor="middle" fill="#7a5410">(causal mask: no future tokens)</text>
  <line x1="810" y1="640" x2="810" y2="620" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="680" y="580" width="260" height="36" rx="6" fill="#fdf0b8" stroke="#b8952a" stroke-width="1.5"/>
  <text x="810" y="603" font-size="14" text-anchor="middle" fill="#1f2933">Add &amp; Norm</text>
  <line x1="810" y1="580" x2="810" y2="555" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
  <circle cx="810" cy="566" r="3.5" fill="#7a7a7a"/>

  <rect x="680" y="505" width="260" height="46" rx="6" fill="#d9c8f0" stroke="#6c3fb5" stroke-width="1.5"/>
  <text x="810" y="524" font-size="13" text-anchor="middle" fill="#1f2933">Multi-Head Attention</text>
  <text x="810" y="540" font-size="10.5" text-anchor="middle" fill="#4b2a80">Cross-Attention: Q from decoder, K,V from encoder</text>
  <line x1="810" y1="505" x2="810" y2="490" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="680" y="450" width="260" height="36" rx="6" fill="#fdf0b8" stroke="#b8952a" stroke-width="1.5"/>
  <text x="810" y="473" font-size="14" text-anchor="middle" fill="#1f2933">Add &amp; Norm</text>
  <line x1="810" y1="450" x2="810" y2="425" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
  <circle cx="810" cy="436" r="3.5" fill="#7a7a7a"/>

  <rect x="680" y="375" width="260" height="46" rx="6" fill="#cfe3f7" stroke="#2e6da4" stroke-width="1.5"/>
  <text x="810" y="403" font-size="14" text-anchor="middle" fill="#1f2933">Feed Forward</text>
  <line x1="810" y1="375" x2="810" y2="360" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="680" y="320" width="260" height="36" rx="6" fill="#fdf0b8" stroke="#b8952a" stroke-width="1.5"/>
  <text x="810" y="343" font-size="14" text-anchor="middle" fill="#1f2933">Add &amp; Norm</text>
  <line x1="810" y1="320" x2="810" y2="290" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <polyline points="810,715 955,715 955,598 943,598" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwres)"/>
  <polyline points="810,566 955,566 955,468 943,468" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwres)"/>
  <polyline points="810,436 955,436 955,338 943,338" fill="none" stroke="#7a7a7a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arwres)"/>

  <!-- output head -->
  <rect x="720" y="240" width="180" height="46" rx="6" fill="#d8f0d8" stroke="#3d8b3d" stroke-width="1.5"/>
  <text x="810" y="268" font-size="14" text-anchor="middle" fill="#1f2933">Linear</text>
  <line x1="810" y1="240" x2="810" y2="215" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="720" y="165" width="180" height="46" rx="6" fill="#e2e2ea" stroke="#555f6b" stroke-width="1.5"/>
  <text x="810" y="193" font-size="14" text-anchor="middle" fill="#1f2933">Softmax</text>
  <line x1="810" y1="165" x2="810" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#arw)"/>
  <text x="810" y="138" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2933">Output Probabilities</text>

  <!-- encoder output -> decoder cross-attention -->
  <polyline points="330,450 330,424 620,424 620,528 678,528" fill="none" stroke="#6c3fb5" stroke-width="2.5" marker-end="url(#arwx)"/>
  <text x="475" y="416" font-size="12" font-weight="bold" text-anchor="middle" fill="#6c3fb5">Encoder memory: K, V</text>
</svg>
