<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#b45309"/>
    </marker>
    <marker id="arDash" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#f6f8fb"/>

  <text x="48" y="50" font-size="26" font-weight="bold" fill="#0f172a">RAG Pipeline Architecture</text>
  <text x="48" y="76" font-size="13" fill="#64748b">Retrieval-Augmented Generation: offline document ingestion and online query-time retrieval sharing one vector store</text>

  <!-- ================= OFFLINE LANE ================= -->
  <rect x="48" y="104" width="1104" height="182" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="8 5"/>
  <rect x="66" y="120" width="10" height="10" rx="2" fill="#4f46e5"/>
  <text x="86" y="130" font-size="13" font-weight="bold" fill="#4338ca" letter-spacing="0.6">OFFLINE - DOCUMENT INGESTION (batch / scheduled, runs before any query)</text>

  <g filter="url(#sh)">
    <rect x="78" y="170" width="210" height="96" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="78" y="170" width="210" height="5" rx="2.5" fill="#6366f1"/>
    <rect x="356" y="170" width="210" height="96" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="356" y="170" width="210" height="5" rx="2.5" fill="#6366f1"/>
    <rect x="634" y="170" width="210" height="96" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="634" y="170" width="210" height="5" rx="2.5" fill="#6366f1"/>
    <rect x="912" y="170" width="210" height="96" rx="12" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
    <rect x="912" y="170" width="210" height="5" rx="2.5" fill="#6366f1"/>
  </g>

  <text x="94" y="196" font-size="10" font-weight="bold" fill="#94a3b8">01</text>
  <text x="183" y="226" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Source Documents</text>
  <text x="183" y="248" font-size="10.5" fill="#64748b" text-anchor="middle">PDF / HTML / Markdown / DB rows</text>

  <text x="372" y="196" font-size="10" font-weight="bold" fill="#94a3b8">02</text>
  <text x="461" y="226" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Loader + Parser</text>
  <text x="461" y="248" font-size="10.5" fill="#64748b" text-anchor="middle">extract text, clean, normalize</text>

  <text x="650" y="196" font-size="10" font-weight="bold" fill="#94a3b8">03</text>
  <text x="739" y="226" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Chunk Splitter</text>
  <text x="739" y="248" font-size="10.5" fill="#64748b" text-anchor="middle">size + overlap, keep metadata</text>

  <text x="928" y="196" font-size="10" font-weight="bold" fill="#94a3b8">04</text>
  <text x="1017" y="226" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Embedding Model</text>
  <text x="1017" y="248" font-size="10.5" fill="#64748b" text-anchor="middle">chunk text to dense vector</text>

  <path d="M292,218 H352" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M570,218 H630" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M848,218 H908" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="322" y="208" font-size="10" fill="#64748b" text-anchor="middle">load</text>
  <text x="600" y="208" font-size="10" fill="#64748b" text-anchor="middle">chunks</text>
  <text x="878" y="208" font-size="10" fill="#64748b" text-anchor="middle">encode</text>

  <!-- ingestion write into the vector store -->
  <path d="M1017,266 L1017,300 L700,300 L700,326" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arAmber)"/>
  <text x="858" y="293" font-size="10.5" font-weight="bold" fill="#b45309" text-anchor="middle">upsert: vectors + chunk metadata</text>

  <!-- ================= SHARED VECTOR STORE ================= -->
  <g filter="url(#sh)">
    <path d="M460,352 L460,468 C460,497 740,497 740,468 L740,352 Z" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
    <ellipse cx="600" cy="352" rx="140" ry="22" fill="#fde68a" stroke="#f59e0b" stroke-width="1.8"/>
  </g>
  <text x="600" y="400" font-size="17" font-weight="bold" fill="#78350f" text-anchor="middle">Vector Database</text>
  <text x="600" y="422" font-size="10.5" fill="#92400e" text-anchor="middle">embeddings + text chunks + source metadata</text>
  <text x="600" y="440" font-size="10" fill="#a16207" text-anchor="middle">ANN index (HNSW / IVF), filters, namespaces</text>
  <text x="600" y="462" font-size="10" font-style="italic" fill="#a16207" text-anchor="middle">shared by both lanes</text>

  <!-- ================= ONLINE LANE ================= -->
  <rect x="48" y="508" width="1104" height="344" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
  <rect x="66" y="524" width="10" height="10" rx="2" fill="#059669"/>
  <text x="86" y="534" font-size="13" font-weight="bold" fill="#047857" letter-spacing="0.6">ONLINE - QUERY TIME (per user request, low latency)</text>

  <g filter="url(#sh)">
    <rect x="78" y="580" width="176" height="96" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="78" y="580" width="176" height="5" rx="2.5" fill="#10b981"/>
    <rect x="295" y="580" width="176" height="96" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="295" y="580" width="176" height="5" rx="2.5" fill="#10b981"/>
    <rect x="512" y="580" width="176" height="96" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="512" y="580" width="176" height="5" rx="2.5" fill="#10b981"/>
    <rect x="729" y="580" width="176" height="96" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="729" y="580" width="176" height="5" rx="2.5" fill="#10b981"/>
    <rect x="946" y="580" width="176" height="96" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="946" y="580" width="176" height="5" rx="2.5" fill="#8b5cf6"/>
  </g>

  <text x="94" y="606" font-size="10" font-weight="bold" fill="#94a3b8">1</text>
  <text x="166" y="636" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">User Query</text>
  <text x="166" y="658" font-size="10.5" fill="#64748b" text-anchor="middle">natural language question</text>

  <text x="311" y="606" font-size="10" font-weight="bold" fill="#94a3b8">2</text>
  <text x="383" y="636" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Query Embedder</text>
  <text x="383" y="658" font-size="10.5" fill="#64748b" text-anchor="middle">same model as ingestion</text>

  <text x="528" y="606" font-size="10" font-weight="bold" fill="#94a3b8">3</text>
  <text x="600" y="636" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Retriever</text>
  <text x="600" y="658" font-size="10.5" fill="#64748b" text-anchor="middle">top-k search, hybrid + rerank</text>

  <text x="745" y="606" font-size="10" font-weight="bold" fill="#94a3b8">4</text>
  <text x="817" y="636" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Retrieved Context</text>
  <text x="817" y="658" font-size="10.5" fill="#64748b" text-anchor="middle">k passages with source refs</text>

  <text x="962" y="606" font-size="10" font-weight="bold" fill="#94a3b8">5</text>
  <text x="1034" y="636" font-size="16" font-weight="bold" fill="#4c1d95" text-anchor="middle">LLM Generator</text>
  <text x="1034" y="658" font-size="10.5" fill="#6d28d9" text-anchor="middle">context-grounded prompt</text>

  <path d="M258,628 H291" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M475,628 H508" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M909,628 H942" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- retrieval round trip through the vector store -->
  <path d="M600,576 V494" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arAmber)"/>
  <text x="612" y="544" font-size="10.5" font-weight="bold" fill="#b45309">query vector + filters</text>

  <path d="M740,420 H817 V572" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arAmber)"/>
  <text x="824" y="440" font-size="10.5" font-weight="bold" fill="#b45309">top-k matches</text>

  <!-- original query carried into the prompt -->
  <path d="M166,676 V712 H990 V684" stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#arDash)"/>
  <text x="470" y="704" font-size="10.5" fill="#64748b" text-anchor="middle">original question carried into the prompt (context + query)</text>

  <g filter="url(#sh)">
    <rect x="946" y="730" width="176" height="76" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="1.8"/>
  </g>
  <text x="1034" y="762" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">Answer</text>
  <text x="1034" y="784" font-size="10.5" fill="#166534" text-anchor="middle">grounded, with citations</text>
  <path d="M1034,676 V726" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <!-- ================= LEGEND ================= -->
  <path d="M60,872 H98" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="106" y="876" font-size="11" fill="#475569">data flow</text>

  <path d="M200,872 H238" stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#arAmber)"/>
  <text x="246" y="876" font-size="11" fill="#475569">vector store read / write</text>

  <path d="M420,872 H458" stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#arDash)"/>
  <text x="466" y="876" font-size="11" fill="#475569">query passthrough</text>

  <rect x="630" y="863" width="20" height="16" rx="3" fill="#eef2ff" stroke="#c7d2fe" stroke-dasharray="4 3"/>
  <text x="658" y="876" font-size="11" fill="#475569">offline lane</text>

  <rect x="760" y="863" width="20" height="16" rx="3" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="788" y="876" font-size="11" fill="#475569">online lane</text>

  <rect x="890" y="863" width="20" height="16" rx="3" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="918" y="876" font-size="11" fill="#475569">persistent store</text>
</svg>
