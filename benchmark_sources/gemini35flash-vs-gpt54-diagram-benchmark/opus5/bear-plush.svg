<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Cute front-facing teddy bear plush">
  <title>Teddy Bear Plush</title>
  <desc>A cute front-facing bear plush toy in warm colors, with large ears, soft body, paw pads and a chest badge.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="0.55" stop-color="#FDEBD6"/>
      <stop offset="1" stop-color="#F8DDC2"/>
    </linearGradient>

    <radialGradient id="furHead" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#E9B57E"/>
      <stop offset="0.55" stop-color="#D99B62"/>
      <stop offset="1" stop-color="#BC7C45"/>
    </radialGradient>

    <radialGradient id="furBody" cx="0.38" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#E4AE76"/>
      <stop offset="0.55" stop-color="#D2934F"/>
      <stop offset="1" stop-color="#B0713C"/>
    </radialGradient>

    <radialGradient id="furLimb" cx="0.35" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#DFA76D"/>
      <stop offset="0.6" stop-color="#C98B4B"/>
      <stop offset="1" stop-color="#A56A38"/>
    </radialGradient>

    <radialGradient id="muzzle" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFF3E2"/>
      <stop offset="0.6" stop-color="#F7DCBE"/>
      <stop offset="1" stop-color="#E8C49C"/>
    </radialGradient>

    <radialGradient id="belly" cx="0.42" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FCE7CC"/>
      <stop offset="0.65" stop-color="#F3D4AF"/>
      <stop offset="1" stop-color="#E2BC90"/>
    </radialGradient>

    <radialGradient id="pad" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#F8C6AE"/>
      <stop offset="0.6" stop-color="#EFAE92"/>
      <stop offset="1" stop-color="#DE9376"/>
    </radialGradient>

    <radialGradient id="innerEar" cx="0.42" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#F7C3AA"/>
      <stop offset="1" stop-color="#E19E82"/>
    </radialGradient>

    <radialGradient id="eyeBall" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#5C3A24"/>
      <stop offset="0.7" stop-color="#3B2317"/>
      <stop offset="1" stop-color="#241309"/>
    </radialGradient>

    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7E3"/>
      <stop offset="1" stop-color="#F6E0B8"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2917C"/>
      <stop offset="1" stop-color="#DB6A55"/>
    </linearGradient>

    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F19A85" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F19A85" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="groundShadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C79263" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C79263" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#8A5A2E" flood-opacity="0.28"/>
    </filter>

    <filter id="fuzz" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- background decoration -->
  <g opacity="0.5" fill="#F6D2AE">
    <circle cx="150" cy="150" r="52"/>
    <circle cx="1055" cy="205" r="38"/>
    <circle cx="1090" cy="640" r="66"/>
    <circle cx="105" cy="620" r="30"/>
    <circle cx="238" cy="795" r="22"/>
    <circle cx="965" cy="815" r="30"/>
  </g>
  <g opacity="0.45" fill="none" stroke="#EBB98C" stroke-width="5" stroke-linecap="round">
    <path d="M120 300 q26 -26 52 0 q26 26 -52 66 q-78 -40 -52 -66 q26 -26 52 0 z"/>
    <path d="M1040 430 q22 -22 44 0 q22 22 -44 56 q-66 -34 -44 -56 q22 -22 44 0 z"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="600" cy="846" rx="330" ry="52" fill="url(#groundShadow)"/>

  <g filter="url(#softShadow)">
    <!-- ears -->
    <g filter="url(#fuzz)">
      <circle cx="472" cy="182" r="66" fill="url(#furHead)"/>
      <circle cx="728" cy="182" r="66" fill="url(#furHead)"/>
    </g>
    <circle cx="472" cy="188" r="38" fill="url(#innerEar)"/>
    <circle cx="728" cy="188" r="38" fill="url(#innerEar)"/>

    <!-- arms behind the body -->
    <g transform="rotate(22 392 588)">
      <g filter="url(#fuzz)">
        <ellipse cx="392" cy="588" rx="66" ry="112" fill="url(#furLimb)"/>
      </g>
      <ellipse cx="392" cy="662" rx="38" ry="32" fill="url(#pad)"/>
      <ellipse cx="380" cy="652" rx="16" ry="13" fill="#FBDCCB" opacity="0.75"/>
    </g>
    <g transform="rotate(-22 808 588)">
      <g filter="url(#fuzz)">
        <ellipse cx="808" cy="588" rx="66" ry="112" fill="url(#furLimb)"/>
      </g>
      <ellipse cx="808" cy="662" rx="38" ry="32" fill="url(#pad)"/>
      <ellipse cx="820" cy="652" rx="16" ry="13" fill="#FBDCCB" opacity="0.75"/>
    </g>

    <!-- legs behind the body -->
    <g transform="rotate(-9 470 776)">
      <g filter="url(#fuzz)">
        <ellipse cx="470" cy="776" rx="104" ry="84" fill="url(#furLimb)"/>
      </g>
      <ellipse cx="466" cy="790" rx="64" ry="52" fill="url(#pad)"/>
      <g fill="#FBDCCB" opacity="0.85">
        <ellipse cx="428" cy="756" rx="15" ry="12"/>
        <ellipse cx="466" cy="746" rx="15" ry="12"/>
        <ellipse cx="504" cy="758" rx="15" ry="12"/>
      </g>
    </g>
    <g transform="rotate(9 730 776)">
      <g filter="url(#fuzz)">
        <ellipse cx="730" cy="776" rx="104" ry="84" fill="url(#furLimb)"/>
      </g>
      <ellipse cx="734" cy="790" rx="64" ry="52" fill="url(#pad)"/>
      <g fill="#FBDCCB" opacity="0.85">
        <ellipse cx="696" cy="758" rx="15" ry="12"/>
        <ellipse cx="734" cy="746" rx="15" ry="12"/>
        <ellipse cx="772" cy="756" rx="15" ry="12"/>
      </g>
    </g>

    <!-- body -->
    <g filter="url(#fuzz)">
      <ellipse cx="600" cy="618" rx="218" ry="192" fill="url(#furBody)"/>
    </g>
    <ellipse cx="600" cy="648" rx="152" ry="142" fill="url(#belly)"/>
    <ellipse cx="540" cy="530" rx="86" ry="56" fill="#FFFFFF" opacity="0.16" filter="url(#blurSoft)"/>

    <!-- head -->
    <g filter="url(#fuzz)">
      <circle cx="600" cy="312" r="178" fill="url(#furHead)"/>
    </g>
    <ellipse cx="527" cy="222" rx="78" ry="52" fill="#FFFFFF" opacity="0.2" filter="url(#blurSoft)"/>
  </g>

  <!-- stitching seams -->
  <g fill="none" stroke="#A9682F" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 12" opacity="0.5">
    <path d="M600 490 C 700 520 742 560 752 618"/>
    <path d="M600 490 C 500 520 458 560 448 618"/>
    <path d="M411 156 a66 66 0 0 1 122 0"/>
    <path d="M667 156 a66 66 0 0 1 122 0"/>
  </g>

  <!-- cheeks -->
  <ellipse cx="466" cy="366" rx="52" ry="34" fill="url(#cheek)"/>
  <ellipse cx="734" cy="366" rx="52" ry="34" fill="url(#cheek)"/>

  <!-- muzzle -->
  <ellipse cx="600" cy="380" rx="100" ry="76" fill="url(#muzzle)"/>
  <ellipse cx="572" cy="358" rx="44" ry="26" fill="#FFFFFF" opacity="0.45" filter="url(#blurSoft)"/>

  <!-- nose -->
  <ellipse cx="600" cy="352" rx="33" ry="25" fill="#5A3524"/>
  <ellipse cx="600" cy="350" rx="33" ry="25" fill="#6E4229"/>
  <ellipse cx="589" cy="343" rx="11" ry="7" fill="#FFFFFF" opacity="0.6"/>

  <!-- mouth -->
  <g fill="none" stroke="#5A3524" stroke-width="7" stroke-linecap="round">
    <path d="M600 377 v20"/>
    <path d="M600 397 C 597 421 566 425 551 406"/>
    <path d="M600 397 C 603 421 634 425 649 406"/>
  </g>

  <!-- eyes -->
  <g>
    <ellipse cx="524" cy="298" rx="24" ry="26" fill="url(#eyeBall)"/>
    <ellipse cx="676" cy="298" rx="24" ry="26" fill="url(#eyeBall)"/>
    <circle cx="516" cy="289" r="8.5" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="668" cy="289" r="8.5" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="531" cy="309" r="4" fill="#FFFFFF" opacity="0.55"/>
    <circle cx="683" cy="309" r="4" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- neck ribbon -->
  <g>
    <path d="M470 470 C 540 512 660 512 730 470 L 730 496 C 660 538 540 538 470 496 Z" fill="url(#ribbon)"/>
    <path d="M470 470 C 540 512 660 512 730 470" fill="none" stroke="#FFFFFF" opacity="0.25" stroke-width="5"/>
    <path d="M600 500 C 566 476 522 470 508 488 C 496 504 528 522 566 516 Z" fill="url(#ribbon)"/>
    <path d="M600 500 C 634 476 678 470 692 488 C 704 504 672 522 634 516 Z" fill="url(#ribbon)"/>
    <ellipse cx="600" cy="504" rx="22" ry="18" fill="#E87F68"/>
    <ellipse cx="594" cy="498" rx="9" ry="6" fill="#FFFFFF" opacity="0.35"/>
  </g>

  <!-- chest badge -->
  <g>
    <circle cx="600" cy="628" r="74" fill="url(#badge)" stroke="#E39A5F" stroke-width="9"/>
    <circle cx="600" cy="628" r="74" fill="none" stroke="#B9793E" stroke-width="3" stroke-dasharray="9 11" opacity="0.7"/>
    <path d="M600 596 l10.5 22.4 24.5 3.3 -17.8 17.4 4.4 24.5 -21.6 -11.7 -21.6 11.7 4.4 -24.5 -17.8 -17.4 24.5 -3.3 Z" fill="#F0A24F" stroke="#D07E2F" stroke-width="4" stroke-linejoin="round"/>
    <path d="M600 676 q-4 8 -14 12" fill="none" stroke="#D07E2F" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- soft overall highlight -->
  <ellipse cx="470" cy="252" rx="60" ry="40" fill="#FFFFFF" opacity="0.12" filter="url(#blurSoft)"/>
</svg>
