<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Michelson Interferometer</title>
  <desc>Schematic of a Michelson interferometer: laser, beam splitter, mirror A, mirror B and screen.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8edf5"/>
    </linearGradient>
    <linearGradient id="laserBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="0.5" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="silverH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#7f8c9b"/>
    </linearGradient>
    <linearGradient id="silverV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#7f8c9b"/>
    </linearGradient>

    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#e2e8f0"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#94a3b8" stroke-width="3.5"/>
    </pattern>

    <marker id="aRed" viewBox="0 0 6 6" refX="5.4" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#e11d48"/>
    </marker>
    <marker id="aAmb" viewBox="0 0 6 6" refX="5.4" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#f59e0b"/>
    </marker>
    <marker id="aVio" viewBox="0 0 6 6" refX="5.4" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#7c3aed"/>
    </marker>
    <marker id="aGry" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="aGryR" viewBox="0 0 8 8" refX="1" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#64748b"/>
    </marker>

    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="145%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>

    <clipPath id="screenClip">
      <rect x="480" y="758" width="240" height="104" rx="4"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <g stroke="#cdd7e5" stroke-width="1" opacity="0.5">
    <line x1="0" y1="450" x2="1200" y2="450" stroke-dasharray="2 12"/>
    <line x1="600" y1="0" x2="600" y2="900" stroke-dasharray="2 12"/>
  </g>

  <text x="70" y="60" font-size="27" font-weight="bold" fill="#0f172a" letter-spacing="1.5">MICHELSON INTERFEROMETER</text>
  <text x="70" y="86" font-size="14.5" fill="#64748b">Amplitude-splitting two-beam interferometer (symmetric layout)</text>
  <line x1="70" y1="98" x2="470" y2="98" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- ================= LIGHT PATHS ================= -->
  <g filter="url(#glow)" fill="none" stroke-linecap="round">

    <!-- incident beam: laser to beam splitter -->
    <g stroke="#e11d48" stroke-width="3.6">
      <line x1="264" y1="450" x2="540" y2="450" marker-end="url(#aRed)"/>
      <line x1="536" y1="450" x2="600" y2="450"/>
    </g>

    <!-- arm 1 (up, to Mirror A) : reflected at the splitter -->
    <g stroke="#e11d48" stroke-width="3.6">
      <line x1="600" y1="450" x2="600" y2="265" marker-end="url(#aRed)"/>
      <line x1="600" y1="269" x2="600" y2="175"/>
    </g>

    <!-- arm 2 (right, to Mirror B) : transmitted through the splitter -->
    <g stroke="#e11d48" stroke-width="3.6">
      <line x1="600" y1="450" x2="880" y2="450" marker-end="url(#aRed)"/>
      <line x1="876" y1="450" x2="1035" y2="450"/>
    </g>

    <!-- arm 1 return : Mirror A back to the splitter -->
    <g stroke="#f59e0b" stroke-width="3.4">
      <line x1="618" y1="175" x2="618" y2="330" marker-end="url(#aAmb)"/>
      <line x1="618" y1="326" x2="618" y2="432"/>
    </g>

    <!-- arm 2 return : Mirror B back to the splitter -->
    <g stroke="#f59e0b" stroke-width="3.4">
      <line x1="1035" y1="468" x2="790" y2="468" marker-end="url(#aAmb)"/>
      <line x1="794" y1="468" x2="582" y2="468"/>
    </g>

    <!-- recombined beams travelling down to the screen -->
    <g stroke="#7c3aed" stroke-width="3.4">
      <line x1="582" y1="468" x2="592" y2="640" marker-end="url(#aVio)"/>
      <line x1="591" y1="636" x2="598" y2="756"/>
      <line x1="618" y1="432" x2="609" y2="640" marker-end="url(#aVio)"/>
      <line x1="610" y1="636" x2="602" y2="756"/>
    </g>
  </g>

  <!-- ================= LASER ================= -->
  <g filter="url(#soft)">
    <rect x="82" y="408" width="160" height="84" rx="11" fill="url(#laserBody)" stroke="#0f172a" stroke-width="2"/>
    <rect x="242" y="438" width="22" height="24" rx="3" fill="#475569" stroke="#0f172a" stroke-width="2"/>
  </g>
  <rect x="96" y="420" width="132" height="7" rx="3.5" fill="#94a3b8" opacity="0.55"/>
  <circle cx="112" cy="478" r="5" fill="#22c55e"/>
  <text x="162" y="456" font-size="21" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="1">LASER</text>
  <text x="162" y="481" font-size="12.5" fill="#cbd5e1" text-anchor="middle">coherent source</text>
  <text x="404" y="432" font-size="14" font-weight="bold" fill="#be123c" text-anchor="middle">incident beam</text>

  <!-- ================= MIRROR A (top) ================= -->
  <g filter="url(#soft)">
    <rect x="490" y="143" width="220" height="24" fill="url(#hatch)" stroke="#475569" stroke-width="2"/>
    <rect x="490" y="167" width="220" height="8" fill="url(#silverH)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="600" y="112" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">MIRROR A</text>
  <text x="600" y="133" font-size="13" fill="#64748b" text-anchor="middle">fully reflecting (movable)</text>

  <!-- ================= MIRROR B (right) ================= -->
  <g filter="url(#soft)">
    <rect x="1043" y="340" width="24" height="220" fill="url(#hatch)" stroke="#475569" stroke-width="2"/>
    <rect x="1035" y="340" width="8" height="220" fill="url(#silverV)" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="1051" y="308" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="middle">MIRROR B</text>
  <text x="1051" y="329" font-size="13" fill="#64748b" text-anchor="middle">fully reflecting (fixed)</text>

  <!-- ================= BEAM SPLITTER ================= -->
  <g transform="rotate(-45 600 450)" filter="url(#soft)">
    <rect x="522" y="441" width="156" height="18" rx="3" fill="url(#glass)" stroke="#0369a1" stroke-width="2"/>
    <line x1="522" y1="450" x2="678" y2="450" stroke="#0ea5e9" stroke-width="1.4" stroke-dasharray="6 5" opacity="0.9"/>
  </g>
  <circle cx="600" cy="450" r="5" fill="#0369a1"/>
  <polyline points="500,548 528,548 556,512" fill="none" stroke="#0369a1" stroke-width="1.6"/>
  <text x="492" y="546" font-size="18" font-weight="bold" fill="#0369a1" text-anchor="end">BEAM SPLITTER</text>
  <text x="492" y="566" font-size="13" fill="#0284c7" text-anchor="end">half-silvered plate, 50 / 50</text>

  <!-- ================= SCREEN ================= -->
  <g filter="url(#soft)">
    <rect x="480" y="758" width="240" height="104" rx="4" fill="#1e1b4b" stroke="#0f172a" stroke-width="2"/>
  </g>
  <g clip-path="url(#screenClip)" fill="none">
    <circle cx="600" cy="810" r="126" stroke="#fde68a" stroke-width="9" opacity="0.30"/>
    <circle cx="600" cy="810" r="102" stroke="#fde68a" stroke-width="9" opacity="0.40"/>
    <circle cx="600" cy="810" r="80" stroke="#fde68a" stroke-width="9" opacity="0.52"/>
    <circle cx="600" cy="810" r="60" stroke="#fde68a" stroke-width="9" opacity="0.64"/>
    <circle cx="600" cy="810" r="42" stroke="#fde68a" stroke-width="9" opacity="0.78"/>
    <circle cx="600" cy="810" r="26" stroke="#fde68a" stroke-width="9" opacity="0.9"/>
    <circle cx="600" cy="810" r="9" fill="#fef3c7" stroke="none"/>
  </g>
  <rect x="480" y="758" width="240" height="5" fill="#a5b4fc" opacity="0.85"/>
  <text x="466" y="795" font-size="19" font-weight="bold" fill="#0f172a" text-anchor="end">SCREEN</text>
  <text x="466" y="816" font-size="13" fill="#64748b" text-anchor="end">observation plane</text>
  <text x="466" y="835" font-size="13" fill="#64748b" text-anchor="end">/ detector</text>
  <text x="600" y="884" font-size="13.5" font-weight="bold" fill="#7c3aed" text-anchor="middle">interference fringes</text>

  <!-- ================= ARM ANNOTATIONS ================= -->
  <g>
    <rect x="470" y="240" width="86" height="26" rx="13" fill="#ffffff" stroke="#e11d48" stroke-width="1.4" opacity="0.95"/>
    <text x="513" y="258" font-size="14" font-weight="bold" fill="#be123c" text-anchor="middle">ARM 1</text>
    <rect x="792" y="392" width="86" height="26" rx="13" fill="#ffffff" stroke="#e11d48" stroke-width="1.4" opacity="0.95"/>
    <text x="835" y="410" font-size="14" font-weight="bold" fill="#be123c" text-anchor="middle">ARM 2</text>
  </g>

  <!-- dimension lines -->
  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5" fill="none">
    <line x1="440" y1="175" x2="440" y2="450" marker-start="url(#aGryR)" marker-end="url(#aGry)"/>
    <line x1="428" y1="175" x2="452" y2="175" stroke-dasharray="0"/>
    <line x1="428" y1="450" x2="452" y2="450" stroke-dasharray="0"/>
    <line x1="600" y1="600" x2="1035" y2="600" marker-start="url(#aGryR)" marker-end="url(#aGry)"/>
    <line x1="600" y1="588" x2="600" y2="612" stroke-dasharray="0"/>
    <line x1="1035" y1="588" x2="1035" y2="612" stroke-dasharray="0"/>
  </g>
  <rect x="404" y="298" width="34" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="421" y="316" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">L1</text>
  <rect x="800" y="574" width="34" height="26" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="817" y="592" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">L2</text>

  <!-- ================= LEGEND ================= -->
  <rect x="70" y="636" width="352" height="186" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="0.97"/>
  <text x="92" y="666" font-size="15" font-weight="bold" fill="#0f172a" letter-spacing="0.8">LEGEND</text>
  <line x1="92" y1="676" x2="400" y2="676" stroke="#e2e8f0" stroke-width="1.5"/>

  <line x1="94" y1="702" x2="146" y2="702" stroke="#e11d48" stroke-width="3.6" marker-end="url(#aRed)"/>
  <text x="160" y="700" font-size="13.5" font-weight="bold" fill="#0f172a">Outgoing beam</text>
  <text x="160" y="716" font-size="12" fill="#64748b">laser to splitter to each mirror</text>

  <line x1="94" y1="744" x2="146" y2="744" stroke="#f59e0b" stroke-width="3.4" marker-end="url(#aAmb)"/>
  <text x="160" y="742" font-size="13.5" font-weight="bold" fill="#0f172a">Return beam</text>
  <text x="160" y="758" font-size="12" fill="#64748b">mirror back to the beam splitter</text>

  <line x1="94" y1="786" x2="146" y2="786" stroke="#7c3aed" stroke-width="3.4" marker-end="url(#aVio)"/>
  <text x="160" y="784" font-size="13.5" font-weight="bold" fill="#0f172a">Recombined beam</text>
  <text x="160" y="800" font-size="12" fill="#64748b">two waves overlap on the screen</text>

  <!-- ================= NOTE ================= -->
  <rect x="806" y="636" width="344" height="186" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" opacity="0.97"/>
  <text x="828" y="666" font-size="15" font-weight="bold" fill="#0f172a" letter-spacing="0.8">HOW IT WORKS</text>
  <line x1="828" y1="676" x2="1128" y2="676" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="828" y="700" font-size="12.5" fill="#334155">1. The splitter divides the laser beam 50 / 50.</text>
  <text x="828" y="722" font-size="12.5" fill="#334155">2. Arm 1 goes up to Mirror A, arm 2 goes right</text>
  <text x="842" y="740" font-size="12.5" fill="#334155">to Mirror B; both are reflected straight back.</text>
  <text x="828" y="762" font-size="12.5" fill="#334155">3. The splitter recombines them toward the screen.</text>
  <text x="828" y="784" font-size="12.5" fill="#334155">4. Path difference d = 2 (L1 - L2).</text>
  <text x="842" y="806" font-size="12.5" font-weight="bold" fill="#7c3aed">Bright fringe when d = m x lambda (m = 0, 1, 2 ...)</text>
</svg>
