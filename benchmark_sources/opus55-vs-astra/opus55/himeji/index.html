<!doctype html>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="loading">白鷺城 普請中…</div>
<div id="title"><h1>姫路城</h1><p>白鷺城 ジオラマ ── 連立式天守と平山城の縄張り</p></div>
<div id="ui">
  <div class="row" id="timeRow">
    <button data-t="morning">朝</button><button data-t="noon" class="on">昼</button><button data-t="evening">夕</button><button data-t="night">夜（ライトアップ）</button>
  </div>
  <div class="row">
    <button id="bSeason" class="on">桜</button><button id="bLabels" class="on">名称</button><button id="bRotate">自動回転</button><button id="bFront">正面</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V3 = THREE.Vector3;
// ---------- deterministic random ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20260923);
const R = (a,b)=>a+(b-a)*rng();

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(33, innerWidth/innerHeight, 1, 4000);
const HOME_POS = new V3(165, 120, 235), HOME_TGT = new V3(-8, 26, -28);
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME_TGT);
controls.enableDamping = true; controls.dampingFactor = .07;
controls.maxPolarAngle = 1.48; controls.minDistance = 35; controls.maxDistance = 1100;
controls.autoRotateSpeed = 0.6;

// ---------- canvas textures (all procedural) ----------
function ctex(w,h,draw,rep=[1,1]){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.repeat.set(rep[0],rep[1]);return t;
}
function noise(g,w,h,amt,base){ const d=g.getImageData(0,0,w,h); for(let i=0;i<d.data.length;i+=4){const n=(rng()-.5)*amt; d.data[i]+=n; d.data[i+1]+=n; d.data[i+2]+=n;} g.putImageData(d,0,0); }

// 本瓦葺き + 白い目地漆喰（姫路城の屋根の白い筋）: 2m x 2m / 4 columns
const tileTex = ctex(256,256,(g,w,h)=>{
  g.fillStyle='#565c63';g.fillRect(0,0,w,h);
  for(let r=0;r<4;r++){ // 平瓦の重なり
    const y=r*64; const gr=g.createLinearGradient(0,y,0,y+64); gr.addColorStop(0,'#4a5057');gr.addColorStop(1,'#646a71');
    g.fillStyle=gr;g.fillRect(0,y,w,64); g.fillStyle='rgba(20,22,26,.55)';g.fillRect(0,y,w,3);
  }
  for(let c=0;c<4;c++){ // 丸瓦
    const x=c*64+32; const gr=g.createLinearGradient(x-12,0,x+12,0);
    gr.addColorStop(0,'#3a3f45');gr.addColorStop(.45,'#7a8087');gr.addColorStop(1,'#353a40');
    g.fillStyle='#e9e7df';g.fillRect(x-16,0,32,h); // 目地漆喰
    g.fillStyle=gr;g.fillRect(x-12,0,24,h);
    for(let r=0;r<4;r++){g.fillStyle='rgba(15,16,18,.7)';g.fillRect(x-12,r*64+60,24,4);}
  }
  noise(g,w,h,14);
},[0.5,0.5]);
const plasterTex = ctex(256,256,(g,w,h)=>{g.fillStyle='#f3f1ea';g.fillRect(0,0,w,h);noise(g,w,h,9);},[0.12,0.12]);
const stoneTex = ctex(512,512,(g,w,h)=>{
  g.fillStyle='#46423c';g.fillRect(0,0,w,h);
  let y=0; while(y<h){ const rh=Math.min(h-y, R(38,78)); let x=-R(0,80);
    while(x<w){ const sw=R(55,140); const l=R(46,66), s=R(6,14), hue=R(30,45);
      const gr=g.createLinearGradient(x,y,x,y+rh); gr.addColorStop(0,`hsl(${hue},${s}%,${l+6}%)`); gr.addColorStop(1,`hsl(${hue},${s}%,${l-8}%)`);
      g.fillStyle=gr; g.beginPath(); const j=()=>R(-3,3);
      g.moveTo(x+2+j(),y+2+j()); g.lineTo(x+sw-2+j(),y+2+j()); g.lineTo(x+sw-2+j(),y+rh-2+j()); g.lineTo(x+2+j(),y+rh-2+j()); g.closePath(); g.fill();
      if(x<0){ g.save(); g.translate(w,0); g.fill(); g.restore(); }
      x+=sw; }
    y+=rh; }
  noise(g,w,h,22);
},[1/6,1/6]);
const winTex = ctex(64,64,(g,w,h)=>{g.fillStyle='#1c1a18';g.fillRect(0,0,w,h);g.fillStyle='#2e2a26';g.fillRect(5,5,54,54);
  g.fillStyle='#8a8074';for(let i=0;i<6;i++)g.fillRect(9+i*9,5,3,54);});
const dobeiTex = ctex(512,256,(g,w,h)=>{g.fillStyle='#f1eee6';g.fillRect(0,0,w,h);
  g.fillStyle='#7c7a74';g.fillRect(0,h-8,w,8);
  g.fillStyle='#26231f'; const cy=h*0.42; const shapes=['c','t','s','t'];
  shapes.forEach((s,i)=>{const cx=64+i*128; g.beginPath();
    if(s==='c'){g.arc(cx,cy,13,0,7);} else if(s==='t'){g.moveTo(cx,cy-14);g.lineTo(cx+14,cy+11);g.lineTo(cx-14,cy+11);g.closePath();} else {g.rect(cx-12,cy-12,24,24);} g.fill();});
  noise(g,w,h,8);
},[1/4,1/2.2]);
const grassTex = ctex(256,256,(g,w,h)=>{g.fillStyle='#e8e8e8';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){const v=R(170,255);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(R(0,w),R(0,h),R(1,3),R(1,4));}},[1/8,1/8]);
const gravelTex = ctex(256,256,(g,w,h)=>{g.fillStyle='#d9ccb0';g.fillRect(0,0,w,h);
  for(let i=0;i<6000;i++){const v=R(150,245);g.fillStyle=`rgb(${v},${v*0.95},${v*0.84})`;g.fillRect(R(0,w),R(0,h),R(1,2.5),R(1,2.5));}},[1/6,1/6]);
const woodTex = ctex(512,256,(g,w,h)=>{g.fillStyle='#4a2f1c';g.fillRect(0,0,w,h);
  for(let i=0;i<90;i++){const y=R(0,h),a=R(2,8),f=R(.005,.02),p=R(0,6);g.strokeStyle=`rgba(${R(20,40)},${R(10,20)},5,${R(.2,.5)})`;g.lineWidth=R(.5,2.5);g.beginPath();
    for(let x=0;x<=w;x+=8)g.lineTo(x,y+Math.sin(x*f+p)*a);g.stroke();}
  noise(g,w,h,10);},[1/40,1/12]);
const soilTex = ctex(128,512,(g,w,h)=>{
  const L=[['#4f7a36',8],['#3f2d1f',50],['#5a4230',60],['#7b6246',80],['#8e7b62',30],['#6b5a48',90],['#595049',100],['#3f3a36',94]];
  let y=h; for(const [c,t] of L){ g.fillStyle=c; g.fillRect(0,y-t,w,t); y-=t; }
  for(let i=0;i<900;i++){g.fillStyle=`rgba(${R(80,160)},${R(70,130)},${R(50,110)},.5)`;g.beginPath();g.arc(R(0,w),R(0,h-8),R(.6,2.4),0,7);g.fill();}
},[1/8,1/14]);
function nameplateTex(){ return ctex(1024,160,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#d9bf7c');gr.addColorStop(.5,'#b08d47');gr.addColorStop(1,'#8a6b31');
  g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='#5b451c';g.lineWidth=6;g.strokeRect(10,10,w-20,h-20);
  g.fillStyle='#3a2a0e';g.textAlign='center';g.font='600 62px "Hiragino Mincho ProN","Yu Mincho",serif';g.fillText('国宝 姫路城　白鷺城',w/2,82);
  g.font='26px "Hiragino Mincho ProN",serif';g.fillText('HIMEJI CASTLE ─ 連立式天守 ・ 世界文化遺産（1993） ・ 縮尺 約1/1000',w/2,128);
}); }
function skyTex(top,mid,bot){ const t=ctex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,top);gr.addColorStop(.6,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,w,h);}); t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t; }

// ---------- materials ----------
const std = o => new THREE.MeshStandardMaterial(Object.assign({envMapIntensity:.35},o));
const MAT = {
  plaster: std({map:plasterTex,color:0xf6f4ee,roughness:.88,side:THREE.DoubleSide}),
  tile:    std({map:tileTex,roughness:.6,metalness:.12,side:THREE.DoubleSide}),
  ridge:   std({color:0x4d535a,roughness:.55,metalness:.2}),
  stone:   std({map:stoneTex,roughness:.95,side:THREE.DoubleSide}),
  window:  std({map:winTex,roughness:.8,emissive:0xffb35c,emissiveIntensity:0}),
  wood:    std({color:0x3a281c,roughness:.8}),
  woodL:   std({color:0x8b6a48,roughness:.75}),
  ornament:std({color:0xb8995a,metalness:.7,roughness:.35}),
  shachi:  std({color:0x7f868d,metalness:.55,roughness:.4}),
  dobei:   std({map:dobeiTex,roughness:.9,side:THREE.DoubleSide}),
  gravel:  std({map:gravelTex,roughness:1,side:THREE.DoubleSide}),
  lawn:    std({map:grassTex,color:0x86a85a,roughness:1,side:THREE.DoubleSide}),
  soil:    std({map:soilTex,roughness:1,side:THREE.DoubleSide}),
  plinth:  std({map:woodTex,color:0xc9a27a,roughness:.45,metalness:.05,envMapIntensity:.8}),
  plinthDark: std({color:0x221710,roughness:.5}),
  pond:    new THREE.MeshPhysicalMaterial({color:0x2f5550,roughness:.08,metalness:0,clearcoat:1,envMapIntensity:1}),
};
MAT.plaster.emissive=new THREE.Color(0xdfe8ff); MAT.plaster.emissiveIntensity=0;
MAT.dobei.emissive=new THREE.Color(0xdfe8ff); MAT.dobei.emissiveIntensity=0;

// ---------- geometry batching ----------
const batches = {};
function put(key, geo, ...mats){
  if(!geo.getAttribute('normal')) geo.computeVertexNormals();
  let g = geo.index ? geo.toNonIndexed() : geo;
  for(const m of mats) if(m) g.applyMatrix4(m);
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',g.getAttribute('position'));
  out.setAttribute('normal',g.getAttribute('normal'));
  out.setAttribute('uv',g.getAttribute('uv')||new THREE.BufferAttribute(new Float32Array(g.getAttribute('position').count*2),2));
  (batches[key] ||= []).push(out);
}
function flush(){
  for(const k in batches){ const mesh=new THREE.Mesh(mergeGeometries(batches[k]),MAT[k]); mesh.castShadow=k!=='gravel'&&k!=='lawn'; mesh.receiveShadow=true; scene.add(mesh); }
}
const M = (x=0,y=0,z=0,ry=0,rx=0,rz=0,s=1)=>new THREE.Matrix4().compose(new V3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz,'YXZ')),s instanceof V3?s:new V3(s,s,s));
function mBox(w,h,d){ const g=new THREE.BoxGeometry(w,h,d); const uv=g.attributes.uv; const S=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let k=0;k<4;k++){const i=f*4+k;uv.setXY(i,uv.getX(i)*S[f][0],uv.getY(i)*S[f][1]);} return g; }
function surf(nu,nv,fn){
  const pos=[],uv=[],idx=[];
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const r=fn(i/nu,j/nv);pos.push(r[0],r[1],r[2]);uv.push(r[3],r[4]);}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();return g;
}
function beam(key,a,b,tw,th,F){ const dir=b.clone().sub(a);const len=dir.length();const g=mBox(len,th,tw);
  const q=new THREE.Quaternion().setFromUnitVectors(new V3(1,0,0),dir.normalize());
  put(key,g,new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(.5),q,new V3(1,1,1)),F); }

// ---------- polygon helpers ----------
function inPoly(x,z,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[xi,zi]=P[i],[xj,zj]=P[j];if(((zi>z)!=(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c;}return c;}
function segD(x,z,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];let t=((x-a[0])*dx+(z-a[1])*dz)/(dx*dx+dz*dz);t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-dx*t,z-a[1]-dz*t);}
function sdPoly(x,z,P){let d=1e9;for(let i=0;i<P.length;i++)d=Math.min(d,segD(x,z,P[i],P[(i+1)%P.length]));return inPoly(x,z,P)?-d:d;}
function outNormals(P){ return P.map((p,i)=>{const q=P[(i+1)%P.length];let dx=q[0]-p[0],dz=q[1]-p[1];const l=Math.hypot(dx,dz);let n=[dz/l,-dx/l];
  const mx=(p[0]+q[0])/2+n[0]*.01,mz=(p[1]+q[1])/2+n[1]*.01; if(inPoly(mx,mz,P))n=[-n[0],-n[1]]; return n;}); }
function miters(P,N){ return P.map((p,i)=>{const a=N[(i-1+P.length)%P.length],b=N[i];const s=1+a[0]*b[0]+a[1]*b[1];return[(a[0]+b[0])/s,(a[1]+b[1])/s];}); }
function insetPoly(P,d){const N=outNormals(P),Mi=miters(P,N);return P.map((p,i)=>[p[0]-Mi[i][0]*d,p[1]-Mi[i][1]*d]);}

// 石垣: 扇の勾配（下は緩く、上ほど垂直に反り上がる）
function stoneWall(P, top, bottom, batter, inward=false){
  let N=outNormals(P); if(inward) N=N.map(n=>[-n[0],-n[1]]); const Mi=miters(P,N); const H=top-bottom; let per=0;
  for(let i=0;i<P.length;i++){ const j=(i+1)%P.length; const a=P[i],b=P[j],ma=Mi[i],mb=Mi[j]; const len=Math.hypot(b[0]-a[0],b[1]-a[1]); const p0=per;
    put('stone', surf(Math.max(2,Math.ceil(len/5)),10,(u,v)=>{ const off=batter*Math.pow(1-v,2);
      const ax=a[0]+ma[0]*off, az=a[1]+ma[1]*off, bx=b[0]+mb[0]*off, bz=b[1]+mb[1]*off;
      return [ax+(bx-ax)*u, bottom+v*H, az+(bz-az)*u, p0+u*len, v*H]; }));
    // 天端の笠石
    put('stone', surf(Math.max(2,Math.ceil(len/5)),1,(u,v)=>{const x=a[0]+(b[0]-a[0])*u, z=a[1]+(b[1]-a[1])*u; const k=v*0.5;
      return [x-(ma[0]*(1-u)+mb[0]*u)*k, top+0.02, z-(ma[1]*(1-u)+mb[1]*u)*k, p0+u*len, v]; }));
    per+=len; }
}
function platformTop(P, y, key){ const s=new THREE.Shape(P.map(p=>new THREE.Vector2(p[0],-p[1]))); const g=new THREE.ShapeGeometry(s); g.rotateX(-Math.PI/2); g.translate(0,y,0); put(key,g); }

// ---------- architecture ----------
const roofShape = v => 0.42*v + 0.58*v*v; // 反り（下が緩く上が急）
function kengyo(F){ // 懸魚
  const g=new THREE.CylinderGeometry(.55,.55,.14,6); g.rotateX(Math.PI/2); put('ornament',g,F);
  const g2=new THREE.CylinderGeometry(.22,.22,.2,12); g2.rotateX(Math.PI/2); put('plaster',g2,M(0,0,.05),F);
}
function shachi(F,s){ // 鯱（姫路城は銅/瓦製の銀灰色）
  const body=new THREE.SphereGeometry(.5,10,8); put('shachi',body,M(0,.55*s,0,0,0,-.25,new V3(.42*s,1.0*s,.38*s)),F);
  const head=new THREE.SphereGeometry(.5,10,8); put('shachi',head,M(.18*s,.18*s,0,0,0,0,new V3(.42*s,.34*s,.36*s)),F);
  const tail=new THREE.ConeGeometry(.35,.7,5); put('shachi',tail,M(-.2*s,1.25*s,0,0,0,.9,new V3(s,s,s*.5)),F);
  const fin=new THREE.ConeGeometry(.18,.5,4); put('shachi',fin,M(-.05*s,.55*s,.28*s,0,.6,-.4,s),F); put('shachi',fin.clone(),M(-.05*s,.55*s,-.28*s,0,-.6,-.4,s),F);
}
// 千鳥破風（入母屋破風も同形で大きく）
function chidori(F,w,h,dpt){
  const tri=new THREE.BufferGeometry(); tri.setAttribute('position',new THREE.Float32BufferAttribute([-w/2,0,0, w/2,0,0, 0,h,0],3));
  tri.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,1,0,.5,1],2)); tri.computeVertexNormals(); put('plaster',tri,F);
  const e=.9, s=.9, k=h/(w/2), ridgeY=h+.35;
  for(const sg of [-1,1]){
    const ex=sg*(w/2+s), ey=ridgeY-k*(w/2+s); const sl=Math.hypot(ex,ridgeY-ey);
    put('tile', surf(4,6,(u,v)=>{ const z=e-(e+dpt)*u; const x=ex*v, y=ridgeY+(ey-ridgeY)*v - .22*Math.sin(Math.PI*v)*(w/8); return [x,y,z, z, v*sl]; }), F);
    const pts=[0,.5,1].map(v=>new V3(ex*v, ridgeY+(ey-ridgeY)*v-.22*Math.sin(Math.PI*v)*(w/8)-.25, e+.05));
    for(let i=0;i<2;i++) beam('plaster',pts[i],pts[i+1],.3,.6,F);
  }
  beam('ridge',new V3(0,ridgeY+.12,e+.1),new V3(0,ridgeY+.12,-dpt),.5,.45,F);
  put('ridge',mBox(.5,.9,.5),M(0,ridgeY+.3,e+.1),F);
  kengyo(new THREE.Matrix4().multiplyMatrices(F,M(0,h-.6,.12,0,0,0,Math.min(1.3,w/6))));

// 寄棟状の裳階屋根（下層）
function hipRoof(F, ow,od, iw,id, rise, lift, ww,wd, gables=[]){
  const O=[[-ow/2,-od/2],[ow/2,-od/2],[ow/2,od/2],[-ow/2,od/2]], I=[[-iw/2,-id/2],[iw/2,-id/2],[iw/2,id/2],[-iw/2,id/2]], W=[[-ww/2,-wd/2],[ww/2,-wd/2],[ww/2,wd/2],[-ww/2,wd/2]];
  for(let k=0;k<4;k++){ const k1=(k+1)%4; const ex=O[k1][0]-O[k][0], ez=O[k1][1]-O[k][1], el=Math.hypot(ex,ez), dx=ex/el, dz=ez/el;
    const run = (k%2===0)? (od-id)/2 : (ow-iw)/2; const sl=Math.hypot(run,rise);
    const P=(u,v)=>{const ox=O[k][0]+(O[k1][0]-O[k][0])*u, oz=O[k][1]+(O[k1][1]-O[k][1])*u, ix=I[k][0]+(I[k1][0]-I[k][0])*u, iz=I[k][1]+(I[k1][1]-I[k][1])*u;
      return [ox+(ix-ox)*v, rise*roofShape(v)+lift*Math.pow(Math.abs(2*u-1),4)*Math.pow(1-v,1.6), oz+(iz-oz)*v];};
    put('tile', surf(16,7,(u,v)=>{const p=P(u,v);return [p[0],p[1],p[2], p[0]*dx+p[2]*dz, v*sl];}), F);
    put('plaster', surf(16,1,(u,v)=>{const p=P(u,0);return [p[0],p[1]-.45*v,p[2], u*el, v];}), F);
    put('plaster', surf(16,1,(u,v)=>{const p=P(u,0); const wx=W[k][0]+(W[k1][0]-W[k][0])*u, wz=W[k][1]+(W[k1][1]-W[k][1])*u;
      return [p[0]+(wx-p[0])*v, (p[1]-.45)+(-.2-(p[1]-.45))*v, p[2]+(wz-p[2])*v, u*el, v];}), F);
    const pts=[0,.25,.5,.75,1].map(v=>{const p=P(0,v);return new V3(p[0],p[1]+.2,p[2]);});
    for(let s=0;s<4;s++) beam('ridge',pts[s],pts[s+1],.3,.3,F);
    put('ridge',mBox(.42,.5,.42),M(pts[0].x,pts[0].y+.08,pts[0].z),F);

  for(const g of gables){ const S=SIDE[g.side];
    if(g.type==='kara'){ const G=new THREE.Matrix4().multiplyMatrices(F,M(0,0,0,S.ry)).multiply(M(g.pos||0,-.15,S.hO+.05));
      karahafu(G,g.w,g.h,S.hO-S.hI+1.2); }
    else { const v=g.v??.3; const df=S.hO+(S.hI-S.hO)*v; const G=new THREE.Matrix4().multiplyMatrices(F,M(0,0,0,S.ry)).multiply(M(g.pos||0,rise*roofShape(v)+.02,df));
      chidori(G,g.w,g.h,df-S.hI+1.4); }
  }
}

function irimoya(F, ow,od, ww,wd, rise1, rise2, lift, gables=[], shachiOn=true){

    put('plaster', surf(12,1,(u,v)=>{const x=-(iw/2+ext)+u*(iw+2*ext); const z=sg*(id/2+.5); return [x,gy(0)-.4*v,z,x,v];}), F);
  }
  for(const sx of [-1,1]){
    const x=sx*(iw/2-.3);
    put('plaster', surf(10,1,(u,v)=>{const z=-(id/2)+u*id; const vv=1-Math.abs(z)/(id/2+.5); const yt=gy(vv)-.15; return [x, yb+(yt-yb)*v, z, z, v];}), F);

const ico=(()=>{const g=new THREE.IcosahedronGeometry(1,1);const p=g.attributes.position;const key=(x,y,z)=>`${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`;const off={};
  for(let i=0;i<p.count;i++){const k=key(p.getX(i),p.getY(i),p.getZ(i));off[k]??=1+R(-.18,.18);const s=off[k];p.setXYZ(i,p.getX(i)*s,p.getY(i)*s,p.getZ(i)*s);}g.computeVertexNormals();return g;})();

const canopyList=[], trunkList=[], cherryIdx=[];
const tmpM=new THREE.Matrix4(), tmpC=new THREE.Color();
function canopy(x,y,z,sx,sy,sz,color,isCherry=false){ canopyList.push([x,y,z,sx,sy,sz,color]); if(isCherry)cherryIdx.push(canopyList.length-1); }
function trunk(x,y,z,h,s,lean=0){ trunkList.push([x,y,z,h,s,lean]); }
const GREENS=['#3f6b34','#4c7a3a','#5a8641','#35602f','#6a8f47'], PINE=['#2c4a2a','#324f2d','#27432a'], SAKURA=['#f4c7d2','#f8d9df','#eeb7c6','#f6cfd8'];
const pick=a=>a[Math.floor(rng()*a.length)];
function broad(x,z,s,y=groundAt(x,z)){ trunk(x,y,z,2.4*s,s); canopy(x,y+3.3*s,z,2.4*s,2.1*s,2.4*s,pick(GREENS)); canopy(x+R(-1,1)*s,y+4.6*s,z+R(-1,1)*s,1.7*s,1.5*s,1.7*s,pick(GREENS)); }
function pine(x,z,s,y=groundAt(x,z)){ const l=R(-.2,.2); trunk(x,y,z,4.2*s,.8*s,l);

  tm.castShadow=true; scene.add(tm);

}
