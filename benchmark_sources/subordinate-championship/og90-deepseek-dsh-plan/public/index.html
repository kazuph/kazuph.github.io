<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a3f" />
    <title>早押しクイズ｜4人オンライン対戦</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="connection-banner" class="banner hidden" role="status">再接続中…</div>
    <div id="toast" class="toast hidden" role="alert"></div>

    <!-- 入口 -->
    <section id="screen-entry" class="screen screen-center">
      <div class="entry-card">
        <div class="logo-badge">早</div>
        <h1 class="logo">早押しクイズ</h1>
        <p class="tagline">4人でオンライン対戦・全10問</p>

        <label class="field">
          <span class="field-label">なまえ</span>
          <input
            id="name-input"
            type="text"
            maxlength="16"
            placeholder="なまえを入力"
            autocomplete="off"
          />
        </label>

        <button id="create-button" class="btn btn-primary btn-block">部屋を作る</button>

        <div class="divider"><span>または</span></div>

        <label class="field">
          <span class="field-label">部屋コード</span>
          <input
            id="code-input"
            type="text"
            maxlength="6"
            placeholder="ABC234"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            inputmode="latin"
          />
        </label>
        <button id="join-button" class="btn btn-secondary btn-block">参加する</button>

        <p id="entry-error" class="error hidden"></p>
      </div>
    </section>

    <!-- ロビー -->
    <section id="screen-lobby" class="screen screen-center hidden">
      <div class="panel">
        <div class="lobby-head">
          <div>
            <p class="section-kicker">部屋コード</p>
            <p id="room-code" class="room-code">------</p>
          </div>
          <button id="copy-button" class="btn btn-ghost">コピー</button>
        </div>

        <h2 class="section-title">参加者 <span id="lobby-count">1</span> / 4</h2>
        <ul id="lobby-players" class="player-slots"></ul>

        <p id="lobby-note" class="note"></p>
        <button id="start-button" class="btn btn-primary btn-block hidden">ゲーム開始</button>
        <button id="leave-button" class="btn btn-ghost btn-block">部屋を出る</button>
      </div>
    </section>

    <!-- ゲーム -->
    <section id="screen-game" class="screen hidden">
      <header class="game-header">
        <span id="round-label" class="round-label">第1問 / 10</span>
        <span id="timer-label" class="timer-label">20.0</span>
      </header>
      <div class="timer-track"><div id="timer-bar" class="timer-bar"></div></div>

      <div class="game-body">
        <aside class="players-area">
          <h2 class="section-title small">得点</h2>
          <ul id="game-players" class="game-players"></ul>
        </aside>

        <main class="question-area">
          <p id="question-text" class="question-text"></p>
          <div id="choices" class="choices"></div>
          <div class="buzz-area">
            <button id="buzz-button" class="buzz-button">早押し！</button>
            <p id="buzz-hint" class="buzz-hint">スペースキーでも押せます</p>
          </div>
        </main>
      </div>

      <div id="message-overlay" class="message-overlay hidden"></div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen screen-center hidden">
      <div class="panel result-panel">
        <h2 class="result-title">最終結果</h2>
        <p class="result-sub">全10問おつかれさまでした</p>
        <ol id="ranking" class="ranking"></ol>
        <button id="result-leave-button" class="btn btn-primary btn-block">部屋を出る</button>
      </div>
    </section>

    <script src="/app.js" type="module"></script>
  </body>
</html>
