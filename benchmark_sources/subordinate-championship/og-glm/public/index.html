<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>早押しクイズ</title>
	<link rel="stylesheet" href="/style.css">
</head>
<body class="entry">
	<header class="app-header">
		<div class="logo">⚡ 早押しクイズ</div>
		<div class="room-badge" id="room-badge" hidden>
			<span class="room-badge-label">部屋</span><span class="room-code" id="room-code"></span>
		</div>
	</header>

	<main>
		<!-- 名前入力・部屋作成/参加 -->
		<section id="screen-entry" class="screen visible">
			<div class="card entry-card">
				<h1>4人で対戦!<br>早押しクイズ</h1>
				<p class="lead">全10問・4択。押しが早い者が回答権を得る。</p>
				<div id="entry-error" class="error-box" hidden></div>
				<label class="field">
					<span>なまえ</span>
					<input id="name-input" name="name" maxlength="12" placeholder="ひらがな・英数字 OK" autocomplete="off">
				</label>
				<button id="btn-create" class="btn primary big">部屋を作る</button>
				<div class="divider"><span>または</span></div>
				<label class="field">
					<span>部屋コード</span>
					<input id="code-input" maxlength="4" placeholder="例: 7QK2" autocomplete="off" autocapitalize="characters">
				</label>
				<button id="btn-join" class="btn big">参加する</button>
			</div>
		</section>

		<!-- ゲーム画面 -->
		<section id="screen-game" class="screen">
			<div class="players-strip" id="players-strip"></div>

			<div id="lobby-box" class="card lobby-box">
				<h2>ロビー</h2>
				<p class="lead">この部屋の URL を共有するか、<b>部屋コード</b> を伝えて 4 人集まるのを待とう。</p>
				<p class="lead count" id="lobby-count"></p>
				<button id="btn-start" class="btn primary big" disabled>ゲーム開始</button>
				<p class="note" id="start-note"></p>
			</div>

			<div id="quiz-box" class="quiz-box" hidden>
				<div class="q-progress" id="q-progress"></div>
				<div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>

				<div class="card question-card" id="question-card">
					<p class="q-text" id="q-text"></p>
					<div class="choices" id="choices"></div>
				</div>

				<div class="buzzer-zone">
					<div id="status-line" class="status-line"></div>
					<button id="btn-buzzer" class="buzzer"><span>押す!</span></button>
				</div>
			</div>
		</section>

		<!-- 結果 -->
		<section id="screen-result" class="screen">
			<div class="card result-card">
				<h2>🏆 最終結果</h2>
				<ol id="ranking" class="ranking"></ol>
				<div class="result-actions">
					<button id="btn-again" class="btn">もう一度入力から</button>
				</div>
			</div>
		</section>
	</main>

	<div id="toast" class="toast" hidden></div>
	<script src="/app.js"></script>
</body>
</html>
