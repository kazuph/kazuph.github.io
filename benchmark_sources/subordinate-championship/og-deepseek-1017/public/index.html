<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>早押しクイズ 4人対戦</title>
    <meta name="theme-color" content="#0b1020" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  </head>
  <body>
    <div class="bg-glow"></div>
    <div id="toast" class="toast" hidden></div>
    <main class="app">
      <!-- ============ HOME ============ -->
      <section id="view-home" class="view active" data-testid="home">
        <header class="brand">
          <div class="brand-badge">⚡</div>
          <h1>早押しクイズ</h1>
          <p class="brand-sub">4人オンライン対戦・全10問</p>
        </header>

        <div class="card">
          <label class="field">
            <span>ニックネーム</span>
            <input id="name-input" data-testid="name-input" type="text" maxlength="16" placeholder="なまえを入力" autocomplete="nickname" />
          </label>

          <button id="create-btn" data-testid="create-btn" class="btn btn-primary">
            <span class="btn-ico">＋</span> 部屋を作る（ホスト）
          </button>

          <div class="divider"><span>または</span></div>

          <label class="field">
            <span>部屋コード</span>
            <input id="code-input" data-testid="code-input" type="text" maxlength="6" placeholder="例: AB12" autocapitalize="characters" autocomplete="off" />
          </label>
          <button id="join-btn" data-testid="join-btn" class="btn btn-ghost">
            部屋に参加する
          </button>
        </div>

        <p id="home-error" class="home-error" data-testid="home-error" hidden></p>
        <p class="footnote">ローカル開発用・サーバー（Durable Object）が点数と早押しを判定します</p>
      </section>

      <!-- ============ ROOM / LOBBY ============ -->
      <section id="view-room" class="view" data-testid="room">
        <header class="topbar">
          <div class="room-chip">
            <span class="room-chip-label">部屋コード</span>
            <span id="room-code" data-testid="room-code">----</span>
            <button id="copy-btn" class="mini-btn" title="コピー">コピー</button>
          </div>
          <button id="leave-btn" class="mini-btn danger">退出</button>
        </header>

        <div class="card">
          <h2 class="card-title">参加者 <span id="player-count" data-testid="player-count" class="count">0 / 4</span></h2>
          <ul id="player-list" data-testid="player-list" class="player-list"></ul>
          <p id="lobby-status" data-testid="lobby-status" class="lobby-status"></p>
          <button id="start-btn" data-testid="start-btn" class="btn btn-primary" disabled>ゲーム開始</button>
          <p id="host-hint" class="host-hint"></p>
        </div>
      </section>

      <!-- ============ GAME ============ -->
      <section id="view-game" class="view" data-testid="game">
        <header class="game-top">
          <div class="progress">
            <span id="q-index" data-testid="q-index">1</span><span class="progress-sep">/</span><span id="q-total">10</span>
            <span class="progress-label">問目</span>
          </div>
          <div id="timer-ring" class="timer-ring" data-testid="timer">
            <span id="timer-num">20</span>
          </div>
        </header>

        <ul id="scoreboard" data-testid="scoreboard" class="scoreboard"></ul>

        <div class="phase-pill" id="phase-pill" data-testid="phase">準備中</div>

        <div class="card question-card">
          <p id="question-text" data-testid="question-text" class="question-text">…</p>
          <div id="choices" data-testid="choices" class="choices"></div>
        </div>

        <div class="action-area">
          <button id="buzz-btn" data-testid="buzz-btn" class="buzz-btn" hidden>
            <span class="buzz-inner">押す！</span>
          </button>
          <p id="action-hint" data-testid="action-hint" class="action-hint"></p>
          <p id="answer-countdown" class="answer-countdown" hidden></p>
        </div>
      </section>

      <!-- ============ RESULT ============ -->
      <section id="view-result" class="view" data-testid="result">
        <header class="brand small">
          <div class="brand-badge">🏆</div>
          <h1>最終結果</h1>
        </header>
        <ol id="rank-list" data-testid="rank-list" class="rank-list"></ol>
        <button id="again-btn" data-testid="again-btn" class="btn btn-primary" hidden>もう一度あそぶ</button>
        <p id="again-hint" class="host-hint"></p>
        <button id="leave-btn-2" class="btn btn-ghost">退出する</button>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
