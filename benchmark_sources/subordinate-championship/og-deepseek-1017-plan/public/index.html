<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>早押しクイズ 4人対戦</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app">
      <!-- 入口 -->
      <section id="screen-entry" data-testid="screen-entry" class="screen screen--entry">
        <div class="card entry-card">
          <h1 class="logo">
            <span class="logo__mark">Q</span>
            早押しクイズ
          </h1>
          <p class="lead">4人までで対戦。サーバーが最初に受け取った1人だけが回答できます。</p>

          <label class="field">
            <span class="field__label">なまえ</span>
            <input id="name-input" data-testid="name-input" type="text" maxlength="12" placeholder="例: たろう" autocomplete="off" />
          </label>

          <button id="create-btn" data-testid="create-btn" class="btn btn--primary btn--block">部屋を作る</button>

          <div class="divider"><span>または</span></div>

          <label class="field">
            <span class="field__label">部屋コード</span>
            <input id="code-input" data-testid="code-input" type="text" maxlength="6" placeholder="例: ABC234" autocomplete="off" autocapitalize="characters" />
          </label>
          <button id="join-btn" data-testid="join-btn" class="btn btn--secondary btn--block">参加する</button>

          <p id="entry-error" data-testid="entry-error" class="error" role="alert"></p>
        </div>
      </section>

      <!-- ロビー -->
      <section id="screen-lobby" data-testid="screen-lobby" class="screen screen--lobby" hidden>
        <div class="card lobby-card">
          <p class="label">部屋コード</p>
          <p id="lobby-code" data-testid="lobby-code" class="room-code">------</p>
          <p class="hint">このコードを友だちに伝えよう</p>

          <h2 class="section-title">参加者 <span id="lobby-count" class="count">0</span>/4</h2>
          <ul id="lobby-players" data-testid="lobby-players" class="player-list"></ul>
          <p id="lobby-message" data-testid="lobby-message" class="message"></p>

          <button id="start-btn" data-testid="start-btn" class="btn btn--primary btn--block" hidden>ゲーム開始</button>
          <p id="lobby-wait" class="hint">ホストの開始を待っています…</p>
        </div>
      </section>

      <!-- ゲーム -->
      <section id="screen-game" data-testid="screen-game" class="screen screen--game" hidden>
        <div class="game-layout">
          <div class="game-main">
            <div class="game-header">
              <span id="q-counter" data-testid="q-counter" class="q-counter">第1問 / 10</span>
              <span id="timer-text" data-testid="timer-text" class="timer-text">20.0</span>
            </div>
            <div class="timer-bar"><div id="timer-fill" class="timer-bar__fill"></div></div>

            <div class="question-box">
              <p id="question-text" data-testid="question-text" class="question-text"></p>
            </div>

            <div id="choices" data-testid="choices" class="choices"></div>

            <div id="banner" data-testid="banner" class="banner" hidden></div>

            <div class="buzz-area">
              <button id="buzz-btn" data-testid="buzz-btn" class="buzz-btn">早押し！</button>
              <p id="buzz-hint" data-testid="buzz-hint" class="buzz-hint"></p>
            </div>
          </div>

          <aside class="players-panel">
            <h2 class="section-title">とうこう点</h2>
            <ul id="players" data-testid="players" class="players"></ul>
          </aside>
        </div>
      </section>

      <!-- 結果 -->
      <section id="screen-result" data-testid="screen-result" class="screen screen--result" hidden>
        <div class="card result-card">
          <h2 class="result-title">けっか発表</h2>
          <ol id="ranking" data-testid="ranking" class="ranking"></ol>
          <p class="hint">おつかれさまでした！</p>
        </div>
      </section>

      <div id="overlay" class="overlay" hidden>再接続中…</div>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
