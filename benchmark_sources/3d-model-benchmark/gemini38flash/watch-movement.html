<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Mechanical Watch Movement - Gemini 3.8</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e293b 0%, #020617 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f8fafc;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 22px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 320px;
        }
        .ui-panel h1 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ui-panel p {
            margin: 0 0 12px 0;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.4;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        button {
            flex: 1;
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover {
            background: #475569;
            border-color: #f59e0b;
        }
        button.active {
            background: #d97706;
            border-color: #f59e0b;
            color: #ffffff;
        }
        .legend-grid {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 11px;
            color: #cbd5e1;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="ui-panel">
        <h1>⏱️ Calibre Haute Horlogerie</h1>
        <p>手巻き機械式ムーブメント（香箱・輪列・ガンギ車・アンクル・テンプ往復振動）</p>
        <div class="btn-group">
            <button id="btn-play" class="active" onclick="togglePlay()">停止 ⏸</button>
            <button onclick="resetCam()">視点リセット</button>
        </div>
        <div class="legend-grid">
            <div class="legend-item"><div class="legend-dot" style="background:#f59e0b;"></div>香箱 (Barrel)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#fbbf24;"></div>二〜四番車 (Train)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#38bdf8;"></div>ガンギ車 (Escape)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#94a3b8;"></div>アンクル (Fork)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#eab308;"></div>テンプ (Balance)</div>
            <div class="legend-item"><div class="legend-dot" style="background:#e11d48;"></div>ルビー軸受 (Jewel)</div>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0.3, 0);

        // LIGHTING
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const mainLight = new THREE.DirectionalLight(0xffffff, 0.95);
        mainLight.position.set(4, 7, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.5);
        rimLight.position.set(-5, 4, -4);
        scene.add(rimLight);

        // MATERIALS
        const rhodiumMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.15 }); // Bridges & mainplate
        const brassMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, metalness: 0.85, roughness: 0.25 }); // Barrel & wheels
        const steelMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.95, roughness: 0.1 }); // Escape wheel & pinions
        const rubyMat = new THREE.MeshPhysicalMaterial({ color: 0xe11d48, transmission: 0.85, opacity: 1, transparent: true, roughness: 0.1 }); // Synthetic Ruby jewels
        const blueScrewMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, metalness: 0.9, roughness: 0.15 }); // Blued heat-treated screws
        const hairspringMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.3 }); // Nivarox blue hairspring

        // MOVEMENT ASSEMBLY ROOT
        const movementGroup = new THREE.Group();
        scene.add(movementGroup);

        // 1. CIRCULAR MAINPLATE (Base Plate)
        const plateGeo = new THREE.CylinderGeometry(2.6, 2.6, 0.18, 64);
        const mainplate = new THREE.Mesh(plateGeo, rhodiumMat);
        mainplate.position.y = 0.09;
        mainplate.receiveShadow = true;
        movementGroup.add(mainplate);

        // Outer Watch Casing Rim
        const caseRimGeo = new THREE.CylinderGeometry(2.75, 2.75, 0.3, 64, 1, true);
        const caseRim = new THREE.Mesh(caseRimGeo, rhodiumMat);
        caseRim.position.y = 0.25;
        movementGroup.add(caseRim);

        // HELPER TO PROCEDURALLY GENERATE TOOTHED GEAR
        function createToothedGear(radius, numTeeth, thickness = 0.06, mat = brassMat, isSpoked = true) {
            const gear = new THREE.Group();

            // Gear Rim & Center Web
            const rimGeo = new THREE.CylinderGeometry(radius * 0.96, radius * 0.96, thickness, 32);
            const rimMesh = new THREE.Mesh(rimGeo, mat);
            rimMesh.castShadow = true;
            gear.add(rimMesh);

            // Spokes cutout aesthetic
            if (isSpoked && radius > 0.4) {
                for (let s = 0; s < 4; s++) {
                    const spoke = new THREE.Mesh(new THREE.BoxGeometry(radius * 1.6, thickness * 1.05, 0.05), mat);
                    spoke.rotation.y = (s * Math.PI) / 4;
                    gear.add(spoke);
                }
            }

            // Procedural Teeth around rim
            const toothWidth = (2 * Math.PI * radius) / (numTeeth * 2.5);
            const toothDepth = radius * 0.1;
            const toothGeo = new THREE.BoxGeometry(toothDepth, thickness * 0.98, toothWidth);

            for (let i = 0; i < numTeeth; i++) {
                const angle = (i * 2 * Math.PI) / numTeeth;
                const tooth = new THREE.Mesh(toothGeo, mat);
                tooth.position.set((radius + toothDepth * 0.4) * Math.cos(angle), 0, (radius + toothDepth * 0.4) * Math.sin(angle));
                tooth.rotation.y = -angle;
                tooth.castShadow = true;
                gear.add(tooth);
            }

            // Central arbor / pinion
            const arbor = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, thickness * 2.5, 16), steelMat);
            gear.add(arbor);

            return gear;
        }

        // HELPER TO CREATE JEWEL BEARING & BLUED SCREW
        function createJewelChaton(x, y, z) {
            const chaton = new THREE.Group();
            chaton.position.set(x, y, z);
            // Gold chaton ring
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.04, 16), brassMat);
            chaton.add(ring);
            // Ruby jewel inside
            const jewel = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.05, 16), rubyMat);
            jewel.position.y = 0.01;
            chaton.add(jewel);
            return chaton;
        }

        function createBluedScrew(x, y, z) {
            const screw = new THREE.Group();
            screw.position.set(x, y, z);
            const head = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.04, 16), blueScrewMat);
            screw.add(head);
            const slot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.05, 0.02), steelMat);
            slot.position.y = 0.01;
            screw.add(slot);
            return screw;
        }

        // ==================== 2. HOROLOGICAL COMPONENTS ====================

        // A. MAINSPRING BARREL (香箱) - Pos: (-1.1, 0.28, -0.6)
        const barrelPos = new THREE.Vector3(-1.1, 0.28, -0.6);
        const barrel = createToothedGear(0.85, 36, 0.14, brassMat, false);
        barrel.position.copy(barrelPos);
        movementGroup.add(barrel);
        movementGroup.add(createJewelChaton(barrelPos.x, 0.46, barrelPos.z));

        // B. CENTER WHEEL (二番車) - Pos: (0.0, 0.32, -0.1)
        const centerPos = new THREE.Vector3(0.0, 0.32, -0.1);
        const centerWheel = createToothedGear(0.65, 30, 0.06, brassMat, true);
        centerWheel.position.copy(centerPos);
        movementGroup.add(centerWheel);
        movementGroup.add(createJewelChaton(centerPos.x, 0.46, centerPos.z));

        // C. THIRD WHEEL (三番車) - Pos: (0.8, 0.34, -0.5)
        const thirdPos = new THREE.Vector3(0.8, 0.34, -0.5);
        const thirdWheel = createToothedGear(0.55, 26, 0.05, brassMat, true);
        thirdWheel.position.copy(thirdPos);
        movementGroup.add(thirdWheel);
        movementGroup.add(createJewelChaton(thirdPos.x, 0.46, thirdPos.z));

        // D. FOURTH WHEEL (四番車 / 秒針車) - Pos: (0.6, 0.36, 0.4)
        const fourthPos = new THREE.Vector3(0.6, 0.36, 0.4);
        const fourthWheel = createToothedGear(0.5, 24, 0.05, brassMat, true);
        fourthWheel.position.copy(fourthPos);
        movementGroup.add(fourthWheel);
        movementGroup.add(createJewelChaton(fourthPos.x, 0.46, fourthPos.z));

        // E. ESCAPE WHEEL (ガンギ車 - Club teeth escapement) - Pos: (-0.1, 0.38, 0.8)
        const escapePos = new THREE.Vector3(-0.1, 0.38, 0.8);
        const escapeWheel = createToothedGear(0.35, 15, 0.04, steelMat, true);
        escapeWheel.position.copy(escapePos);
        movementGroup.add(escapeWheel);
        movementGroup.add(createJewelChaton(escapePos.x, 0.46, escapePos.z));

        // F. PALLET FORK (アンクル - Pivoting lever with ruby pallets) - Pos: (-0.65, 0.4, 0.9)
        const forkGroup = new THREE.Group();
        const forkPos = new THREE.Vector3(-0.65, 0.4, 0.9);
        forkGroup.position.copy(forkPos);

        const forkBody = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.04, 0.08), steelMat);
        forkGroup.add(forkBody);

        // Entry & Exit Ruby Pallets (Synthetic rubies)
        const rubyEntry = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.04), rubyMat);
        rubyEntry.position.set(0.18, 0, -0.08);
        rubyEntry.rotation.y = 0.4;
        forkGroup.add(rubyEntry);

        const rubyExit = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.05, 0.04), rubyMat);
        rubyExit.position.set(0.18, 0, 0.08);
        rubyExit.rotation.y = -0.4;
        forkGroup.add(rubyExit);

        const forkArbor = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.2, 12), steelMat);
        forkGroup.add(forkArbor);
        movementGroup.add(forkGroup);
        movementGroup.add(createJewelChaton(forkPos.x, 0.46, forkPos.z));

        // G. BALANCE WHEEL & HAIRSPRING (テンプとヒゲゼンマイ) - Pos: (-1.3, 0.42, 1.0)
        const balanceGroup = new THREE.Group();
        const balancePos = new THREE.Vector3(-1.3, 0.42, 1.0);
        balanceGroup.position.copy(balancePos);

        // Balance Wheel Glucydur Rim with regulating screws
        const balRim = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.035, 16, 48), brassMat);
        balRim.rotation.x = Math.PI / 2;
        balanceGroup.add(balRim);

        // Cross arms
        const balArm1 = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.03, 0.06), brassMat);
        balanceGroup.add(balArm1);

        // Regulating gold weight screws on perimeter
        for (let s = 0; s < 12; s++) {
            const ang = (s * 2 * Math.PI) / 12;
            const bScrew = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.08, 8), brassMat);
            bScrew.position.set(0.66 * Math.cos(ang), 0, 0.66 * Math.sin(ang));
            bScrew.rotation.z = Math.PI / 2;
            bScrew.rotation.y = -ang;
            balanceGroup.add(bScrew);
        }

        // Spiral Hairspring (Archimedean spiral blue spring)
        const spiralPoints = [];
        for (let t = 0; t <= 7 * Math.PI; t += 0.15) {
            const r = 0.04 + 0.015 * t;
            spiralPoints.push(new THREE.Vector3(r * Math.cos(t), 0.05, r * Math.sin(t)));
        }
        const spiralGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(spiralPoints), 128, 0.012, 6, false);
        const hairspring = new THREE.Mesh(spiralGeo, hairspringMat);
        balanceGroup.add(hairspring);

        movementGroup.add(balanceGroup);
        movementGroup.add(createJewelChaton(balancePos.x, 0.52, balancePos.z));

        // 3. BRIDGES (Ponts / Rhodium plated decorative support plates)
        // Barrel Bridge
        const barrelBridgeGeo = new THREE.CylinderGeometry(1.2, 1.2, 0.12, 32, 1, false, 0, Math.PI * 0.9);
        const barrelBridge = new THREE.Mesh(barrelBridgeGeo, rhodiumMat);
        barrelBridge.position.set(-0.8, 0.42, -0.6);
        movementGroup.add(barrelBridge);

        // Train Wheel Bridge
        const trainBridge = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.12, 1.2), rhodiumMat);
        trainBridge.position.set(0.6, 0.42, 0.0);
        movementGroup.add(trainBridge);

        // Balance Cock (Cantilever support for balance wheel)
        const cockGeo = new THREE.BoxGeometry(0.9, 0.1, 0.45);
        const balanceCock = new THREE.Mesh(cockGeo, rhodiumMat);
        balanceCock.position.set(-1.4, 0.48, 1.0);
        balanceCock.rotation.y = 0.5;
        movementGroup.add(balanceCock);

        // Decorative heat-blued screws holding bridges
        movementGroup.add(createBluedScrew(-1.6, 0.49, -0.9));
        movementGroup.add(createBluedScrew(-0.2, 0.49, -1.2));
        movementGroup.add(createBluedScrew(1.2, 0.49, -0.4));
        movementGroup.add(createBluedScrew(1.1, 0.49, 0.5));
        movementGroup.add(createBluedScrew(-1.7, 0.54, 1.1));

        // PLAY / PAUSE CONTROLS
        let isPlaying = true;
        window.togglePlay = function() {
            isPlaying = !isPlaying;
            const btn = document.getElementById('btn-play');
            btn.textContent = isPlaying ? '停止 ⏸' : '再生 ▶';
            btn.classList.toggle('active', isPlaying);
        };

        window.resetCam = function() {
            camera.position.set(0, 5.5, 4.5);
            controls.target.set(0, 0.3, 0);
        };

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                const time = clock.getElapsedTime();
                const speed = 1.6;

                // 1. Gear Train Rotations (accurately alternating mesh directions)
                barrel.rotation.y += 0.0015 * speed;       // Barrel slow clockwise
                centerWheel.rotation.y -= 0.008 * speed;   // Center wheel faster counter-clockwise
                thirdWheel.rotation.y += 0.025 * speed;    // Third wheel clockwise
                fourthWheel.rotation.y -= 0.08 * speed;    // Fourth wheel (seconds) counter-clockwise
                escapeWheel.rotation.y += 0.28 * speed;    // Escape wheel rapid ticking clockwise

                // 2. Pallet Fork Ticking Oscillation (脱進の揺れ)
                forkGroup.rotation.y = Math.sin(time * 16) * 0.18;

                // 3. Balance Wheel Harmonic Oscillation (テンプの往復振動)
                balanceGroup.rotation.y = Math.sin(time * 16) * 0.85;

                // Hairspring breathing compression/expansion
                hairspring.scale.x = 1 + Math.sin(time * 16) * 0.08;
                hairspring.scale.z = 1 + Math.sin(time * 16) * 0.08;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // RESIZE
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
