<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Espresso Machine Internal Structure - Gemini 3.6 Flash</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a24;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 45, 0.85);
            backdrop-filter: blur(8px);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { margin: 0 0 10px; font-size: 20px; color: #e2e8f0; }
        .controls { display: flex; gap: 10px; margin-top: 10px; }
        button {
            background: #3182ce;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #2b6cb0; }
        button.active { background: #dd6b20; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="ui">
        <h1>Espresso Machine Internal 3D</h1>
        <div>View Mode:</div>
        <div class="controls">
            <button id="btnNormal" class="active" onclick="setViewMode('normal')">Standard</button>
            <button id="btnCutaway" onclick="setViewMode('cutaway')">Cutaway</button>
            <button id="btnExploded" onclick="setViewMode('exploded')">Exploded</button>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x181824);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1.2, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0x90cdf4, 0.4);
        dirLight2.position.set(-5, 5, -5);
        scene.add(dirLight2);

        // Materials
        const chromeMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.1 });
        const brassMat = new THREE.MeshStandardMaterial({ color: 0xd69e2e, metalness: 0.8, roughness: 0.3 });
        const copperMat = new THREE.MeshStandardMaterial({ color: 0xdd6b20, metalness: 0.7, roughness: 0.3 });
        const tankMat = new THREE.MeshPhysicalMaterial({ color: 0x63b3ed, transparent: true, opacity: 0.4, roughness: 0.1 });
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2d3748, metalness: 0.4, roughness: 0.5 });
        const pipeMat = new THREE.MeshStandardMaterial({ color: 0x3182ce, metalness: 0.5, roughness: 0.2 });

        // Root Machine Group
        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        // Parts Registry for animation & toggling
        const parts = {};

        // Base & Frame
        const baseGeo = new THREE.BoxGeometry(2.4, 0.2, 2.4);
        parts.base = new THREE.Mesh(baseGeo, bodyMat);
        parts.base.position.set(0, 0.1, 0);
        machineGroup.add(parts.base);

        // Body Shell (Housing)
        const shellGroup = new THREE.Group();
        parts.shell = shellGroup;
        machineGroup.add(shellGroup);

        const backPanel = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.2, 0.1), bodyMat);
        backPanel.position.set(0, 1.2, -1.15);
        shellGroup.add(backPanel);

        const sideLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 2.4), bodyMat);
        sideLeft.position.set(-1.15, 1.2, 0);
        shellGroup.add(sideLeft);

        const sideRight = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 2.4), bodyMat);
        sideRight.position.set(1.15, 1.2, 0);
        shellGroup.add(sideRight);

        // Boiler (Copper Cylinder)
        const boilerGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 32);
        parts.boiler = new THREE.Mesh(boilerGeo, copperMat);
        parts.boiler.position.set(-0.3, 1.3, -0.3);
        parts.boiler.rotation.z = Math.PI / 2;
        machineGroup.add(parts.boiler);

        // Water Tank (Transparent Plastic)
        const tankGeo = new THREE.BoxGeometry(0.7, 1.4, 0.8);
        parts.waterTank = new THREE.Mesh(tankGeo, tankMat);
        parts.waterTank.position.set(0.6, 1.4, -0.6);
        machineGroup.add(parts.waterTank);

        // Group Head (E61 Style Brass/Chrome)
        const groupHeadGeo = new THREE.CylinderGeometry(0.35, 0.3, 0.5, 32);
        parts.groupHead = new THREE.Mesh(groupHeadGeo, chromeMat);
        parts.groupHead.position.set(0, 1.1, 0.6);
        machineGroup.add(parts.groupHead);

        // Portafilter
        const pfGroup = new THREE.Group();
        pfGroup.position.set(0, 0.85, 0.6);
        parts.portafilter = pfGroup;
        machineGroup.add(pfGroup);

        const pfBasket = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.25, 0.3, 32), brassMat);
        pfGroup.add(pfBasket);

        const pfHandle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 0.9, 16), bodyMat);
        pfHandle.position.set(0, -0.05, 0.5);
        pfHandle.rotation.x = Math.PI / 2;
        pfGroup.add(pfHandle);

        // Piping Route (From Tank -> Boiler -> Group Head)
        const pipePoints = [
            new THREE.Vector3(0.6, 0.8, -0.6),
            new THREE.Vector3(0.6, 0.8, -0.3),
            new THREE.Vector3(-0.3, 0.8, -0.3),
            new THREE.Vector3(-0.3, 1.3, -0.3),
            new THREE.Vector3(0, 1.3, 0.6),
            new THREE.Vector3(0, 1.1, 0.6)
        ];
        const pipeGeo = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pipePoints), 64, 0.04, 8, false);
        parts.piping = new THREE.Mesh(pipeGeo, pipeMat);
        machineGroup.add(parts.piping);

        // View Modes State
        let currentMode = 'normal';

        window.setViewMode = function(mode) {
            currentMode = mode;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            if (mode === 'normal') document.getElementById('btnNormal').classList.add('active');
            if (mode === 'cutaway') document.getElementById('btnCutaway').classList.add('active');
            if (mode === 'exploded') document.getElementById('btnExploded').classList.add('active');
        };

        // Animation Loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // Smooth Interpolation for View Modes
            if (currentMode === 'normal') {
                parts.shell.visible = true;
                parts.shell.position.lerp(new THREE.Vector3(0, 0, 0), 0.1);
                parts.boiler.position.lerp(new THREE.Vector3(-0.3, 1.3, -0.3), 0.1);
                parts.waterTank.position.lerp(new THREE.Vector3(0.6, 1.4, -0.6), 0.1);
                parts.groupHead.position.lerp(new THREE.Vector3(0, 1.1, 0.6), 0.1);
                parts.portafilter.position.lerp(new THREE.Vector3(0, 0.85, 0.6), 0.1);
            } else if (currentMode === 'cutaway') {
                parts.shell.visible = false;
                parts.boiler.position.lerp(new THREE.Vector3(-0.3, 1.3, -0.3), 0.1);
                parts.waterTank.position.lerp(new THREE.Vector3(0.6, 1.4, -0.6), 0.1);
                parts.groupHead.position.lerp(new THREE.Vector3(0, 1.1, 0.6), 0.1);
                parts.portafilter.position.lerp(new THREE.Vector3(0, 0.85, 0.6), 0.1);
            } else if (currentMode === 'exploded') {
                parts.shell.visible = true;
                parts.shell.position.lerp(new THREE.Vector3(0, 1.5, -1.2), 0.1);
                parts.boiler.position.lerp(new THREE.Vector3(-1.2, 1.8, -0.3), 0.1);
                parts.waterTank.position.lerp(new THREE.Vector3(1.4, 1.8, -0.6), 0.1);
                parts.groupHead.position.lerp(new THREE.Vector3(0, 1.8, 1.2), 0.1);
                parts.portafilter.position.lerp(new THREE.Vector3(0, 0.4, 1.4), 0.1);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
