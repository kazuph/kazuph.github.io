<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Title -->
  <text x="600" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">RAG Pipeline Architecture</text>
  <text x="600" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Retrieval-Augmented Generation: Offline Indexing + Online Inference</text>

  <!-- Offline zone -->
  <rect x="40" y="110" width="1120" height="250" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="60" y="138" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#b45309">OFFLINE / INDEXING (Document Ingestion)</text>

  <!-- Offline boxes -->
  <g filter="url(#shadow)">
    <rect x="80" y="170" width="180" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="170" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#92400e">Source Docs</text>
    <text x="170" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78716c">PDF / HTML / MD</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="170" width="180" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="430" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#92400e">Chunk + Embed</text>
    <text x="430" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78716c">split / embed model</text>
    <text x="430" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78716c">vectorize chunks</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="170" width="200" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <text x="700" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Vector DB</text>
    <text x="700" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78716c">embeddings store</text>
    <text x="700" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78716c">ANN index</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="170" width="200" height="120" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="1000" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#92400e">Metadata / Index</text>
    <text x="1000" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#78716c">ids, source, tags</text>
  </g>

  <!-- Offline arrows -->
  <line x1="260" y1="230" x2="330" y2="230" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <line x1="520" y1="230" x2="590" y2="230" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <line x1="800" y1="230" x2="890" y2="230" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="295" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309">ingest</text>
  <text x="555" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309">upsert</text>
  <text x="845" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#b45309">link</text>

  <!-- Online zone -->
  <rect x="40" y="390" width="1120" height="450" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="60" y="418" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">ONLINE / QUERY (Inference Path)</text>

  <!-- Online boxes row 1 -->
  <g filter="url(#shadow)">
    <rect x="80" y="460" width="160" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="505" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">User Query</text>
    <text x="160" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">natural language</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="320" y="460" width="200" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Embed / Retrieve</text>
    <text x="420" y="525" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">query embed + top-k</text>
  </g>

  <!-- Vector DB shared (online access) -->
  <g filter="url(#shadow)">
    <rect x="600" y="450" width="200" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="700" y="495" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Vector DB</text>
    <text x="700" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">similarity search</text>
    <text x="700" y="540" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">(same store)</text>
  </g>

  <!-- Bridge from offline Vector DB to online -->
  <line x1="700" y1="290" x2="700" y2="440" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="720" y="370" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">shared index</text>

  <!-- Online arrows row 1 -->
  <line x1="240" y1="510" x2="310" y2="510" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="520" y1="510" x2="590" y2="510" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="275" y="495" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8">embed</text>
  <text x="555" y="495" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8">query</text>

  <!-- Retrieved Context -->
  <g filter="url(#shadow)">
    <rect x="320" y="620" width="200" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="660" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Retrieved Context</text>
    <text x="420" y="685" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">top-k passages</text>
  </g>

  <!-- Arrow from Vector DB down to Retrieved Context -->
  <path d="M 700 570 L 700 670 L 530 670" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="720" y="630" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8">retrieve</text>

  <!-- LLM -->
  <g filter="url(#shadow)">
    <rect x="600" y="620" width="200" height="100" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="700" y="660" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">LLM</text>
    <text x="700" y="685" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">prompt + context</text>
  </g>

  <!-- Answer -->
  <g filter="url(#shadow)">
    <rect x="900" y="620" width="180" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="990" y="660" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#166534">Answer</text>
    <text x="990" y="685" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">grounded response</text>
  </g>

  <!-- Query also to LLM (prompt assembly) -->
  <path d="M 160 560 L 160 740 L 600 740 L 600 720" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="280" y="730" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">original query</text>

  <!-- Context to LLM -->
  <line x1="520" y1="670" x2="590" y2="670" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="555" y="655" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1d4ed8">augment</text>

  <!-- LLM to Answer -->
  <line x1="800" y1="670" x2="890" y2="670" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="845" y="655" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#166534">generate</text>

  <!-- Legend -->
  <rect x="80" y="790" width="500" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="100" y="800" width="18" height="14" rx="3" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="128" y="812" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Offline indexing</text>
  <rect x="260" y="800" width="18" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="288" y="812" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Online query</text>
  <line x1="390" y1="807" x2="420" y2="807" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="430" y="812" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">data flow</text>
</svg>
