<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f7f7fa"/>
  <text x="600" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Kalman Filter Block Diagram</text>

  <rect x="80" y="120" width="280" height="150" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="220" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Prediction</text>
  <text x="220" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">xhat(k|k-1) = F xhat(k-1)</text>
  <text x="220" y="225" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">P(k|k-1) = F P F^T + Q</text>

  <rect x="460" y="125" width="260" height="140" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
  <text x="590" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#b45309">Measurement</text>
  <text x="590" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">z_k = H x_k + v_k</text>

  <circle cx="590" cy="390" r="28" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="590" y="397" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#15803d">-</text>

  <rect x="780" y="330" width="260" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="910" y="375" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">Residual</text>
  <text x="910" y="410" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">y_k = z_k - H xhat</text>

  <rect x="780" y="540" width="260" height="120" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="910" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#6d28d9">Kalman gain</text>
  <text x="910" y="620" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">K_k = P H^T S^{-1}</text>

  <rect x="450" y="540" width="270" height="130" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="585" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Update</text>
  <text x="585" y="615" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">xhat = xhat + K y</text>
  <text x="585" y="640" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">P = (I - K H) P</text>

  <rect x="90" y="540" width="260" height="130" rx="14" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
  <text x="220" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f766e">State estimate</text>
  <text x="220" y="625" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">xhat(k|k), P(k|k)</text>

  <rect x="145" y="760" width="150" height="70" rx="12" fill="#e5e7eb" stroke="#374151" stroke-width="2.2"/>
  <text x="220" y="805" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#374151">z^{-1}</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="220" y1="540" x2="220" y2="270" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="120" y="390" width="70" height="22" rx="6" fill="white"/>
  <text x="155" y="406" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">prior</text>

  <path d="M360 195 L560 195 L560 362" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="380" y="168" width="90" height="22" rx="6" fill="white"/>
  <text x="425" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">xhat pred</text>

  <line x1="590" y1="265" x2="590" y2="362" stroke="#b45309" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="618" y1="390" x2="780" y2="390" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="910" y1="450" x2="910" y2="540" stroke="#15803d" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="780" y1="600" x2="720" y2="600" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#arrow)"/>

  <path d="M360 240 L420 240 L420 540 L450 580" fill="none" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="340" y="470" width="80" height="22" rx="6" fill="white"/>
  <text x="380" y="486" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">predicted</text>

  <line x1="450" y1="605" x2="350" y2="605" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="220" y1="670" x2="220" y2="760" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>

  <path d="M295 795 L390 795 L390 195 L360 195" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#arrow)"/>
  <rect x="405" y="500" width="75" height="22" rx="6" fill="white"/>
  <text x="442" y="516" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2937">feedback</text>

  <text x="1040" y="120" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">Legend</text>
  <text x="1040" y="145" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Prediction -&gt; prior</text>
  <text x="1040" y="165" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Update -&gt; posterior</text>
  <text x="1040" y="185" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280">Residual -&gt; innovation</text>
</svg>
