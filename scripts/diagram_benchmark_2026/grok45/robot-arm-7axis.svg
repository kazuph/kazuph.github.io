<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68d391"/>
      <stop offset="50%" stop-color="#48bb78"/>
      <stop offset="100%" stop-color="#2f855a"/>
    </linearGradient>
    <linearGradient id="linkGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63b3ed"/>
      <stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#a0aec0"/>
    </linearGradient>
    <linearGradient id="eeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6ad55"/>
      <stop offset="100%" stop-color="#dd6b20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e53e3e"/>
    </marker>
    <marker id="arrowHeadBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3182ce"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#1a202c"/>
  <rect x="40" y="40" width="1120" height="820" rx="12" fill="#2d3748" stroke="#4a5568" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#e2e8f0">7-Axis Robot Arm</text>
  <text x="600" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#a0aec0">Joint layout with rotation axes (J1&#8211;J7)</text>

  <!-- Floor / base plate (perspective) -->
  <ellipse cx="420" cy="780" rx="160" ry="28" fill="#1a202c" opacity="0.5"/>
  <g filter="url(#shadow)">
    <!-- Base pedestal -->
    <path d="M340,760 L340,700 L500,700 L500,760 Z" fill="url(#baseGrad)" stroke="#718096" stroke-width="1.5"/>
    <ellipse cx="420" cy="700" rx="80" ry="18" fill="#4a5568" stroke="#718096" stroke-width="1.5"/>
    <ellipse cx="420" cy="760" rx="80" ry="18" fill="#2d3748" stroke="#718096" stroke-width="1.5"/>
    <!-- Base top disk -->
    <ellipse cx="420" cy="695" rx="55" ry="14" fill="#718096" stroke="#a0aec0" stroke-width="1"/>
  </g>

  <!-- ===== ARM STRUCTURE (isometric-ish) ===== -->

  <!-- Link 0: vertical column from base to J1/J2 shoulder -->
  <g filter="url(#shadow)">
    <!-- Column -->
    <path d="M400,695 L400,560 L440,560 L440,695 Z" fill="url(#baseGrad)" stroke="#a0aec0" stroke-width="1.5"/>
    <ellipse cx="420" cy="560" rx="20" ry="8" fill="#718096"/>
  </g>

  <!-- J1 joint (base yaw - vertical axis) -->
  <g>
    <ellipse cx="420" cy="680" rx="32" ry="12" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <ellipse cx="420" cy="676" rx="28" ry="10" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1"/>
    <!-- Rotation arrow J1 (around vertical Z) -->
    <path d="M455,678 A38,14 0 0,1 385,678" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
    <path d="M385,678 A38,14 0 0,1 430,668" fill="none" stroke="#e53e3e" stroke-width="2"/>
  </g>

  <!-- J2 joint (shoulder pitch) -->
  <g>
    <circle cx="420" cy="555" r="22" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <circle cx="420" cy="555" r="12" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <!-- Rotation arrow J2 (pitch around horizontal) -->
    <path d="M448,540 A26,26 0 0,1 448,570" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
    <line x1="400" y1="555" x2="390" y2="555" stroke="#3182ce" stroke-width="2" stroke-dasharray="3,2"/>
  </g>

  <!-- Link 1: upper arm (J2 to J3) - going up-right -->
  <g filter="url(#shadow)">
    <path d="M405,540 L530,420 L555,435 L430,555 Z" fill="url(#linkGrad)" stroke="#276749" stroke-width="1.5"/>
    <!-- side face for 3D -->
    <path d="M555,435 L565,445 L440,565 L430,555 Z" fill="#276749" stroke="#22543d" stroke-width="1"/>
  </g>

  <!-- J3 joint (elbow / upper arm roll or pitch) -->
  <g>
    <circle cx="548" cy="430" r="20" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <circle cx="548" cy="430" r="10" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <!-- Rotation arrow J3 -->
    <path d="M575,415 A24,24 0 0,1 575,445" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
  </g>

  <!-- Link 2: forearm (J3 to J4) - going right-up -->
  <g filter="url(#shadow)">
    <path d="M535,415 L680,340 L700,358 L555,433 Z" fill="url(#linkGrad2)" stroke="#2b6cb0" stroke-width="1.5"/>
    <path d="M700,358 L710,368 L565,443 L555,433 Z" fill="#2c5282" stroke="#2a4365" stroke-width="1"/>
  </g>

  <!-- J4 joint (forearm roll) -->
  <g>
    <circle cx="695" cy="350" r="18" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <circle cx="695" cy="350" r="9" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <!-- Rotation arrow J4 (roll along link axis) -->
    <path d="M720,335 A22,22 0 0,1 720,365" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
    <line x1="675" y1="340" x2="715" y2="360" stroke="#3182ce" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Link 3: wrist link (J4 to J5) -->
  <g filter="url(#shadow)">
    <path d="M685,338 L800,290 L815,308 L700,356 Z" fill="url(#linkGrad)" stroke="#276749" stroke-width="1.5"/>
    <path d="M815,308 L822,316 L707,364 L700,356 Z" fill="#276749" stroke="#22543d" stroke-width="1"/>
  </g>

  <!-- J5 joint (wrist pitch) -->
  <g>
    <circle cx="810" cy="300" r="16" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <circle cx="810" cy="300" r="8" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <!-- Rotation arrow J5 -->
    <path d="M832,285 A20,20 0 0,1 832,315" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
  </g>

  <!-- Link 4: short wrist (J5 to J6) -->
  <g filter="url(#shadow)">
    <path d="M800,290 L880,255 L892,270 L812,305 Z" fill="url(#linkGrad2)" stroke="#2b6cb0" stroke-width="1.5"/>
    <path d="M892,270 L898,278 L818,313 L812,305 Z" fill="#2c5282" stroke="#2a4365" stroke-width="1"/>
  </g>

  <!-- J6 joint (wrist yaw / 6th) -->
  <g>
    <circle cx="890" cy="262" r="14" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <circle cx="890" cy="262" r="7" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <!-- Rotation arrow J6 -->
    <path d="M910,248 A18,18 0 0,1 910,276" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
  </g>

  <!-- Link 5: flange to J7 -->
  <g filter="url(#shadow)">
    <path d="M882,255 L950,230 L958,242 L890,267 Z" fill="#718096" stroke="#a0aec0" stroke-width="1.5"/>
  </g>

  <!-- J7 joint (tool flange rotation / 7th axis) -->
  <g>
    <circle cx="955" cy="236" r="13" fill="url(#jointGrad)" stroke="#cbd5e0" stroke-width="2"/>
    <circle cx="955" cy="236" r="6" fill="#4a5568" stroke="#718096" stroke-width="1"/>
    <!-- Rotation arrow J7 -->
    <path d="M975,222 A16,16 0 0,1 975,250" fill="none" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
  </g>

  <!-- End effector (gripper) -->
  <g filter="url(#shadow)">
    <rect x="965" y="220" width="40" height="32" rx="3" fill="url(#eeGrad)" stroke="#c05621" stroke-width="1.5" transform="rotate(-18 985 236)"/>
    <!-- Gripper fingers -->
    <path d="M1000,218 L1025,205 L1030,212 L1005,225 Z" fill="#dd6b20" stroke="#c05621" stroke-width="1"/>
    <path d="M1000,250 L1025,265 L1030,258 L1005,243 Z" fill="#dd6b20" stroke="#c05621" stroke-width="1"/>
  </g>

  <!-- ===== LABELS ===== -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold">
    <!-- J1 -->
    <rect x="250" y="655" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="268" y="672" text-anchor="middle" fill="#fff">J1</text>
    <line x1="286" y1="667" x2="385" y2="675" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="268" y="695" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">base yaw</text>

    <!-- J2 -->
    <rect x="250" y="520" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="268" y="537" text-anchor="middle" fill="#fff">J2</text>
    <line x1="286" y1="532" x2="398" y2="550" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="268" y="555" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">shoulder</text>

    <!-- J3 -->
    <rect x="500" y="370" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="518" y="387" text-anchor="middle" fill="#fff">J3</text>
    <line x1="518" y1="394" x2="540" y2="415" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="518" y="360" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">elbow</text>

    <!-- J4 -->
    <rect x="640" y="285" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="658" y="302" text-anchor="middle" fill="#fff">J4</text>
    <line x1="676" y1="305" x2="688" y2="340" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="658" y="275" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">forearm</text>

    <!-- J5 -->
    <rect x="760" y="240" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="778" y="257" text-anchor="middle" fill="#fff">J5</text>
    <line x1="796" y1="260" x2="800" y2="290" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="778" y="230" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">wrist pitch</text>

    <!-- J6 -->
    <rect x="850" y="195" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="868" y="212" text-anchor="middle" fill="#fff">J6</text>
    <line x1="886" y1="215" x2="888" y2="250" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="868" y="185" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">wrist yaw</text>

    <!-- J7 -->
    <rect x="920" y="165" width="36" height="24" rx="4" fill="#e53e3e"/>
    <text x="938" y="182" text-anchor="middle" fill="#fff">J7</text>
    <line x1="945" y1="189" x2="952" y2="225" stroke="#e53e3e" stroke-width="1.5"/>
    <text x="938" y="155" text-anchor="middle" font-size="11" font-weight="normal" fill="#a0aec0">flange</text>
  </g>

  <!-- Structure labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e0">
    <text x="420" y="820" text-anchor="middle" font-weight="bold">BASE</text>
    <text x="480" y="500" text-anchor="middle" fill="#68d391">Upper Arm</text>
    <text x="630" y="380" text-anchor="middle" fill="#63b3ed">Forearm</text>
    <text x="1045" y="235" fill="#f6ad55" font-weight="bold">End Effector</text>
  </g>

  <!-- Legend panel -->
  <g transform="translate(820, 520)">
    <rect x="0" y="0" width="300" height="300" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="1.5"/>
    <text x="150" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">Axis Reference</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e0">
      <circle cx="24" cy="58" r="6" fill="#e53e3e"/>
      <text x="40" y="62">J1 &#8212; Base rotation (yaw)</text>
      <circle cx="24" cy="86" r="6" fill="#e53e3e"/>
      <text x="40" y="90">J2 &#8212; Shoulder pitch</text>
      <circle cx="24" cy="114" r="6" fill="#e53e3e"/>
      <text x="40" y="118">J3 &#8212; Elbow pitch / roll</text>
      <circle cx="24" cy="142" r="6" fill="#e53e3e"/>
      <text x="40" y="146">J4 &#8212; Forearm roll</text>
      <circle cx="24" cy="170" r="6" fill="#e53e3e"/>
      <text x="40" y="174">J5 &#8212; Wrist pitch</text>
      <circle cx="24" cy="198" r="6" fill="#e53e3e"/>
      <text x="40" y="202">J6 &#8212; Wrist yaw</text>
      <circle cx="24" cy="226" r="6" fill="#e53e3e"/>
      <text x="40" y="230">J7 &#8212; Tool flange rotation</text>
      <line x1="20" y1="250" x2="50" y2="250" stroke="#e53e3e" stroke-width="2" marker-end="url(#arrowHead)"/>
      <text x="60" y="254">Rotation direction</text>
      <rect x="18" y="268" width="20" height="12" rx="2" fill="url(#eeGrad)"/>
      <text x="48" y="278">Gripper / end effector</text>
    </g>
  </g>

  <!-- Chain schematic (bottom-left) -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="320" height="300" rx="8" fill="#1a202c" stroke="#4a5568" stroke-width="1.5"/>
    <text x="160" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#e2e8f0">Kinematic Chain</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#a0aec0">
      <!-- Chain boxes -->
      <rect x="20" y="50" width="50" height="28" rx="4" fill="#4a5568" stroke="#718096"/>
      <text x="45" y="68" text-anchor="middle" fill="#e2e8f0" font-weight="bold">Base</text>
      <line x1="70" y1="64" x2="90" y2="64" stroke="#718096" stroke-width="2"/>
      <polygon points="90,64 84,60 84,68" fill="#718096"/>

      <rect x="90" y="50" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="108" y="68" text-anchor="middle" fill="#fff" font-weight="bold">J1</text>
      <line x1="126" y1="64" x2="146" y2="64" stroke="#718096" stroke-width="2"/>

      <rect x="146" y="50" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="164" y="68" text-anchor="middle" fill="#fff" font-weight="bold">J2</text>
      <line x1="182" y1="64" x2="202" y2="64" stroke="#718096" stroke-width="2"/>

      <rect x="202" y="50" width="50" height="28" rx="4" fill="#48bb78"/>
      <text x="227" y="68" text-anchor="middle" fill="#fff" font-size="10">Link1</text>

      <rect x="90" y="100" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="108" y="118" text-anchor="middle" fill="#fff" font-weight="bold">J3</text>
      <line x1="227" y1="78" x2="227" y2="100" stroke="#718096" stroke-width="2"/>
      <line x1="227" y1="100" x2="126" y2="114" stroke="#718096" stroke-width="2"/>

      <rect x="146" y="100" width="50" height="28" rx="4" fill="#3182ce"/>
      <text x="171" y="118" text-anchor="middle" fill="#fff" font-size="10">Link2</text>
      <line x1="126" y1="114" x2="146" y2="114" stroke="#718096" stroke-width="2"/>

      <rect x="216" y="100" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="234" y="118" text-anchor="middle" fill="#fff" font-weight="bold">J4</text>
      <line x1="196" y1="114" x2="216" y2="114" stroke="#718096" stroke-width="2"/>

      <rect x="90" y="150" width="50" height="28" rx="4" fill="#48bb78"/>
      <text x="115" y="168" text-anchor="middle" fill="#fff" font-size="10">Link3</text>
      <line x1="234" y1="128" x2="234" y2="150" stroke="#718096" stroke-width="2"/>
      <line x1="234" y1="150" x2="140" y2="164" stroke="#718096" stroke-width="2"/>

      <rect x="160" y="150" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="178" y="168" text-anchor="middle" fill="#fff" font-weight="bold">J5</text>
      <line x1="140" y1="164" x2="160" y2="164" stroke="#718096" stroke-width="2"/>

      <rect x="216" y="150" width="50" height="28" rx="4" fill="#3182ce"/>
      <text x="241" y="168" text-anchor="middle" fill="#fff" font-size="10">Link4</text>
      <line x1="196" y1="164" x2="216" y2="164" stroke="#718096" stroke-width="2"/>

      <rect x="90" y="200" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="108" y="218" text-anchor="middle" fill="#fff" font-weight="bold">J6</text>
      <line x1="241" y1="178" x2="241" y2="200" stroke="#718096" stroke-width="2"/>
      <line x1="241" y1="200" x2="126" y2="214" stroke="#718096" stroke-width="2"/>

      <rect x="146" y="200" width="36" height="28" rx="4" fill="#e53e3e"/>
      <text x="164" y="218" text-anchor="middle" fill="#fff" font-weight="bold">J7</text>
      <line x1="126" y1="214" x2="146" y2="214" stroke="#718096" stroke-width="2"/>

      <rect x="202" y="200" width="60" height="28" rx="4" fill="#dd6b20"/>
      <text x="232" y="218" text-anchor="middle" fill="#fff" font-size="10">Tool EE</text>
      <line x1="182" y1="214" x2="202" y2="214" stroke="#718096" stroke-width="2"/>

      <text x="160" y="260" text-anchor="middle" fill="#718096">Base &#8594; J1..J7 &#8594; End Effector</text>
      <text x="160" y="280" text-anchor="middle" fill="#4a5568" font-size="10">7 DOF serial manipulator</text>
    </g>
  </g>
</svg>
