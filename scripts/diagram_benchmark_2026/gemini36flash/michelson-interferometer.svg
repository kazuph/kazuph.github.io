<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <marker id="laserArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#E53E3E"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#F7FAFC"/>

  <g transform="translate(600, 450)">
    <!-- 1. Laser Source (Left) -->
    <rect x="-480" y="-60" width="160" height="120" fill="#2D3748" stroke="#000000" stroke-width="4" rx="8"/>
    <text x="-400" y="10" font-family="sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LASER</text>
    <rect x="-320" y="-20" width="20" height="40" fill="#E53E3E" stroke="#000000" stroke-width="2"/>

    <!-- 2. Beam Splitter (Center, 45 deg) -->
    <g transform="rotate(45)">
      <rect x="-15" y="-120" width="30" height="240" fill="#E2E8F0" stroke="#000000" stroke-width="4" opacity="0.8"/>
      <!-- Semi reflective coating line -->
      <line x1="0" y1="-120" x2="0" y2="120" stroke="#3182CE" stroke-width="5"/>
    </g>
    <text x="30" y="40" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1A202C">Beam Splitter</text>

    <!-- 3. Mirror A (Fixed, Top) -->
    <rect x="-100" y="-370" width="200" height="30" fill="#A0AEC0" stroke="#000000" stroke-width="4"/>
    <rect x="-100" y="-340" width="200" height="15" fill="#E2E8F0" stroke="#000000" stroke-width="2"/>
    <text x="0" y="-395" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1A202C" text-anchor="middle">Mirror A (Fixed)</text>

    <!-- 4. Mirror B (Movable, Right) -->
    <rect x="340" y="-100" width="30" height="200" fill="#A0AEC0" stroke="#000000" stroke-width="4"/>
    <rect x="325" y="-100" width="15" height="200" fill="#E2E8F0" stroke="#000000" stroke-width="2"/>
    <text x="400" y="10" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1A202C" text-anchor="middle" transform="rotate(-90 400 10)">Mirror B (Movable)</text>

    <!-- 5. Screen (Bottom) -->
    <rect x="-140" y="340" width="280" height="30" fill="#2D3748" stroke="#000000" stroke-width="4"/>
    <text x="0" y="410" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1A202C" text-anchor="middle">Interference Screen</text>

    <!-- Interference Fringes on Screen -->
    <g transform="translate(0, 340)">
      <rect x="-110" y="5" width="20" height="20" fill="#E53E3E"/>
      <rect x="-70" y="5" width="20" height="20" fill="#E53E3E"/>
      <rect x="-30" y="5" width="20" height="20" fill="#E53E3E"/>
      <rect x="10" y="5" width="20" height="20" fill="#E53E3E"/>
      <rect x="50" y="5" width="20" height="20" fill="#E53E3E"/>
      <rect x="90" y="5" width="20" height="20" fill="#E53E3E"/>
    </g>

    <!-- Laser Beams -->
    <!-- Incident Beam -->
    <line x1="-300" y1="0" x2="-20" y2="0" stroke="#E53E3E" stroke-width="6" marker-end="url(#laserArr)"/>
    <line x1="-20" y1="0" x2="0" y2="0" stroke="#E53E3E" stroke-width="6"/>

    <!-- Beam 1: Up to Mirror A & Return -->
    <line x1="0" y1="0" x2="0" y2="-200" stroke="#E53E3E" stroke-width="5" marker-end="url(#laserArr)"/>
    <line x1="0" y1="-200" x2="0" y2="-325" stroke="#E53E3E" stroke-width="5"/>

    <line x1="8" y1="-325" x2="8" y2="-150" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6,6" marker-end="url(#laserArr)"/>
    <line x1="8" y1="-150" x2="8" y2="0" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6,6"/>

    <!-- Beam 2: Right to Mirror B & Return -->
    <line x1="0" y1="0" x2="200" y2="0" stroke="#E53E3E" stroke-width="5" marker-end="url(#laserArr)"/>
    <line x1="200" y1="0" x2="325" y2="0" stroke="#E53E3E" stroke-width="5"/>

    <line x1="325" y1="-8" x2="150" y2="-8" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6,6" marker-end="url(#laserArr)"/>
    <line x1="150" y1="-8" x2="0" y2="-8" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6,6"/>

    <!-- Recombined Beam to Screen -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#E53E3E" stroke-width="6" marker-end="url(#laserArr)"/>
    <line x1="0" y1="200" x2="0" y2="340" stroke="#E53E3E" stroke-width="6"/>

    <!-- Distance Labels -->
    <line x1="-140" y1="0" x2="-140" y2="-325" stroke="#718096" stroke-width="2.5"/>
    <text x="-165" y="-160" font-family="sans-serif" font-size="28" font-weight="bold" fill="#4A5568" text-anchor="end">d₁</text>

    <line x1="0" y1="-140" x2="325" y2="-140" stroke="#718096" stroke-width="2.5"/>
    <text x="160" y="-165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#4A5568" text-anchor="middle">d₂</text>

  </g>
</svg>
