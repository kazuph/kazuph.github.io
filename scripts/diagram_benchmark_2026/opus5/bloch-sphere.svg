<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <title>Bloch Sphere</title>
  <desc>Orthographic 2D projection of the Bloch sphere showing the x, y and z axes, a qubit state vector |psi&gt;, and the polar angle theta and azimuthal angle phi.</desc>

  <defs>
    <radialGradient id="ballShade" cx="35%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#eaf2fb"/>
      <stop offset="100%" stop-color="#c3d7ee"/>
    </radialGradient>

    <marker id="arrowAxis" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>

    <marker id="arrowPsi" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c02f45"/>
    </marker>

    <marker id="arrowTheta" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f7a5a"/>
    </marker>

    <marker id="arrowPhi" viewBox="0 0 10 10" refX="9.2" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8570f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

  <!-- ============ titles ============ -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1f2933">
    <text x="60" y="62" font-size="31" font-weight="bold">The Bloch Sphere</text>
    <text x="60" y="92" font-size="16" fill="#5b6875" font-style="italic">Geometric representation of a pure single-qubit state</text>
  </g>

  <!-- ============ sphere body ============ -->
  <circle cx="520" cy="450" r="290" fill="url(#ballShade)" stroke="#4a6fa5" stroke-width="2.2"/>

  <!-- hidden (back) great circles -->
  <g fill="none" stroke="#8aa6ca" stroke-width="1.3" stroke-dasharray="6 6" opacity="0.95">
    <path d="M 230 450 A 290 99.2 0 0 1 810 450"/>
    <path d="M 565.65 163.6 A 290 115.2 -80.94 0 1 474.35 736.4"/>
    <path d="M 348.5 216.1 A 290 247 53.75 0 0 691.5 683.9"/>
  </g>

  <!-- visible (front) great circles -->
  <g fill="none" stroke="#5c7fae" stroke-width="1.7">
    <path d="M 230 450 A 290 99.2 0 0 0 810 450"/>
  </g>
  <g fill="none" stroke="#7f9cc4" stroke-width="1.4">
    <path d="M 565.65 163.6 A 290 115.2 -80.94 0 0 474.35 736.4"/>
    <path d="M 348.5 216.1 A 290 247 53.75 0 1 691.5 683.9"/>
  </g>

  <!-- ============ coordinate axes ============ -->
  <g stroke="#2b2b2b" fill="none" stroke-linecap="round">
    <!-- negative half-axes lie behind the sphere -->
    <g stroke-width="1.6" stroke-dasharray="7 6" opacity="0.75">
      <line x1="676.9" y1="334.9" x2="520" y2="450"/>
      <line x1="183.6" y1="396.4" x2="520" y2="450"/>
      <line x1="520" y1="782.5" x2="520" y2="450"/>
    </g>
    <!-- positive half-axes -->
    <g stroke-width="2.1" marker-end="url(#arrowAxis)">
      <line x1="520" y1="450" x2="363.1" y2="565.1"/>
      <line x1="520" y1="450" x2="856.4" y2="503.6"/>
      <line x1="520" y1="450" x2="520" y2="117.5"/>
    </g>
  </g>

  <!-- axis intersection dots -->
  <g fill="#2b2b2b">
    <circle cx="520" cy="177.49" r="4"/>
    <circle cx="520" cy="722.51" r="3.2"/>
    <circle cx="397.45" cy="539.90" r="3.2"/>
    <circle cx="782.83" cy="491.91" r="3.2"/>
  </g>

  <!-- axis labels -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1f2933" font-style="italic">
    <text x="338" y="590" font-size="26">x</text>
    <text x="884" y="514" font-size="26">y</text>
    <text x="492" y="132" font-size="26">z</text>
  </g>

  <!-- pole / basis labels -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1f2933">
    <text x="548" y="168" font-size="23">|0&gt;</text>
    <text x="548" y="750" font-size="23">|1&gt;</text>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#6b7887" font-size="17">
    <text x="410" y="578">|+&gt;</text>
    <text x="768" y="530">|+i&gt;</text>
  </g>

  <!-- ============ projection helper lines ============ -->
  <g stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5" fill="none">
    <line x1="589.44" y1="371.39" x2="589.44" y2="527.70"/>
    <line x1="520" y1="450" x2="589.44" y2="527.70"/>
  </g>
  <circle cx="589.44" cy="527.70" r="3" fill="#8a8f98"/>

  <!-- ============ theta arc (polar angle, from +z toward |psi>) ============ -->
  <path fill="none" stroke="#1f7a5a" stroke-width="2.4" marker-end="url(#arrowTheta)"
        d="M 520.00 357.35 L 522.51 360.51 L 525.00 364.36 L 527.46 368.86 L 529.86 373.97
           L 532.18 379.66 L 534.42 385.90 L 536.54 392.60 L 538.53 399.76 L 540.39 407.28
           L 542.08 415.15 L 543.62 423.28"/>
  <text x="552" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="19"
        font-style="italic" fill="#1f7a5a" text-anchor="middle">theta</text>

  <!-- ============ phi arc (azimuth, from +x in the xy-plane) ============ -->
  <path fill="none" stroke="#a8570f" stroke-width="2.4" marker-end="url(#arrowPhi)"
        d="M 468.53 487.76 L 480.35 489.39 L 492.61 490.59 L 505.16 491.35
           L 517.88 491.66 L 530.63 491.50 L 543.25 490.90 L 555.61 489.84"/>
  <text x="508" y="514" font-family="Georgia, 'Times New Roman', serif" font-size="19"
        font-style="italic" fill="#a8570f" text-anchor="middle">phi</text>

  <!-- ============ state vector |psi> ============ -->
  <line x1="520" y1="450" x2="589.44" y2="371.39" stroke="#c02f45" stroke-width="3.4"
        stroke-linecap="round" marker-end="url(#arrowPsi)"/>
  <circle cx="589.44" cy="371.39" r="6" fill="#c02f45" stroke="#ffffff" stroke-width="1.6"/>
  <circle cx="520" cy="450" r="4.2" fill="#2b2b2b"/>
  <text x="606" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="23"
        fill="#c02f45" font-weight="bold">|psi&gt;</text>

  <!-- ============ side panels ============ -->
  <g>
    <rect x="870" y="150" width="310" height="200" rx="8"
          fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.3"/>
    <text x="890" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="14"
          font-weight="bold" fill="#3a4a5e" letter-spacing="1.6">STATE VECTOR</text>
    <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#1f2933">
      <text x="890" y="210">|psi&gt; = cos(theta/2)|0&gt;</text>
      <text x="890" y="232">      + e^(i phi) sin(theta/2)|1&gt;</text>
      <text x="890" y="264">theta : polar angle from +z</text>
      <text x="890" y="284">        0 &lt;= theta &lt;= pi</text>
      <text x="890" y="312">phi   : azimuth from +x in xy-plane</text>
      <text x="890" y="332">        0 &lt;= phi &lt; 2 pi</text>
    </g>
  </g>

  <g>
    <rect x="870" y="375" width="310" height="155" rx="8"
          fill="#f7f9fc" stroke="#c8d3e0" stroke-width="1.3"/>
    <text x="890" y="405" font-family="Georgia, 'Times New Roman', serif" font-size="14"
          font-weight="bold" fill="#3a4a5e" letter-spacing="1.6">BASIS STATES</text>
    <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#1f2933">
      <text x="890" y="435">+z : |0&gt;</text>
      <text x="890" y="457">-z : |1&gt;</text>
      <text x="890" y="479">+x : |+&gt;  = (|0&gt; + |1&gt;)/sqrt(2)</text>
      <text x="890" y="501">+y : |+i&gt; = (|0&gt; + i|1&gt;)/sqrt(2)</text>
    </g>
  </g>

  <!-- ============ legend ============ -->
  <g>
    <line x1="60" y1="826" x2="110" y2="826" stroke="#5c7fae" stroke-width="1.8"/>
    <text x="120" y="831" font-family="Georgia, 'Times New Roman', serif" font-size="15"
          fill="#3a4a5e">front hemisphere (visible)</text>
    <line x1="330" y1="826" x2="380" y2="826" stroke="#8aa6ca" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="390" y="831" font-family="Georgia, 'Times New Roman', serif" font-size="15"
          fill="#3a4a5e">back hemisphere (hidden)</text>
    <line x1="600" y1="826" x2="650" y2="826" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="660" y="831" font-family="Georgia, 'Times New Roman', serif" font-size="15"
          fill="#3a4a5e">projection of |psi&gt; onto the xy-plane</text>
    <text x="60" y="866" font-family="Georgia, 'Times New Roman', serif" font-size="14"
          fill="#7a8592" font-style="italic">Orthographic projection: azimuth 25 deg, elevation 20 deg above the equatorial plane. Every pure state is one point on the unit sphere.</text>
  </g>
</svg>
