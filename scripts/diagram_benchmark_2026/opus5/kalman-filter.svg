<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ahDark" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="ahGreen" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#059669"/>
    </marker>
    <marker id="ahAmber" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="ahPurple" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#f6f8fc"/>

  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Kalman Filter - Block Diagram</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#64748b">Linear Gaussian state estimation: predict -&gt; measure -&gt; correct, once per time step k</text>

  <!-- CONTROL INPUT -->
  <rect x="200" y="112" width="220" height="56" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="1.8" filter="url(#soft)"/>
  <text x="310" y="146" text-anchor="middle" font-size="15" fill="#1e293b">Control input  u(k)</text>
  <line x1="310" y1="168" x2="310" y2="212" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ahBlue)"/>
  <text x="322" y="196" font-size="13" fill="#2563eb">u(k)</text>

  <!-- MEASUREMENT PANEL -->
  <rect x="760" y="95" width="370" height="95" rx="14" fill="#fffaf0" stroke="#d97706" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="778" y="120" font-size="15" font-weight="700" fill="#b45309">3 . MEASUREMENT (Sensor)</text>
  <rect x="778" y="130" width="334" height="48" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.6" filter="url(#soft)"/>
  <text x="795" y="160" font-size="14.5" fill="#1e293b">z(k) = H x(k) + v(k),   v ~ N(0, R)</text>
  <line x1="910" y1="190" x2="910" y2="258" stroke="#d97706" stroke-width="2.4" marker-end="url(#ahAmber)"/>
  <text x="924" y="230" font-size="13" fill="#b45309">z(k)  observed</text>

  <!-- PREDICTION PANEL -->
  <rect x="110" y="215" width="400" height="290" rx="14" fill="#f2f6ff" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="128" y="243" font-size="17" font-weight="700" fill="#1d4ed8">1 . PREDICTION (Time Update)</text>

  <rect x="135" y="262" width="350" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
  <text x="155" y="288" font-size="12.5" fill="#64748b">State extrapolation</text>
  <text x="155" y="317" font-size="15" fill="#0f172a">xhat(k|k-1) = F xhat(k-1|k-1) + B u(k)</text>

  <rect x="135" y="368" width="350" height="80" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.6" filter="url(#soft)"/>
  <text x="155" y="394" font-size="12.5" fill="#64748b">Covariance extrapolation</text>
  <text x="155" y="423" font-size="15" fill="#0f172a">P(k|k-1) = F P(k-1|k-1) F^T + Q</text>

  <text x="135" y="478" font-size="12" fill="#64748b">Propagate the process model forward - no measurement used here.</text>

  <!-- PRIOR BUS: prediction -> update -->
  <polyline points="485,293 600,293" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <polyline points="485,408 600,408" fill="none" stroke="#2563eb" stroke-width="2.2"/>
  <line x1="600" y1="293" x2="600" y2="605" stroke="#2563eb" stroke-width="2.2"/>
  <text x="551" y="283" text-anchor="middle" font-size="12" fill="#1d4ed8">xhat(k|k-1)</text>
  <text x="551" y="398" text-anchor="middle" font-size="12" fill="#1d4ed8">P(k|k-1)</text>
  <text x="578" y="470" text-anchor="middle" font-size="12" fill="#1d4ed8" transform="rotate(-90 578 470)">prior (a priori) estimate bus</text>

  <line x1="600" y1="293" x2="663" y2="293" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ahBlue)"/>
  <line x1="600" y1="371" x2="663" y2="371" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ahBlue)"/>
  <line x1="600" y1="449" x2="663" y2="449" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ahBlue)"/>
  <line x1="600" y1="527" x2="663" y2="527" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ahBlue)"/>
  <line x1="600" y1="605" x2="663" y2="605" stroke="#2563eb" stroke-width="2.2" marker-end="url(#ahBlue)"/>

  <!-- UPDATE PANEL -->
  <rect x="640" y="215" width="490" height="435" rx="14" fill="#f1fbf6" stroke="#059669" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="658" y="243" font-size="17" font-weight="700" fill="#047857">2 . UPDATE (Correction)</text>

  <rect x="665" y="262" width="440" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
  <text x="685" y="285" font-size="12.5" fill="#64748b">Residual / innovation   (measurement minus prediction)</text>
  <text x="685" y="311" font-size="15" fill="#0f172a">y(k) = z(k) - H xhat(k|k-1)</text>

  <rect x="665" y="340" width="440" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
  <text x="685" y="363" font-size="12.5" fill="#64748b">Innovation covariance</text>
  <text x="685" y="389" font-size="15" fill="#0f172a">S(k) = H P(k|k-1) H^T + R</text>

  <rect x="665" y="418" width="440" height="62" rx="8" fill="#fff1f1" stroke="#dc2626" stroke-width="2.2" filter="url(#soft)"/>
  <text x="685" y="441" font-size="12.5" font-weight="700" fill="#b91c1c">KALMAN GAIN   (how much to trust the measurement)</text>
  <text x="685" y="467" font-size="15" font-weight="700" fill="#0f172a">K(k) = P(k|k-1) H^T S(k)^-1</text>

  <rect x="665" y="496" width="440" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
  <text x="685" y="519" font-size="12.5" fill="#64748b">State update (a posteriori)</text>
  <text x="685" y="545" font-size="15" fill="#0f172a">xhat(k|k) = xhat(k|k-1) + K(k) y(k)</text>

  <rect x="665" y="574" width="440" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.6" filter="url(#soft)"/>
  <text x="685" y="597" font-size="12.5" fill="#64748b">Covariance update</text>
  <text x="685" y="623" font-size="15" fill="#0f172a">P(k|k) = (I - K(k) H) P(k|k-1)</text>

  <line x1="885" y1="402" x2="885" y2="416" stroke="#059669" stroke-width="2.2" marker-end="url(#ahGreen)"/>
  <text x="897" y="414" font-size="12" fill="#047857">S</text>
  <line x1="885" y1="480" x2="885" y2="494" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <text x="897" y="492" font-size="12" fill="#b91c1c">K</text>
  <line x1="885" y1="558" x2="885" y2="572" stroke="#dc2626" stroke-width="2.4" marker-end="url(#ahRed)"/>
  <text x="897" y="570" font-size="12" fill="#b91c1c">K</text>

  <polyline points="1105,293 1152,293 1152,527 1107,527" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#ahGreen)"/>
  <text x="1173" y="400" text-anchor="middle" font-size="12" fill="#047857" transform="rotate(-90 1173 400)">residual y(k)</text>

  <!-- UPDATE -> STATE ESTIMATE -->
  <line x1="885" y1="650" x2="885" y2="688" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#ahPurple)"/>
  <text x="898" y="675" font-size="12.5" fill="#6d28d9">posterior  xhat(k|k), P(k|k)</text>

  <!-- STATE ESTIMATE PANEL -->
  <rect x="640" y="690" width="490" height="140" rx="14" fill="#f7f4ff" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="658" y="716" font-size="17" font-weight="700" fill="#6d28d9">4 . STATE ESTIMATE (Output)</text>
  <rect x="660" y="728" width="450" height="62" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6" filter="url(#soft)"/>
  <text x="680" y="751" font-size="12.5" fill="#64748b">Filtered (a posteriori) estimate at step k</text>
  <text x="680" y="777" font-size="15" fill="#0f172a">xhat(k|k) ,  P(k|k)</text>
  <text x="660" y="814" font-size="12" fill="#64748b">Best estimate of the state given all measurements up to time k.</text>

  <line x1="1130" y1="745" x2="1184" y2="745" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#ahPurple)"/>
  <text x="1157" y="734" text-anchor="middle" font-size="11" fill="#6d28d9">output</text>

  <!-- FEEDBACK LOOP -->
  <line x1="640" y1="760" x2="492" y2="760" stroke="#334155" stroke-width="2.4" marker-end="url(#ahDark)"/>
  <text x="566" y="748" text-anchor="middle" font-size="11.5" fill="#334155">posterior fed back</text>

  <rect x="280" y="730" width="210" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8" filter="url(#soft)"/>
  <text x="385" y="756" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">z^-1   unit delay</text>
  <text x="385" y="776" text-anchor="middle" font-size="11.5" fill="#64748b">k  -&gt;  k-1</text>

  <polyline points="280,760 60,760 60,355 108,355" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#ahDark)"/>
  <text x="82" y="570" text-anchor="middle" font-size="12" fill="#334155" transform="rotate(-90 82 570)">feedback: xhat(k-1|k-1), P(k-1|k-1)</text>

  <!-- NOTATION -->
  <rect x="110" y="535" width="400" height="165" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="128" y="562" font-size="13" font-weight="700" fill="#475569">NOTATION</text>
  <text x="128" y="588" font-size="12.5" fill="#334155">F  state transition matrix</text>
  <text x="128" y="610" font-size="12.5" fill="#334155">B  control-input matrix</text>
  <text x="128" y="632" font-size="12.5" fill="#334155">H  observation matrix</text>
  <text x="128" y="654" font-size="12.5" fill="#334155">Q  process noise cov.</text>
  <text x="128" y="676" font-size="12.5" fill="#334155">R  measurement noise cov.</text>
  <text x="322" y="588" font-size="12.5" fill="#334155">u  control input</text>
  <text x="322" y="610" font-size="12.5" fill="#334155">z  measurement</text>
  <text x="322" y="632" font-size="12.5" fill="#b91c1c">K  Kalman gain</text>
  <text x="322" y="654" font-size="12.5" fill="#047857">y  residual (innovation)</text>
  <text x="322" y="676" font-size="12.5" fill="#334155">S  innovation covariance</text>

  <text x="600" y="872" text-anchor="middle" font-size="12.5" fill="#64748b">Closed loop: predict -&gt; compare with measurement (residual) -&gt; weight by Kalman gain -&gt; correct -&gt; delay -&gt; predict again.</text>
</svg>
