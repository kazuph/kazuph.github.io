<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D7263D"/></marker>
    <marker id="mR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#F28C28"/></marker>
    <marker id="mK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#233044"/></marker>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#E4F1F9"/><stop offset="100%" stop-color="#B9D7EA"/></linearGradient>
    <linearGradient id="laserG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4A525C"/><stop offset="100%" stop-color="#22272E"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <style>
      .t { font-size: 17px; fill: #233044; }
      .s { font-size: 13px; fill: #5C6470; }
      .beam { stroke: #D7263D; stroke-width: 4; fill: none; }
      .ret { stroke: #F28C28; stroke-width: 4; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#FCFCFA"/>
  <text x="30" y="52" font-size="26" font-weight="bold" fill="#233044">Michelson interferometer</text>
  <text x="30" y="82" class="s">A beam splitter divides the laser into two arms; the reflected beams recombine and interfere on the screen.</text>

  <!-- coordinates: BS (570,440), Mirror A (570,140), Mirror B (970,440), Screen (570,740) -->
  <!-- laser -->
  <rect x="60" y="405" width="200" height="70" rx="6" fill="url(#laserG)"/>
  <rect x="260" y="425" width="25" height="30" fill="#828A94"/>
  <text x="160" y="447" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Laser</text>
  <text x="160" y="505" text-anchor="middle" class="s">coherent source</text>

  <!-- glow along beams -->
  <g stroke="#FF6B7A" stroke-width="12" opacity="0.25" filter="url(#glow)" fill="none">
    <line x1="285" y1="440" x2="560" y2="440"/><line x1="580" y1="440" x2="960" y2="440"/><line x1="570" y1="430" x2="570" y2="150"/><line x1="570" y1="450" x2="570" y2="720"/>
  </g>

  <!-- beam splitter -->
  <polygon points="515,495 625,385 635,395 525,505" fill="url(#glass)" stroke="#4A5A6A" stroke-width="1.5"/>
  <line x1="515" y1="495" x2="625" y2="385" stroke="#4A5A6A" stroke-width="4"/>
  <text x="645" y="500" class="t">Beam Splitter</text>
  <text x="645" y="522" class="s">50/50, at 45°</text>

  <!-- mirror A (top) -->
  <rect x="490" y="128" width="160" height="12" fill="#BFD7EA"/>
  <rect x="490" y="110" width="160" height="18" fill="#4A5A6A"/>
  <g stroke="#4A5A6A" stroke-width="1.2">
    <line x1="500" y1="110" x2="512" y2="95"/><line x1="520" y1="110" x2="532" y2="95"/><line x1="540" y1="110" x2="552" y2="95"/><line x1="560" y1="110" x2="572" y2="95"/><line x1="580" y1="110" x2="592" y2="95"/><line x1="600" y1="110" x2="612" y2="95"/><line x1="620" y1="110" x2="632" y2="95"/><line x1="640" y1="110" x2="652" y2="95"/>
  </g>
  <text x="670" y="128" class="t">Mirror A</text>
  <text x="670" y="150" class="s">fixed</text>

  <!-- mirror B (right, movable) -->
  <rect x="970" y="360" width="12" height="160" fill="#BFD7EA"/>
  <rect x="982" y="360" width="18" height="160" fill="#4A5A6A"/>
  <g stroke="#4A5A6A" stroke-width="1.2">
    <line x1="1000" y1="370" x2="1015" y2="358"/><line x1="1000" y1="390" x2="1015" y2="378"/><line x1="1000" y1="410" x2="1015" y2="398"/><line x1="1000" y1="430" x2="1015" y2="418"/><line x1="1000" y1="450" x2="1015" y2="438"/><line x1="1000" y1="470" x2="1015" y2="458"/><line x1="1000" y1="490" x2="1015" y2="478"/><line x1="1000" y1="510" x2="1015" y2="498"/>
  </g>
  <text x="985" y="560" text-anchor="middle" class="t">Mirror B</text>
  <text x="985" y="582" text-anchor="middle" class="s">movable (ΔL)</text>
  <line x1="960" y1="325" x2="1030" y2="325" stroke="#233044" stroke-width="1.5" marker-start="url(#mK)" marker-end="url(#mK)"/>
  <text x="995" y="312" text-anchor="middle" class="s">ΔL</text>

  <!-- screen -->
  <rect x="460" y="725" width="220" height="30" fill="#F6F1E7" stroke="#4A5A6A" stroke-width="1.5"/>
  <g fill="none" stroke="#E78A97" stroke-width="2">
    <path d="M558 740 A12 12 0 0 0 582 740"/><path d="M540 740 A30 12 0 0 0 600 740"/><path d="M522 740 A48 12 0 0 0 618 740"/><path d="M504 740 A66 12 0 0 0 636 740"/><path d="M486 740 A84 12 0 0 0 654 740"/>
  </g>
  <text x="570" y="785" text-anchor="middle" class="t">Screen</text>
  <text x="570" y="807" text-anchor="middle" class="s">interference fringes</text>

  <!-- outgoing rays -->
  <line x1="285" y1="440" x2="523" y2="440" class="beam" marker-end="url(#mB)"/>
  <text x="400" y="425" text-anchor="middle" class="s">incident</text>
  <line x1="585" y1="440" x2="958" y2="440" class="beam" marker-end="url(#mB)"/>
  <text x="790" y="425" text-anchor="middle" class="s">transmitted (arm B)</text>
  <line x1="570" y1="425" x2="570" y2="152" class="beam" marker-end="url(#mB)"/>
  <text x="545" y="270" text-anchor="end" class="s">reflected (arm A)</text>

  <!-- returning rays (offset) -->
  <line x1="960" y1="458" x2="590" y2="458" class="ret" marker-end="url(#mR)"/>
  <line x1="552" y1="150" x2="552" y2="420" class="ret" marker-end="url(#mR)"/>
  <line x1="565" y1="460" x2="565" y2="715" class="ret" marker-end="url(#mR)"/>
  <line x1="550" y1="445" x2="580" y2="715" class="ret" marker-end="url(#mR)"/>
  <text x="590" y="600" class="s">recombined</text>

  <!-- arm lengths -->
  <g stroke="#8A93A0" stroke-width="1.2">
    <line x1="380" y1="405" x2="380" y2="155"/><line x1="370" y1="405" x2="390" y2="405"/><line x1="370" y1="155" x2="390" y2="155"/>
    <line x1="605" y1="520" x2="940" y2="520"/><line x1="605" y1="510" x2="605" y2="530"/><line x1="940" y1="510" x2="940" y2="530"/>
  </g>
  <text x="365" y="285" text-anchor="end" class="s" font-style="italic">L<tspan baseline-shift="sub" font-size="10">A</tspan></text>
  <text x="772" y="545" text-anchor="middle" class="s" font-style="italic">L<tspan baseline-shift="sub" font-size="10">B</tspan></text>

  <!-- notes -->
  <g class="s">
    <text x="780" y="120">Path difference Δ = 2(L<tspan baseline-shift="sub" font-size="10">B</tspan> − L<tspan baseline-shift="sub" font-size="10">A</tspan>)</text>
    <text x="780" y="145">Bright fringe: Δ = mλ</text>
    <text x="780" y="170">Moving mirror B by λ/2 shifts one fringe</text>
    <line x1="30" y1="860" x2="100" y2="860" class="beam" marker-end="url(#mB)"/><text x="110" y="865">outgoing beam</text>
    <line x1="310" y1="860" x2="380" y2="860" class="ret" marker-end="url(#mR)"/><text x="390" y="865">returning / recombined beam</text>
  </g>
</svg>
