<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#233044"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker>
    <style>
      .b { stroke-width: 1.6; }
      .bt { font-size: 13px; fill: #233044; }
      .lb { font-size: 12px; fill: #233044; }
      .sm { font-size: 10px; fill: #233044; }
      .f { fill: none; stroke: #233044; stroke-width: 1.6; }
      .res { fill: none; stroke: #C0392B; stroke-width: 1.6; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <text x="30" y="46" font-size="24" font-weight="bold" fill="#233044">Transformer: encoder-decoder architecture</text>

  <!-- stacks -->
  <rect x="140" y="205" width="380" height="500" rx="14" fill="#F4F4F6" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="152" y="228" font-size="14" font-weight="bold" fill="#9AA0A6">Encoder × N</text>
  <rect x="690" y="100" width="380" height="605" rx="14" fill="#F4F4F6" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="702" y="123" font-size="14" font-weight="bold" fill="#9AA0A6">Decoder × N</text>

  <!-- ===== encoder column (cx=330) ===== -->
  <g class="b">
    <rect x="200" y="808" width="260" height="55" rx="8" fill="#FCE4D6" stroke="#C47A3A"/><text x="330" y="840" text-anchor="middle" class="bt">Input Embedding</text>
    <rect x="200" y="590" width="260" height="70" rx="8" fill="#FFE9A8" stroke="#B8860B"/><text x="330" y="620" text-anchor="middle" class="bt">Multi-Head</text><text x="330" y="638" text-anchor="middle" class="bt">Attention</text>
    <rect x="200" y="487" width="260" height="55" rx="8" fill="#E3F2E1" stroke="#2E7D4F"/><text x="330" y="519" text-anchor="middle" class="bt">Add &amp; Norm</text>
    <rect x="200" y="365" width="260" height="70" rx="8" fill="#CFE8F3" stroke="#2A6F97"/><text x="330" y="395" text-anchor="middle" class="bt">Feed</text><text x="330" y="413" text-anchor="middle" class="bt">Forward</text>
    <rect x="200" y="262" width="260" height="55" rx="8" fill="#E3F2E1" stroke="#2E7D4F"/><text x="330" y="294" text-anchor="middle" class="bt">Add &amp; Norm</text>
  </g>
  <circle cx="330" cy="750" r="14" fill="#FFFFFF" stroke="#233044" stroke-width="1.4"/><text x="330" y="755" text-anchor="middle" class="lb">+</text>
  <line x1="316" y1="750" x2="270" y2="750" class="f"/>
  <text x="262" y="746" text-anchor="end" class="lb">Positional</text><text x="262" y="761" text-anchor="end" class="lb">Encoding</text>
  <text x="330" y="893" text-anchor="middle" class="lb">Inputs (source tokens)</text>
  <g class="f" marker-end="url(#a)">
    <line x1="330" y1="878" x2="330" y2="866"/>
    <line x1="330" y1="808" x2="330" y2="766"/>
    <line x1="330" y1="736" x2="330" y2="662"/>
    <line x1="330" y1="590" x2="330" y2="544"/>
    <line x1="330" y1="487" x2="330" y2="437"/>
    <line x1="330" y1="365" x2="330" y2="319"/>
  </g>
  <polyline points="330,690 270,690 270,662" class="f"/><polyline points="330,690 390,690 390,662" class="f"/>
  <text x="262" y="680" text-anchor="end" class="sm">Q</text><text x="322" y="680" text-anchor="end" class="sm">K</text><text x="398" y="680" class="sm">V</text>
  <polyline points="330,715 485,715 485,515 462,515" class="res" marker-end="url(#r)"/>
  <polyline points="330,455 485,455 485,290 462,290" class="res" marker-end="url(#r)"/>
  <!-- encoder output to cross-attention -->
  <polyline points="330,262 330,240 620,240 620,450 780,450 780,478" class="f" marker-end="url(#a)"/>
  <polyline points="620,450 830,450 830,478" class="f" marker-end="url(#a)"/>
  <text x="620" y="222" text-anchor="middle" class="lb">encoder output</text>
  <text x="772" y="468" text-anchor="end" class="sm">K</text><text x="838" y="468" class="sm">V</text>

  <!-- ===== decoder column (cx=910) ===== -->
  <g class="b">
    <rect x="780" y="808" width="260" height="55" rx="8" fill="#FCE4D6" stroke="#C47A3A"/><text x="910" y="840" text-anchor="middle" class="bt">Output Embedding</text>
    <rect x="780" y="590" width="260" height="70" rx="8" fill="#FFE9A8" stroke="#B8860B"/><text x="910" y="620" text-anchor="middle" class="bt">Masked Multi-Head</text><text x="910" y="638" text-anchor="middle" class="bt">Attention</text>
    <rect x="780" y="487" width="260" height="55" rx="8" fill="#E3F2E1" stroke="#2E7D4F"/><text x="910" y="519" text-anchor="middle" class="bt">Add &amp; Norm</text>
    <rect x="780" y="395" width="260" height="70" rx="8" fill="#FFE9A8" stroke="#B8860B"/><text x="910" y="425" text-anchor="middle" class="bt">Multi-Head Attention</text><text x="910" y="443" text-anchor="middle" class="bt">(Cross-Attention)</text>
    <rect x="780" y="307" width="260" height="55" rx="8" fill="#E3F2E1" stroke="#2E7D4F"/><text x="910" y="339" text-anchor="middle" class="bt">Add &amp; Norm</text>
    <rect x="780" y="237" width="260" height="55" rx="8" fill="#CFE8F3" stroke="#2A6F97"/><text x="910" y="269" text-anchor="middle" class="bt">Feed Forward</text>
    <rect x="780" y="167" width="260" height="55" rx="8" fill="#E3F2E1" stroke="#2E7D4F"/><text x="910" y="199" text-anchor="middle" class="bt">Add &amp; Norm</text>
    <rect x="810" y="80" width="200" height="50" rx="8" fill="#E8E0F5" stroke="#6A3FA0"/><text x="910" y="110" text-anchor="middle" class="bt">Linear</text>
    <rect x="1060" y="80" width="130" height="50" rx="8" fill="#E8E0F5" stroke="#6A3FA0"/><text x="1125" y="110" text-anchor="middle" class="bt">Softmax</text>
  </g>
  <circle cx="910" cy="750" r="14" fill="#FFFFFF" stroke="#233044" stroke-width="1.4"/><text x="910" y="755" text-anchor="middle" class="lb">+</text>
  <line x1="924" y1="750" x2="970" y2="750" class="f"/>
  <text x="978" y="746" class="lb">Positional</text><text x="978" y="761" class="lb">Encoding</text>
  <text x="910" y="893" text-anchor="middle" class="lb">Outputs (shifted right)</text>
  <g class="f" marker-end="url(#a)">
    <line x1="910" y1="878" x2="910" y2="866"/>
    <line x1="910" y1="808" x2="910" y2="766"/>
    <line x1="910" y1="736" x2="910" y2="662"/>
    <line x1="910" y1="590" x2="910" y2="544"/>
    <line x1="910" y1="487" x2="910" y2="467"/>
    <line x1="910" y1="395" x2="910" y2="364"/>
    <line x1="910" y1="307" x2="910" y2="294"/>
    <line x1="910" y1="237" x2="910" y2="224"/>
    <line x1="910" y1="167" x2="910" y2="132"/>
    <line x1="1010" y1="105" x2="1058" y2="105"/>
    <line x1="1125" y1="80" x2="1125" y2="60"/>
  </g>
  <polyline points="910,690 850,690 850,662" class="f"/><polyline points="910,690 970,690 970,662" class="f"/>
  <text x="918" y="478" class="sm">Q</text>
  <polyline points="910,715 1050,715 1050,515 1042,515" class="res" marker-end="url(#r)"/>
  <polyline points="910,475 1050,475 1050,335 1042,335" class="res" marker-end="url(#r)"/>
  <polyline points="910,300 1050,300 1050,195 1042,195" class="res" marker-end="url(#r)"/>
  <text x="1050" y="600" class="sm" fill="#B8860B">mask: no</text><text x="1050" y="612" class="sm" fill="#B8860B">future tokens</text>
  <text x="1125" y="52" text-anchor="middle" class="lb">Output probabilities</text>

  <!-- legend -->
  <line x1="30" y1="78" x2="90" y2="78" class="res" marker-end="url(#r)"/><text x="98" y="82" class="lb">residual (skip) connection into Add &amp; Norm</text>
  <rect x="30" y="98" width="30" height="16" fill="#FFE9A8" stroke="#B8860B"/><text x="66" y="111" class="lb">attention</text>
  <rect x="150" y="98" width="30" height="16" fill="#CFE8F3" stroke="#2A6F97"/><text x="186" y="111" class="lb">feed-forward</text>
  <rect x="290" y="98" width="30" height="16" fill="#E3F2E1" stroke="#2E7D4F"/><text x="326" y="111" class="lb">Add &amp; Norm (LayerNorm)</text>
</svg>
