<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Hiragino Sans, Noto Sans CJK JP, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4E5A66" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatch2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#4E5A66" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="oilHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2B453"/><stop offset="100%" stop-color="#E0962E"/>
    </linearGradient>
    <linearGradient id="oilLo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAE7BD"/><stop offset="100%" stop-color="#F1D394"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3E8ED"/><stop offset="50%" stop-color="#C9D1D9"/><stop offset="100%" stop-color="#A9B4BF"/>
    </linearGradient>
    <marker id="ahHi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#D1495B"/>
    </marker>
    <marker id="ahLo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3F7CAC"/>
    </marker>
    <marker id="ahDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#233044"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#FAFAF7"/>
  <text x="40" y="60" font-size="28" font-weight="bold" fill="#233044">油圧シリンダー（複動型）の断面構造</text>
  <text x="40" y="98" font-size="16" fill="#4E5A66">ポートAに圧油を送るとピストンが右へ動き、ポートB側の油が戻る</text>

  <!-- cylinder body: walls (cut, hatched) -->
  <g stroke="#4E5A66" stroke-width="1.5">
    <rect x="100" y="210" width="860" height="50" fill="#8D99A6"/>
    <rect x="100" y="210" width="860" height="50" fill="url(#hatch)"/>
    <rect x="100" y="560" width="860" height="50" fill="#8D99A6"/>
    <rect x="100" y="560" width="860" height="50" fill="url(#hatch)"/>
    <rect x="100" y="210" width="50" height="400" fill="#8D99A6"/>
    <rect x="100" y="210" width="50" height="400" fill="url(#hatch)"/>
    <rect x="910" y="210" width="50" height="400" fill="#8D99A6"/>
    <rect x="910" y="210" width="50" height="400" fill="url(#hatch)"/>
  </g>
  <rect x="100" y="210" width="860" height="14" fill="#C9D1D9"/>
  <rect x="100" y="596" width="860" height="14" fill="#C9D1D9"/>

  <!-- chambers -->
  <rect x="150" y="260" width="320" height="300" fill="url(#oilHi)"/>
  <rect x="570" y="260" width="340" height="300" fill="url(#oilLo)"/>

  <!-- piston -->
  <rect x="470" y="265" width="100" height="290" fill="#C9D1D9" stroke="#4E5A66" stroke-width="1.5"/>
  <rect x="470" y="265" width="100" height="290" fill="url(#hatch2)"/>
  <rect x="490" y="260" width="60" height="20" fill="#2F2F2F"/>
  <rect x="490" y="540" width="60" height="20" fill="#2F2F2F"/>
  <!-- rod -->
  <rect x="570" y="375" width="550" height="70" fill="url(#rod)" stroke="#4E5A66" stroke-width="1.5"/>
  <rect x="570" y="375" width="340" height="70" fill="url(#hatch2)"/>
  <rect x="915" y="360" width="40" height="15" fill="#2F2F2F"/>
  <rect x="915" y="445" width="40" height="15" fill="#2F2F2F"/>
  <rect x="1120" y="345" width="50" height="130" fill="#8D99A6" stroke="#4E5A66" stroke-width="1.5"/>
  <circle cx="1145" cy="410" r="17" fill="#FAFAF7" stroke="#4E5A66" stroke-width="1.5"/>

  <!-- ports -->
  <rect x="210" y="140" width="60" height="70" fill="#8D99A6" stroke="#4E5A66" stroke-width="1.5"/>
  <rect x="225" y="140" width="30" height="120" fill="url(#oilHi)"/>
  <rect x="790" y="140" width="60" height="70" fill="#8D99A6" stroke="#4E5A66" stroke-width="1.5"/>
  <rect x="805" y="140" width="30" height="120" fill="url(#oilLo)"/>
  <text x="240" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#233044">ポート A（供給）</text>
  <text x="820" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#233044">ポート B（戻り）</text>

  <!-- flow arrows -->
  <g stroke="#D1495B" stroke-width="4" marker-end="url(#ahHi)" fill="none">
    <line x1="240" y1="100" x2="240" y2="228"/>
    <line x1="220" y1="360" x2="420" y2="360"/>
    <line x1="220" y1="410" x2="420" y2="410"/>
    <line x1="220" y1="460" x2="420" y2="460"/>
  </g>
  <g stroke="#3F7CAC" stroke-width="4" marker-end="url(#ahLo)" fill="none">
    <line x1="610" y1="330" x2="790" y2="330"/>
    <line x1="610" y1="500" x2="790" y2="500"/>
    <line x1="820" y1="275" x2="820" y2="100"/>
  </g>
  <text x="215" y="545" font-size="13" fill="#D1495B">高圧側（P₁）</text>
  <text x="895" y="545" text-anchor="end" font-size="13" fill="#2E5F86">低圧側（P₂）</text>
  <text x="310" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#8E2E3D">圧力室 A</text>
  <text x="740" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E5F86">圧力室 B</text>

  <!-- piston motion -->
  <line x1="520" y1="655" x2="720" y2="655" stroke="#233044" stroke-width="6" marker-end="url(#ahDark)"/>
  <text x="620" y="690" text-anchor="middle" font-size="15" fill="#233044">ピストンの移動方向（F = P₁·A₁ − P₂·A₂）</text>

  <!-- leaders + labels -->
  <g stroke="#233044" stroke-width="1.2" fill="none">
    <polyline points="310,232 310,150 400,150"/>
    <polyline points="520,350 520,175 560,175"/>
    <polyline points="520,270 550,215 650,215"/>
    <polyline points="1020,375 1020,300 1050,300"/>
    <polyline points="935,360 935,285 950,285"/>
    <polyline points="1145,345 1145,290 1100,290"/>
    <polyline points="125,610 125,720 160,720"/>
    <polyline points="935,610 935,760 900,760"/>
  </g>
  <g font-size="15" fill="#233044">
    <text x="405" y="155">シリンダーチューブ</text>
    <text x="565" y="180">ピストン</text>
    <text x="655" y="220" font-size="13">ピストンシール</text>
    <text x="1055" y="305">ピストンロッド</text>
    <text x="955" y="290" font-size="13">ロッドシール</text>
    <text x="1095" y="295" text-anchor="end" font-size="13">ロッドエンド</text>
    <text x="165" y="725" font-size="13">キャップ（ヘッド側）</text>
    <text x="895" y="765" text-anchor="end" font-size="13">ロッドカバー（グランド）</text>
  </g>

  <!-- legend -->
  <g stroke="#4E5A66" stroke-width="1">
    <rect x="60" y="820" width="40" height="30" fill="url(#oilHi)"/>
    <rect x="320" y="820" width="40" height="30" fill="url(#oilLo)"/>
    <rect x="630" y="820" width="40" height="30" fill="#8D99A6"/>
    <rect x="630" y="820" width="40" height="30" fill="url(#hatch)"/>
    <rect x="940" y="825" width="40" height="20" fill="#2F2F2F" stroke="none"/>
  </g>
  <g font-size="13" fill="#233044">
    <text x="110" y="840">高圧の作動油</text>
    <text x="370" y="840">低圧の作動油（戻り）</text>
    <text x="680" y="840">金属（断面ハッチング）</text>
    <text x="990" y="840">シール</text>
  </g>
</svg>
