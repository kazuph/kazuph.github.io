<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Hiragino Sans, Noto Sans CJK JP, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker>
    <marker id="mI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7B5EA7"/></marker>
    <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2A6F97"/></marker>
    <marker id="mS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D4F"/></marker>
    <style>
      .zt { font-size: 15px; font-weight: bold; }
      .zs { font-size: 12px; }
      .at { font-size: 15px; font-weight: bold; fill: #233044; }
      .as { font-size: 11.5px; fill: #233044; }
      .lb { font-size: 12px; }
      .g { fill: none; stroke: #6B7280; stroke-width: 2.2; }
      .i { fill: none; stroke: #7B5EA7; stroke-width: 2.6; }
      .a { fill: none; stroke: #2A6F97; stroke-width: 2.6; }
      .sv { fill: none; stroke: #2E7D4F; stroke-width: 2.6; }
      .st { font-size: 11px; font-weight: bold; fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#FBFBFB"/>
  <text x="30" y="50" font-size="26" font-weight="bold" fill="#233044">ゼロトラスト認証とトークン交換</text>
  <text x="30" y="80" font-size="14" fill="#6B7280">すべてのホップで認証する。ネットワーク上の位置だけでは何も信頼しない</text>

  <!-- trust zones -->
  <rect x="30" y="130" width="270" height="640" rx="16" fill="#FDECEC" stroke="#C0392B" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="45" y="158" class="zt" fill="#C0392B">UNTRUSTED</text>
  <text x="45" y="180" class="zs" fill="#C0392B">public internet</text>
  <rect x="350" y="130" width="410" height="220" rx="16" fill="#EAF0FB" stroke="#2A6F97" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="365" y="158" class="zt" fill="#2A6F97">IDENTITY PROVIDER</text>
  <text x="365" y="180" class="zs" fill="#2A6F97">OIDC / OAuth 2.0 トークン発行者</text>
  <rect x="350" y="400" width="300" height="370" rx="16" fill="#FFF6DD" stroke="#C98A1B" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="365" y="428" class="zt" fill="#C98A1B">EDGE (PEP)</text>
  <text x="365" y="450" class="zs" fill="#C98A1B">ポリシー強制点</text>
  <rect x="700" y="400" width="470" height="370" rx="16" fill="#E7F3EA" stroke="#2E7D4F" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="715" y="428" class="zt" fill="#2E7D4F">INTERNAL SERVICE MESH</text>
  <text x="715" y="450" class="zs" fill="#2E7D4F">mTLS + 呼び出しごとの service token</text>

  <!-- actors -->
  <g stroke-width="2">
    <rect x="70" y="270" width="190" height="85" rx="10" fill="#FFFFFF" stroke="#233044"/>
    <text x="165" y="305" text-anchor="middle" class="at">User</text>
    <text x="165" y="330" text-anchor="middle" class="as">credentials + MFA</text>
    <rect x="70" y="560" width="190" height="85" rx="10" fill="#FFFFFF" stroke="#233044"/>
    <text x="165" y="595" text-anchor="middle" class="at">Browser</text>
    <text x="165" y="620" text-anchor="middle" class="as">(OIDC client)</text>
    <rect x="430" y="205" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#2A6F97"/>
    <text x="555" y="240" text-anchor="middle" class="at">IdP</text>
    <text x="555" y="266" text-anchor="middle" class="as">ユーザーを認証し</text>
    <text x="555" y="288" text-anchor="middle" class="as">ID / access token を発行</text>
    <rect x="390" y="490" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#C98A1B"/>
    <text x="500" y="525" text-anchor="middle" class="at">API Gateway</text>
    <text x="500" y="553" text-anchor="middle" class="as">JWT 検証</text>
    <text x="500" y="575" text-anchor="middle" class="as">ポリシー判定</text>
    <text x="500" y="597" text-anchor="middle" class="as">トークン交換</text>
    <rect x="740" y="500" width="215" height="110" rx="10" fill="#FFFFFF" stroke="#2E7D4F"/>
    <text x="847" y="535" text-anchor="middle" class="at">Service A</text>
    <text x="847" y="561" text-anchor="middle" class="as">service token 検証</text>
    <text x="847" y="583" text-anchor="middle" class="as">ユーザー代理で B を呼ぶ</text>
    <rect x="990" y="500" width="165" height="110" rx="10" fill="#FFFFFF" stroke="#2E7D4F"/>
    <text x="1072" y="535" text-anchor="middle" class="at">Service B</text>
    <text x="1072" y="561" text-anchor="middle" class="as">service token 検証</text>
    <text x="1072" y="583" text-anchor="middle" class="as">scope: read:orders</text>
  </g>

  <!-- flows -->
  <line x1="165" y1="355" x2="165" y2="558" class="g" marker-end="url(#mG)"/>
  <text x="180" y="455" class="lb" fill="#233044">login</text>
  <polyline points="260,585 300,585 300,300 428,300" class="g" marker-end="url(#mG)"/>
  <text x="300" y="470" text-anchor="middle" class="lb" fill="#233044">authorize</text>
  <text x="300" y="486" text-anchor="middle" class="lb" fill="#233044">(PKCE)</text>
  <polyline points="428,255 330,255 330,600 262,600" class="i" marker-end="url(#mI)"/>
  <text x="338" y="520" class="lb" fill="#7B5EA7">ID token</text>
  <text x="338" y="540" class="lb" fill="#2A6F97">access token</text>
  <polyline points="165,645 165,700 440,700 440,642" class="a" marker-end="url(#mA)"/>
  <text x="300" y="725" text-anchor="middle" class="lb" fill="#2A6F97">Bearer: access token</text>
  <line x1="555" y1="490" x2="555" y2="352" class="g" marker-end="url(#mG)"/>
  <text x="570" y="405" class="lb" fill="#233044">JWKS 検証 +</text>
  <text x="570" y="421" class="lb" fill="#233044">token exchange</text>
  <line x1="610" y1="565" x2="738" y2="565" class="sv" marker-end="url(#mS)"/>
  <text x="674" y="552" text-anchor="middle" class="lb" fill="#2E7D4F">service token</text>
  <text x="674" y="588" text-anchor="middle" font-size="10.5" fill="#2E7D4F">aud: svc-a, act: user</text>
  <line x1="955" y1="565" x2="988" y2="565" class="sv" marker-end="url(#mS)"/>
  <text x="972" y="548" text-anchor="middle" class="lb" fill="#2E7D4F">service token'</text>
  <text x="972" y="588" text-anchor="middle" font-size="10.5" fill="#2E7D4F">aud: svc-b</text>
  <polyline points="1072,610 1072,745 200,745 200,647" class="g" marker-end="url(#mG)"/>
  <text x="640" y="765" text-anchor="middle" class="lb" fill="#6B7280">response（トークンはメッシュの外へ出ない）</text>

  <!-- step numbers -->
  <g>
    <circle cx="135" cy="455" r="12" fill="#233044"/><text x="135" y="459" text-anchor="middle" class="st">1</text>
    <circle cx="300" cy="420" r="12" fill="#233044"/><text x="300" y="424" text-anchor="middle" class="st">2</text>
    <circle cx="330" cy="225" r="12" fill="#233044"/><text x="330" y="229" text-anchor="middle" class="st">3</text>
    <circle cx="240" cy="700" r="12" fill="#233044"/><text x="240" y="704" text-anchor="middle" class="st">4</text>
    <circle cx="535" cy="415" r="12" fill="#233044"/><text x="535" y="419" text-anchor="middle" class="st">5</text>
    <circle cx="674" cy="620" r="12" fill="#233044"/><text x="674" y="624" text-anchor="middle" class="st">6</text>
    <circle cx="972" cy="620" r="12" fill="#233044"/><text x="972" y="624" text-anchor="middle" class="st">7</text>
    <circle cx="880" cy="745" r="12" fill="#233044"/><text x="880" y="749" text-anchor="middle" class="st">8</text>
  </g>

  <!-- legend -->
  <g class="lb" fill="#233044">
    <line x1="790" y1="150" x2="840" y2="150" stroke="#7B5EA7" stroke-width="3"/><text x="850" y="154">ID token: ユーザーが誰か（OIDC）。クライアントだけが使う</text>
    <line x1="790" y1="185" x2="840" y2="185" stroke="#2A6F97" stroke-width="3"/><text x="850" y="189">Access token: ユーザーからエッジへの委譲（aud: gateway）</text>
    <line x1="790" y1="220" x2="840" y2="220" stroke="#2E7D4F" stroke-width="3"/><text x="850" y="224">Service token: 短命・ホップごと・狭い audience</text>
    <line x1="790" y1="255" x2="840" y2="255" stroke="#6B7280" stroke-width="3"/><text x="850" y="259">制御 / 応答トラフィック</text>
    <text x="790" y="300" fill="#6B7280" font-size="11.5">Token exchange (RFC 8693): ゲートウェイがユーザーの access token を</text>
    <text x="790" y="318" fill="#6B7280" font-size="11.5">service token に交換し、ユーザートークン自体はメッシュ内に持ち込まない。</text>
  </g>

  <!-- extra: bottom note -->
  <text x="30" y="830" font-size="13" fill="#6B7280">各境界（破線）を越えるたびにトークンを検証し直す。IdP は境界の外からも内からも「発行者」として参照される。</text>
</svg>
