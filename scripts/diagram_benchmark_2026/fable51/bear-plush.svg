<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <radialGradient id="furGrad" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#EBC08C"/>
      <stop offset="100%" stop-color="#D19556"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FBEEDC"/>
      <stop offset="100%" stop-color="#F1D9B8"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F9E4CC"/>
      <stop offset="100%" stop-color="#FFF6EA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="#FFF6EA"/>
  <ellipse cx="600" cy="600" rx="470" ry="270" fill="url(#glow)"/>
  <ellipse cx="600" cy="805" rx="340" ry="42" fill="#E8D3BC"/>

  <!-- legs -->
  <g stroke="#B57D45" stroke-width="3">
    <ellipse cx="465" cy="700" rx="105" ry="95" fill="url(#furGrad)"/>
    <ellipse cx="735" cy="700" rx="105" ry="95" fill="url(#furGrad)"/>
    <ellipse cx="455" cy="728" rx="62" ry="50" fill="#F1C9A2" stroke-width="2"/>
    <ellipse cx="745" cy="728" rx="62" ry="50" fill="#F1C9A2" stroke-width="2"/>
  </g>
  <g fill="#D9A981">
    <circle cx="427" cy="696" r="10"/><circle cx="455" cy="686" r="10"/><circle cx="483" cy="696" r="10"/>
    <circle cx="717" cy="696" r="10"/><circle cx="745" cy="686" r="10"/><circle cx="773" cy="696" r="10"/>
  </g>

  <!-- body -->
  <ellipse cx="600" cy="505" rx="235" ry="210" fill="url(#furGrad)" stroke="#B57D45" stroke-width="3"/>
  <ellipse cx="600" cy="540" rx="135" ry="135" fill="url(#bellyGrad)"/>
  <line x1="600" y1="435" x2="600" y2="655" stroke="#A56A3C" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- chest patch (heart) -->
  <path d="M685 583 C606 518 635 456 685 503 C735 456 764 518 685 583 Z"
        fill="#F7D08A" stroke="#A56A3C" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- arms -->
  <g stroke="#B57D45" stroke-width="3">
    <ellipse cx="375" cy="485" rx="72" ry="115" fill="url(#furGrad)" transform="rotate(25 375 485)"/>
    <ellipse cx="825" cy="485" rx="72" ry="115" fill="url(#furGrad)" transform="rotate(-25 825 485)"/>
    <circle cx="325" cy="575" r="36" fill="#F1C9A2" stroke-width="2"/>
    <circle cx="875" cy="575" r="36" fill="#F1C9A2" stroke-width="2"/>
  </g>

  <!-- ears -->
  <g stroke="#B57D45" stroke-width="3">
    <circle cx="445" cy="155" r="78" fill="url(#furGrad)"/>
    <circle cx="755" cy="155" r="78" fill="url(#furGrad)"/>
  </g>
  <circle cx="445" cy="155" r="42" fill="#F1C9A2"/>
  <circle cx="755" cy="155" r="42" fill="#F1C9A2"/>

  <!-- head -->
  <circle cx="600" cy="295" r="205" fill="url(#furGrad)" stroke="#B57D45" stroke-width="3"/>
  <ellipse cx="530" cy="200" rx="80" ry="45" fill="#F3D7B0" opacity="0.6"/>
  <g stroke="#A56A3C" stroke-width="2" stroke-linecap="round">
    <line x1="470" y1="120" x2="462" y2="108"/>
    <line x1="500" y1="106" x2="495" y2="92"/>
    <line x1="532" y1="98" x2="529" y2="84"/>
  </g>

  <!-- muzzle -->
  <ellipse cx="600" cy="365" rx="105" ry="72" fill="#F6E2C4" stroke="#B57D45" stroke-width="2"/>
  <path d="M600 325 C642 325 642 345 622 358 C610 366 590 366 578 358 C558 345 558 325 600 325 Z" fill="#5A3A2A"/>
  <ellipse cx="588" cy="337" rx="10" ry="5" fill="#FFFFFF" opacity="0.5"/>
  <g fill="none" stroke="#5A3A2A" stroke-width="5" stroke-linecap="round">
    <line x1="600" y1="358" x2="600" y2="384"/>
    <path d="M600 384 C585 410 555 405 545 388"/>
    <path d="M600 384 C615 410 645 405 655 388"/>
  </g>

  <!-- eyes -->
  <g>
    <circle cx="528" cy="255" r="22" fill="#5A3A2A"/>
    <circle cx="672" cy="255" r="22" fill="#5A3A2A"/>
    <circle cx="521" cy="247" r="7" fill="#FFFFFF"/>
    <circle cx="665" cy="247" r="7" fill="#FFFFFF"/>
    <circle cx="534" cy="262" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="678" cy="262" r="3.5" fill="#FFFFFF" opacity="0.6"/>
  </g>
  <!-- brows -->
  <g fill="none" stroke="#B57D45" stroke-width="3" stroke-linecap="round">
    <path d="M505 205 Q530 195 550 205"/>
    <path d="M650 205 Q670 195 695 205"/>
  </g>
  <!-- cheeks -->
  <ellipse cx="470" cy="335" rx="36" ry="22" fill="#F2A48F" opacity="0.55"/>
  <ellipse cx="730" cy="335" rx="36" ry="22" fill="#F2A48F" opacity="0.55"/>

  <!-- ribbon -->
  <g fill="#E8735C">
    <polygon points="600,445 525,405 505,442 525,480"/>
    <polygon points="600,445 675,405 695,442 675,480"/>
    <circle cx="600" cy="445" r="17"/>
  </g>
  <ellipse cx="545" cy="430" rx="15" ry="7" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="655" cy="430" rx="15" ry="7" fill="#FFFFFF" opacity="0.35"/>
</svg>
