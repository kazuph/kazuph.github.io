<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8EEDC"/>
      <stop offset="100%" stop-color="#F0DFC2"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3A16A"/>
      <stop offset="100%" stop-color="#B5824A"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF1BF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFF1BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ED4EC"/>
      <stop offset="100%" stop-color="#5FB3D3"/>
    </linearGradient>
    <linearGradient id="tvGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7EC8E3" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7EC8E3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E29A78"/>
      <stop offset="50%" stop-color="#C97654"/>
      <stop offset="100%" stop-color="#E29A78"/>
    </linearGradient>
  </defs>

