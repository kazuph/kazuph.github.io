<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#EAF1F8"/><stop offset="100%" stop-color="#C9D6E3"/>
    </radialGradient>
    <marker id="mAx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#233044"/></marker>
    <marker id="mSt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#C0392B"/></marker>
    <marker id="mTh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2A6F97"/></marker>
    <marker id="mPh" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2E7D4F"/></marker>
    <style>
      .ttl { font-family: Helvetica, Arial, sans-serif; font-size: 26px; font-weight: bold; fill: #233044; }
      .eqn { font-size: 22px; fill: #7A8A9A; font-style: italic; }
      .lab { font-size: 22px; fill: #233044; font-style: italic; }
      .ket { font-size: 20px; fill: #233044; }
      .note { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #233044; }
    </style>
  </defs>
  <rect width="1200" height="900" fill="#FFFFFF"/>
  <text x="30" y="55" class="ttl">Bloch sphere representation of a qubit</text>
  <text x="30" y="100" class="eqn">|ψ⟩ = cos(θ/2) |0⟩ + e<tspan baseline-shift="super" font-size="14">iφ</tspan> sin(θ/2) |1⟩</text>

  <!-- sphere: centre (540,470), R=300 -->
  <circle cx="540" cy="470" r="300" fill="url(#ball)" stroke="#4A5A6A" stroke-width="1.8"/>
  <path d="M240 470 A300 90 0 0 0 840 470" fill="none" stroke="#7A8A9A" stroke-width="1.3" stroke-dasharray="6 6"/>
  <path d="M240 470 A300 90 0 0 1 840 470" fill="none" stroke="#7A8A9A" stroke-width="1.6"/>
  <path d="M540 170 A90 300 0 0 0 540 770" fill="none" stroke="#7A8A9A" stroke-width="1" stroke-dasharray="6 6"/>
  <path d="M540 170 A90 300 0 0 1 540 770" fill="none" stroke="#7A8A9A" stroke-width="1"/>

  <!-- axes -->
  <g stroke="#233044" stroke-width="2" fill="none" marker-end="url(#mAx)">
    <line x1="540" y1="470" x2="540" y2="80"/>
    <line x1="540" y1="470" x2="930" y2="470"/>
    <line x1="540" y1="470" x2="300" y2="680"/>
  </g>
  <g stroke="#233044" stroke-width="1.2" stroke-dasharray="5 5">
    <line x1="540" y1="470" x2="540" y2="770"/>
    <line x1="540" y1="470" x2="240" y2="470"/>
    <line x1="540" y1="470" x2="680" y2="350"/>
  </g>
  <text x="555" y="90" class="lab">z</text>
  <text x="940" y="480" class="lab">y</text>
  <text x="270" y="710" class="lab">x</text>
  <circle cx="540" cy="170" r="6" fill="#233044"/><text x="555" y="160" class="ket">|0⟩</text>
  <circle cx="540" cy="770" r="6" fill="#233044"/><text x="555" y="800" class="ket">|1⟩</text>
  <text x="340" y="700" class="ket" fill="#7A8A9A" font-size="17">|+⟩</text>
  <text x="790" y="455" class="ket" fill="#7A8A9A" font-size="17">|+i⟩</text>

  <!-- projections -->
  <g stroke="#8E44AD" stroke-width="1.6" stroke-dasharray="2 5" fill="none">
    <line x1="702" y1="298" x2="702" y2="512"/>
    <line x1="540" y1="470" x2="702" y2="512"/>
    <line x1="702" y1="512" x2="754" y2="472"/>
    <line x1="702" y1="512" x2="485" y2="512"/>
  </g>

  <!-- state vector -->
  <line x1="540" y1="470" x2="702" y2="298" stroke="#C0392B" stroke-width="3.5" marker-end="url(#mSt)"/>
  <circle cx="702" cy="298" r="9" fill="#C0392B"/>
  <text x="716" y="292" class="ket" fill="#C0392B" font-size="24">|ψ⟩</text>

  <!-- angles -->
  <path d="M540 340 A130 130 0 0 1 629 375" fill="none" stroke="#2A6F97" stroke-width="2.2" marker-end="url(#mTh)"/>
  <text x="570" y="322" class="lab" fill="#2A6F97">θ</text>
  <path d="M445 555 A128 60 0 0 0 662 489" fill="none" stroke="#2E7D4F" stroke-width="2.2" marker-end="url(#mPh)"/>
  <text x="548" y="590" class="lab" fill="#2E7D4F">φ</text>

  <!-- notes -->
  <g class="note">
    <text x="880" y="690">θ ∈ [0, π]: polar angle from |0⟩</text>
    <text x="880" y="715">φ ∈ [0, 2π): azimuth from x</text>
    <text x="880" y="740">pure states lie on the surface,</text>
    <text x="880" y="760">mixed states inside the ball</text>
    <line x1="880" y1="815" x2="930" y2="815" stroke="#C0392B" stroke-width="3.5"/><text x="940" y="820">state vector</text>
    <line x1="880" y1="845" x2="930" y2="845" stroke="#8E44AD" stroke-width="1.6" stroke-dasharray="2 5"/><text x="940" y="850">projection onto the xy plane</text>
  </g>
</svg>
