<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff9f2"/>
      <stop offset="60%" stop-color="#fceddb"/>
      <stop offset="100%" stop-color="#eed8c1"/>
    </radialGradient>

    <!-- Bear Fur Gradients -->
    <radialGradient id="furGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#deb078"/>
      <stop offset="70%" stop-color="#c48a4c"/>
      <stop offset="100%" stop-color="#aa6f32"/>
    </radialGradient>

    <radialGradient id="headGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#e2b680"/>
      <stop offset="75%" stop-color="#c68c4d"/>
      <stop offset="100%" stop-color="#a4692c"/>
    </radialGradient>

    <!-- Muzzle / Inner Ear Cream Gradients -->
    <radialGradient id="creamGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff4e0"/>
      <stop offset="85%" stop-color="#f3ddbe"/>
      <stop offset="100%" stop-color="#dfc5a0"/>
    </radialGradient>

    <!-- Ear Inner Pinkish Gradient -->
    <radialGradient id="earInnerGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fde0d7"/>
      <stop offset="85%" stop-color="#f0bba9"/>
      <stop offset="100%" stop-color="#dc9e89"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#734722" flood-opacity="0.18"/>
    </filter>
    <filter id="floorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="22"/>
    </filter>
    <filter id="patchShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#4a250a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Warm ambient background decoration -->
  <circle cx="200" cy="180" r="140" fill="#fff" opacity="0.4"/>
  <circle cx="1020" cy="240" r="180" fill="#fff" opacity="0.3"/>
  <circle cx="150" cy="720" r="100" fill="#fff" opacity="0.3"/>

  <!-- Floor Contact Shadow -->
  <ellipse cx="600" cy="815" rx="340" ry="48" fill="#805432" opacity="0.35" filter="url(#floorShadow)"/>
  <ellipse cx="600" cy="820" rx="260" ry="28" fill="#543015" opacity="0.45" filter="url(#floorShadow)"/>

  <!-- MAIN BEAR GROUP -->
  <g id="bear" filter="url(#shadow)">

    <!-- BACK LEGS / FEET (SITTING POSE) -->
    <!-- Left Foot & Leg -->
    <g id="left-leg">
      <ellipse cx="400" cy="740" rx="115" ry="85" fill="url(#furGrad)" transform="rotate(-10 400 740)"/>
      <!-- Felt Foot Pad (Big oval + 3 little toe ovals) -->
      <ellipse cx="385" cy="745" rx="75" ry="58" fill="url(#creamGrad)" transform="rotate(-10 385 745)"/>
      <ellipse cx="335" cy="690" rx="16" ry="14" fill="url(#creamGrad)" transform="rotate(-15 335 690)"/>
      <ellipse cx="370" cy="672" rx="17" ry="15" fill="url(#creamGrad)" transform="rotate(-5 370 672)"/>
      <ellipse cx="410" cy="670" rx="17" ry="15" fill="url(#creamGrad)" transform="rotate(5 410 670)"/>
      <!-- Pad Stitch details -->
      <ellipse cx="385" cy="745" rx="70" ry="53" fill="none" stroke="#be986f" stroke-width="2.5" stroke-dasharray="6,5" transform="rotate(-10 385 745)"/>
    </g>

    <!-- Right Foot & Leg -->
    <g id="right-leg">
      <ellipse cx="800" cy="740" rx="115" ry="85" fill="url(#furGrad)" transform="rotate(10 800 740)"/>
      <!-- Felt Foot Pad -->
      <ellipse cx="815" cy="745" rx="75" ry="58" fill="url(#creamGrad)" transform="rotate(10 815 745)"/>
      <ellipse cx="865" cy="690" rx="16" ry="14" fill="url(#creamGrad)" transform="rotate(15 865 690)"/>
      <ellipse cx="830" cy="672" rx="17" ry="15" fill="url(#creamGrad)" transform="rotate(5 830 672)"/>
      <ellipse cx="790" cy="670" rx="17" ry="15" fill="url(#creamGrad)" transform="rotate(-5 790 670)"/>
      <!-- Pad Stitch details -->
      <ellipse cx="815" cy="745" rx="70" ry="53" fill="none" stroke="#be986f" stroke-width="2.5" stroke-dasharray="6,5" transform="rotate(10 815 745)"/>
    </g>

    <!-- PLUSH ROUND BODY -->
    <g id="body">
      <!-- Outer plump torso -->
      <ellipse cx="600" cy="590" rx="230" ry="215" fill="url(#furGrad)"/>

      <!-- Center Seam (fabric plush line) -->
      <path d="M600,430 Q595,580 600,770" fill="none" stroke="#9e662c" stroke-width="3" stroke-dasharray="9,6" opacity="0.6"/>

      <!-- Soft Belly Oval Patch -->
      <ellipse cx="600" cy="620" rx="150" ry="140" fill="url(#creamGrad)"/>
      <ellipse cx="600" cy="620" rx="142" ry="132" fill="none" stroke="#be976d" stroke-width="2.5" stroke-dasharray="7,6"/>

      <!-- Stitched Chest Felt Heart Patch -->
      <g id="chest-patch" filter="url(#patchShadow)">
        <path d="M545,530 C545,505 520,495 500,515 C480,495 455,505 455,530 C455,560 500,585 500,600 C500,585 545,560 545,530 Z"
              fill="#e57373" transform="translate(100, -20) rotate(-8 500 540)"/>
        <path d="M540,530 C540,510 520,500 500,518 C480,500 460,510 460,530 C460,555 500,580 500,592 C500,580 540,555 540,530 Z"
              fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,3" transform="translate(100, -20) rotate(-8 500 540)"/>
        <!-- Patch Button in center -->
        <circle cx="600" cy="525" r="9" fill="#fff59d"/>
        <circle cx="597" cy="523" r="1.5" fill="#a07a2c"/>
        <circle cx="603" cy="523" r="1.5" fill="#a07a2c"/>
        <circle cx="597" cy="527" r="1.5" fill="#a07a2c"/>
        <circle cx="603" cy="527" r="1.5" fill="#a07a2c"/>
        <line x1="597" y1="523" x2="603" y2="527" stroke="#a07a2c" stroke-width="1"/>
        <line x1="603" y1="523" x2="597" y2="527" stroke="#a07a2c" stroke-width="1"/>
      </g>
    </g>

    <!-- ARMS (STUFFED & SHORT ROUNDED) -->
    <!-- Left Arm -->
    <g id="left-arm">
      <path d="M430,460 C320,500 270,580 320,650 C360,700 420,660 450,580 C465,540 455,480 430,460 Z" fill="url(#furGrad)"/>
      <!-- Paw pad circle -->
      <ellipse cx="335" cy="635" rx="36" ry="28" fill="url(#creamGrad)" transform="rotate(30 335 635)"/>
      <ellipse cx="335" cy="635" rx="32" ry="24" fill="none" stroke="#be986f" stroke-width="2" stroke-dasharray="5,4" transform="rotate(30 335 635)"/>
    </g>

    <!-- Right Arm -->
    <g id="right-arm">
      <path d="M770,460 C880,500 930,580 880,650 C840,700 780,660 750,580 C735,540 745,480 770,460 Z" fill="url(#furGrad)"/>
      <!-- Paw pad circle -->
      <ellipse cx="865" cy="635" rx="36" ry="28" fill="url(#creamGrad)" transform="rotate(-30 865 635)"/>
      <ellipse cx="865" cy="635" rx="32" ry="24" fill="none" stroke="#be986f" stroke-width="2" stroke-dasharray="5,4" transform="rotate(-30 865 635)"/>
    </g>

    <!-- EARS (ROUND & SYMMETRIC, LARGE) -->
    <!-- Left Ear -->
    <g id="left-ear">
      <circle cx="420" cy="230" r="95" fill="url(#headGrad)"/>
      <circle cx="420" cy="230" r="58" fill="url(#earInnerGrad)"/>
      <circle cx="420" cy="230" r="52" fill="none" stroke="#cfa190" stroke-width="2.5" stroke-dasharray="6,5"/>
    </g>

    <!-- Right Ear -->
    <g id="right-ear">
      <circle cx="780" cy="230" r="95" fill="url(#headGrad)"/>
      <circle cx="780" cy="230" r="58" fill="url(#earInnerGrad)"/>
      <circle cx="780" cy="230" r="52" fill="none" stroke="#cfa190" stroke-width="2.5" stroke-dasharray="6,5"/>
    </g>

    <!-- HEAD -->
    <g id="head">
      <!-- Big Round Plush Head -->
      <circle cx="600" cy="350" r="215" fill="url(#headGrad)"/>

      <!-- Cheeks Fluff (Subtle width & blush) -->
      <ellipse cx="440" cy="395" rx="55" ry="35" fill="#f8a5a5" opacity="0.38"/>
      <ellipse cx="760" cy="395" rx="55" ry="35" fill="#f8a5a5" opacity="0.38"/>

      <!-- Head Vertical Seam -->
      <path d="M600,135 Q602,230 600,320" fill="none" stroke="#9e662c" stroke-width="2.5" stroke-dasharray="7,5" opacity="0.5"/>

      <!-- MUZZLE (Cream Round Oval) -->
      <ellipse cx="600" cy="405" rx="105" ry="80" fill="url(#creamGrad)"/>
      <ellipse cx="600" cy="405" rx="98" ry="74" fill="none" stroke="#c49f75" stroke-width="2" stroke-dasharray="6,5"/>

      <!-- PLUSH BUTTON EYES (Glossy dark brown with highlights) -->
      <!-- Left Eye -->
      <g id="left-eye">
        <circle cx="510" cy="330" r="23" fill="#2d1709"/>
        <circle cx="503" cy="323" r="8" fill="#ffffff"/>
        <circle cx="517" cy="336" r="3.5" fill="#ffffff" opacity="0.8"/>
        <!-- Felt backing under eye -->
        <circle cx="510" cy="330" r="26" fill="none" stroke="#916035" stroke-width="2" stroke-dasharray="4,3"/>
      </g>

      <!-- Right Eye -->
      <g id="right-eye">
        <circle cx="690" cy="330" r="23" fill="#2d1709"/>
        <circle cx="683" cy="323" r="8" fill="#ffffff"/>
        <circle cx="697" cy="336" r="3.5" fill="#ffffff" opacity="0.8"/>
        <!-- Felt backing under eye -->
        <circle cx="690" cy="330" r="26" fill="none" stroke="#916035" stroke-width="2" stroke-dasharray="4,3"/>
      </g>

      <!-- NOSE & MOUTH -->
      <!-- Stitched Triangular Soft Nose -->
      <path d="M572,365 C585,360 615,360 628,365 C634,375 615,395 600,400 C585,395 566,375 572,365 Z" fill="#3b1d09"/>
      <ellipse cx="590" cy="370" rx="9" ry="4" fill="#6d4223" opacity="0.6"/>

      <!-- Embroidered Mouth Lines -->
      <path d="M600,400 L600,422" fill="none" stroke="#3b1d09" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M565,420 Q585,442 600,422 Q615,442 635,420" fill="none" stroke="#3b1d09" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Whiskers / Cute dots on muzzle -->
      <circle cx="545" cy="405" r="2.5" fill="#996b3f"/>
      <circle cx="535" cy="415" r="2.5" fill="#996b3f"/>
      <circle cx="548" cy="425" r="2.5" fill="#996b3f"/>
      <circle cx="655" cy="405" r="2.5" fill="#996b3f"/>
      <circle cx="665" cy="415" r="2.5" fill="#996b3f"/>
      <circle cx="652" cy="425" r="2.5" fill="#996b3f"/>
    </g>

    <!-- NECK BOW / RIBBON -->
    <g id="bow" filter="url(#patchShadow)">
      <!-- Ribbon Center Knot -->
      <ellipse cx="600" cy="468" rx="20" ry="17" fill="#d32f2f"/>
      <!-- Left Loop -->
      <path d="M600,468 C560,430 480,420 500,470 C515,510 575,485 600,468 Z" fill="#e53935"/>
      <path d="M520,460 C535,450 560,455 580,465" fill="none" stroke="#ffcdd2" stroke-width="2.5"/>
      <!-- Right Loop -->
      <path d="M600,468 C640,430 720,420 700,470 C685,510 625,485 600,468 Z" fill="#e53935"/>
      <path d="M680,460 C665,450 640,455 620,465" fill="none" stroke="#ffcdd2" stroke-width="2.5"/>
      <!-- Tails -->
      <path d="M592,478 Q570,520 550,550 L575,545 Q595,510 600,482 Z" fill="#c62828"/>
      <path d="M608,478 Q630,520 650,550 L625,545 Q605,510 600,482 Z" fill="#c62828"/>
    </g>

  </g>
</svg>
