<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background & Lifeline Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Client Header -->
    <linearGradient id="clientGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Gateway Header -->
    <linearGradient id="gwGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>

    <!-- IdP Header -->
    <linearGradient id="idpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Resource Server Header -->
    <linearGradient id="rsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowExchange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706"/>
    </marker>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>
  <rect x="40" y="25" width="1120" height="850" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title & Subtitle -->
  <text x="600" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">Zero Trust アーキテクチャにおけるトークン交換シーケンス</text>
  <text x="600" y="92" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#64748b" text-anchor="middle">RFC 8693 OAuth 2.0 Token Exchange &amp; Least-Privilege Downstream Delegation</text>

  <!-- Lifeline Columns: X positions = 180, 460, 740, 1020 -->
  <!-- Vertical Lifeline Dashed Guides -->
  <line x1="180" y1="170" x2="180" y2="800" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,6"/>
  <line x1="460" y1="170" x2="460" y2="800" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,6"/>
  <line x1="740" y1="170" x2="740" y2="800" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,6"/>
  <line x1="1020" y1="170" x2="1020" y2="800" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6,6"/>

  <!-- PARTICIPANT HEADER BOXES (Top) -->
  <!-- 1. Client -->
  <g transform="translate(100, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="url(#clientGrad)" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Client</text>
    <text x="80" y="44" font-family="sans-serif" font-size="11" fill="#0284c7" text-anchor="middle">User / Web App</text>
  </g>

  <!-- 2. API Gateway -->
  <g transform="translate(380, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="url(#gwGrad)" stroke="#9333ea" stroke-width="2"/>
    <text x="80" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#6b21a8" text-anchor="middle">API Gateway</text>
    <text x="80" y="44" font-family="sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle">PEP / Edge Proxy</text>
  </g>

  <!-- 3. Identity Provider (IdP) -->
  <g transform="translate(660, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="url(#idpGrad)" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Identity Provider (IdP)</text>
    <text x="80" y="44" font-family="sans-serif" font-size="11" fill="#b45309" text-anchor="middle">OAuth 2.0 Auth / STS</text>
  </g>

  <!-- 4. Resource Server -->
  <g transform="translate(940, 115)" filter="url(#shadow)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="url(#rsGrad)" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="26" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Resource Server</text>
    <text x="80" y="44" font-family="sans-serif" font-size="11" fill="#166534" text-anchor="middle">Backend Service</text>
  </g>

  <!-- ACTIVATION BARS ON LIFELINES -->
  <!-- Client -->
  <rect x="174" y="210" width="12" height="560" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  <!-- API Gateway -->
  <rect x="454" y="340" width="12" height="420" rx="2" fill="#e9d5ff" stroke="#9333ea" stroke-width="1.5"/>
  <!-- IdP -->
  <rect x="734" y="210" width="12" height="85" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <rect x="734" y="415" width="12" height="95" rx="2" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <!-- Resource Server -->
  <rect x="1014" y="580" width="12" height="110" rx="2" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>

  <!-- ==================== SEQUENCE STEPS 1 TO 8 ==================== -->

  <!-- STEP 1: Client -> IdP (Authentication & Token Request) -->
  <!-- Y = 225 -->
  <line x1="186" y1="225" x2="734" y2="225" stroke="#0f172a" stroke-width="2" marker-end="url(#arrowSolid)"/>
  <rect x="230" y="208" width="460" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="460" y="224" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    1. ユーザー認証 &amp; トークン要求 (POST /oauth/v2/token grant_type=authorization_code)
  </text>

  <!-- STEP 2: IdP -> Client (Subject Token Issued) -->
  <!-- Y = 285 -->
  <line x1="734" y1="285" x2="186" y2="285" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <rect x="250" y="268" width="420" height="24" rx="4" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="460" y="284" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#854d0e" text-anchor="middle">
    2. 200 OK: ユーザーサブジェクトトークン発行 (JWT: aud=api-gateway, sub=user123)
  </text>

  <!-- STEP 3: Client -> API Gateway (Protected Resource Request) -->
  <!-- Y = 355 -->
  <line x1="186" y1="355" x2="454" y2="355" stroke="#0f172a" stroke-width="2.2" marker-end="url(#arrowSolid)"/>
  <rect x="205" y="338" width="230" height="24" rx="4" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="320" y="354" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">
    3. GET /api/v1/orders (Bearer JWT)
  </text>

  <!-- STEP 4: API Gateway -> IdP (Token Exchange Request - RFC 8693) -->
  <!-- Y = 430 -->
  <line x1="466" y1="430" x2="734" y2="430" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrowExchange)"/>
  <rect x="490" y="413" width="220" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="600" y="430" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">
    4. トークン交換要求 (RFC 8693)
  </text>
  <text x="600" y="448" font-family="sans-serif" font-size="10" fill="#92400e" text-anchor="middle">
    POST /token (grant_type=token-exchange, aud=orders-service)
  </text>

  <!-- STEP 5: IdP -> API Gateway (Downstream Down-scoped Token Issued) -->
  <!-- Y = 500 -->
  <line x1="734" y1="500" x2="466" y2="500" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowExchange)"/>
  <rect x="480" y="483" width="240" height="26" rx="4" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/>
  <text x="600" y="500" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">
    5. 200 OK: 権限縮小内部トークン発行
  </text>
  <text x="600" y="518" font-family="sans-serif" font-size="10" fill="#92400e" text-anchor="middle">
    Down-scoped JWT: aud=orders-service, scope=orders:read
  </text>

  <!-- STEP 6: API Gateway -> Resource Server (Access Internal Resource) -->
  <!-- Y = 595 -->
  <line x1="466" y1="595" x2="1014" y2="595" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <rect x="580" y="578" width="320" height="26" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="740" y="595" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">
    6. GET /orders (Bearer Internal-JWT + mTLS)
  </text>

  <!-- STEP 7: Resource Server -> API Gateway (Return Protected Data) -->
  <!-- Y = 680 -->
  <line x1="1014" y1="680" x2="466" y2="680" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <rect x="580" y="663" width="320" height="26" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="740" y="680" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">
    7. 200 OK: トークン検証成功 &amp; 注文データ返却
  </text>

  <!-- STEP 8: API Gateway -> Client (Forward Filtered Response) -->
  <!-- Y = 755 -->
  <line x1="454" y1="755" x2="186" y2="755" stroke="#0f172a" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <rect x="230" y="738" width="200" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="330" y="754" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    8. 200 OK: 応答データ転送
  </text>

  <!-- Zero Trust Principles Callout Box (Bottom) -->
  <g transform="translate(100, 810)">
    <rect x="0" y="0" width="1000" height="50" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="500" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
      ゼロトラスト原則の適用：Never Trust, Always Verify &amp; Least Privilege Delegation
    </text>
    <text x="500" y="40" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">
      クライアントの外部トークンを内部サービスに直接透過させず、API Gatewayが対象リソース専用の最小権限トークンへ安全に交換する
    </text>
  </g>
</svg>
