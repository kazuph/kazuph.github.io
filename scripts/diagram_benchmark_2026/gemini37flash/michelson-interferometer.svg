<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Laser Beam Glow -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-split1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f87171"/>
    </marker>
    <marker id="arr-interfere" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#fb7185"/>
    </marker>

    <!-- Metal Mirror Gradients -->
    <linearGradient id="mirror-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="splitter-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.15"/>
    </linearGradient>

    <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg-grad)"/>

  <!-- Title Header -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="600" y="65" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="1">Michelson Interferometer</text>
    <text x="600" y="98" font-size="16" fill="#94a3b8">Optical Wave Amplitude Splitting &amp; Phase Interference Geometry</text>
  </g>

  <!-- Central Optical Core: Beam Splitter at (600, 420) -->
  <g id="optical-system">

    <!-- 1. OPTICAL AXES (Symmetric Cross Baseline) -->
    <line x1="120" y1="420" x2="1020" y2="420" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
    <line x1="600" y1="120" x2="600" y2="760" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>

    <!-- 2. LASER SOURCE (Left at x=140, y=420) -->
    <g transform="translate(130, 370)" filter="url(#box-shadow)">
      <rect width="130" height="100" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <rect x="130" y="35" width="20" height="30" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
      <circle cx="150" cy="50" r="6" fill="#ef4444"/>
      <text x="65" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">Laser Source</text>
      <text x="65" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#fca5a5" text-anchor="middle">(λ = 632.8 nm)</text>
    </g>

    <!-- 3. BEAM SPLITTER (Center at x=600, y=420, angled at 45 degrees) -->
    <g transform="translate(600, 420)">
      <!-- 45-degree angled glass plate -->
      <g transform="rotate(45)">
        <rect x="-85" y="-9" width="170" height="18" rx="3" fill="url(#splitter-glass)" stroke="#38bdf8" stroke-width="2"/>
        <!-- Semi-reflective Coating layer (Center line) -->
        <line x1="-85" y1="0" x2="85" y2="0" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="4,2"/>
      </g>
      <!-- Beam Splitter Mount Base -->
      <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    </g>

    <!-- Compensator Plate (in Path 1 towards Mirror B for exact optical path equalization) -->
    <g transform="translate(740, 420) rotate(45)">
      <rect x="-50" y="-7" width="100" height="14" rx="2" fill="url(#splitter-glass)" stroke="#0284c7" stroke-width="1.5"/>
    </g>
    <text x="740" y="340" font-family="system-ui, sans-serif" font-size="13" fill="#7dd3fc" text-anchor="middle">Compensator Plate</text>
    <line x1="740" y1="348" x2="740" y2="395" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- 4. MIRROR A (Fixed Mirror, Top at x=600, y=170) -->
    <g transform="translate(480, 150)" filter="url(#box-shadow)">
      <!-- Mount Bracket -->
      <rect x="80" y="-15" width="80" height="15" fill="#475569" stroke="#334155" stroke-width="1.5"/>
      <!-- Mirror Substrate -->
      <rect x="40" y="0" width="160" height="24" rx="3" fill="url(#mirror-grad)" stroke="#334155" stroke-width="2"/>
      <!-- Reflective Front Surface (Bottom side facing down) -->
      <line x1="40" y1="24" x2="200" y2="24" stroke="#38bdf8" stroke-width="3"/>
    </g>
    <!-- Mirror A Callout Box -->
    <g transform="translate(690, 140)">
      <rect width="180" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="90" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8" text-anchor="middle">Mirror M₁ (Fixed)</text>
      <text x="90" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Reference Arm Length: L₁</text>
    </g>

    <!-- 5. MIRROR B (Movable Mirror, Right at x=980, y=420) -->
    <g transform="translate(970, 340)" filter="url(#box-shadow)">
      <!-- Translation Stage / Micrometer Screw -->
      <rect x="24" y="50" width="40" height="60" fill="#475569" stroke="#334155" stroke-width="1.5"/>
      <line x1="64" y1="80" x2="84" y2="80" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
      <!-- Mirror Substrate (Vertical) -->
      <rect x="0" y="0" width="24" height="160" rx="3" fill="url(#mirror-grad)" stroke="#334155" stroke-width="2"/>
      <!-- Reflective Front Surface (Left side facing beam splitter) -->
      <line x1="0" y1="0" x2="0" y2="160" stroke="#fbbf24" stroke-width="3"/>
      <!-- Motion Arrows (Δd) -->
      <path d="M 12 185 L -20 185 M -12 180 L -24 185 L -12 190 M 2 180 L 14 185 L 2 190" stroke="#fbbf24" stroke-width="2" fill="none"/>
      <text x="-4" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">±Δd (Movable)</text>
    </g>
    <!-- Mirror B Callout Box -->
    <g transform="translate(930, 260)">
      <rect width="190" height="50" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="95" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fbbf24" text-anchor="middle">Mirror M₂ (Movable)</text>
      <text x="95" y="42" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Test Arm Length: L₂ = L₁ ± Δd</text>
    </g>

    <!-- 6. DETECTOR & SCREEN (Bottom at x=600, y=700) -->
    <g transform="translate(480, 680)" filter="url(#box-shadow)">
      <!-- Observation Screen -->
      <rect width="240" height="30" rx="4" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
      <!-- Interference Fringes on Screen -->
      <g transform="translate(120, 15)">
        <ellipse cx="0" cy="0" rx="75" ry="9" fill="#220505"/>
        <!-- Ring Pattern (Interference Rings) -->
        <circle cx="0" cy="0" r="7" fill="#ef4444"/>
        <ellipse cx="0" cy="0" rx="20" ry="4" fill="none" stroke="#ef4444" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="36" ry="6" fill="none" stroke="#ef4444" stroke-width="2"/>
        <ellipse cx="0" cy="0" rx="55" ry="7.5" fill="none" stroke="#ef4444" stroke-width="1.5"/>
      </g>
      <!-- Detector Photodiode / Eye -->
      <rect x="80" y="30" width="80" height="20" fill="#334155"/>
      <text x="120" y="70" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Detector / Screen</text>
      <text x="120" y="88" font-family="system-ui, sans-serif" font-size="12" fill="#fda4af" text-anchor="middle">Circular Interference Rings</text>
    </g>

    <!-- 7. LIGHT BEAM PATHS (With Glowing Red Lines and Arrows) -->
    <g filter="url(#laser-glow)">
      <!-- Incoming Beam: Laser (280, 420) -> Splitter (600, 420) -->
      <line x1="280" y1="420" x2="590" y2="420" stroke="#ef4444" stroke-width="3.5"/>
      <line x1="380" y1="420" x2="480" y2="420" stroke="#ef4444" stroke-width="3.5" marker-end="url(#arr-red)"/>

      <!-- Arm 1 (Up): Splitter (600, 420) -> Mirror M1 (600, 175) (Reflected upwards by 50% coating) -->
      <line x1="600" y1="415" x2="600" y2="175" stroke="#f87171" stroke-width="3"/>
      <line x1="600" y1="360" x2="600" y2="260" stroke="#f87171" stroke-width="3" marker-end="url(#arr-split1)"/>

      <!-- Arm 1 Return (Down): Mirror M1 (600, 175) -> Splitter (600, 420) -->
      <line x1="603" y1="175" x2="603" y2="415" stroke="#f87171" stroke-width="2.5"/>
      <line x1="603" y1="230" x2="603" y2="330" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-split1)"/>

      <!-- Arm 2 (Right): Splitter (600, 420) -> Mirror M2 (970, 420) (Transmitted through 50% coating) -->
      <line x1="605" y1="420" x2="970" y2="420" stroke="#f87171" stroke-width="3"/>
      <line x1="680" y1="420" x2="820" y2="420" stroke="#f87171" stroke-width="3" marker-end="url(#arr-split1)"/>

      <!-- Arm 2 Return (Left): Mirror M2 (970, 420) -> Splitter (600, 420) -->
      <line x1="970" y1="423" x2="605" y2="423" stroke="#f87171" stroke-width="2.5"/>
      <line x1="880" y1="423" x2="780" y2="423" stroke="#f87171" stroke-width="2.5" marker-end="url(#arr-split1)"/>

      <!-- Recombined Beam to Detector (Down): Splitter (600, 420) -> Detector (600, 680) -->
      <line x1="600" y1="425" x2="600" y2="680" stroke="#fb7185" stroke-width="4.5"/>
      <line x1="600" y1="500" x2="600" y2="610" stroke="#fb7185" stroke-width="4.5" marker-end="url(#arr-interfere)"/>
    </g>

    <!-- Beam Splitter Label Badge -->
    <g transform="translate(420, 310)">
      <rect width="160" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="80" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">Beam Splitter (BS)</text>
      <text x="80" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">50 / 50 Semi-silvered</text>
      <line x1="120" y1="50" x2="160" y2="90" stroke="#38bdf8" stroke-width="1.2"/>
    </g>

    <!-- Optical Path Difference Equation Badge (Bottom Left) -->
    <g transform="translate(100, 680)" font-family="system-ui, sans-serif">
      <rect width="320" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <text x="20" y="28" font-size="15" font-weight="700" fill="#f8fafc">Interference Condition:</text>
      <text x="20" y="54" font-size="14" fill="#fb7185">Δ = 2(L₁ - L₂) = m·λ (Constructive)</text>
      <text x="20" y="78" font-size="14" fill="#94a3b8">Δ = 2(L₁ - L₂) = (m + ½)·λ (Destructive)</text>
    </g>

  </g>
</svg>
