<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Wall & Floor Gradients -->
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <linearGradient id="floor-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.6"/>
    </linearGradient>

    <!-- VR Goggle Cyber Glow -->
    <linearGradient id="vr-screen-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Motion Lines Filter -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.2"/>
    </filter>

    <filter id="vr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. ROOM BACKGROUND -->
  <!-- Walls -->
  <rect width="1200" height="640" fill="url(#wall-grad)"/>
  <!-- Hardwood Floor -->
  <rect y="640" width="1200" height="260" fill="#fde68a"/>
  <rect y="640" width="1200" height="260" fill="url(#floor-grad)"/>
  <!-- Baseboard -->
  <rect y="632" width="1200" height="12" fill="#cbd5e1"/>
  <!-- Floorboard lines -->
  <line x1="0" y1="710" x2="1200" y2="710" stroke="#92400e" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="780" x2="1200" y2="780" stroke="#92400e" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="850" x2="1200" y2="850" stroke="#92400e" stroke-width="1" opacity="0.3"/>

  <!-- 2. BEDROOM FURNITURE & DECOR -->

  <!-- Window (Top Right) -->
  <g transform="translate(820, 80)">
    <rect width="260" height="220" rx="4" fill="#bae6fd" stroke="#ffffff" stroke-width="8"/>
    <ellipse cx="130" cy="210" rx="100" ry="30" fill="#86efac"/>
    <line x1="130" y1="0" x2="130" y2="220" stroke="#ffffff" stroke-width="6"/>
    <line x1="0" y1="110" x2="260" y2="110" stroke="#ffffff" stroke-width="6"/>
    <!-- Blue Curtains -->
    <path d="M -15 -5 Q 10 100 -5 230 L -25 230 L -25 -5 Z" fill="#93c5fd"/>
    <path d="M 275 -5 Q 250 100 265 230 L 285 230 L 285 -5 Z" fill="#93c5fd"/>
  </g>

  <!-- Study Desk & Gaming PC (Right Side) -->
  <g transform="translate(860, 420)" filter="url(#soft-shadow)">
    <!-- Desk Wooden Surface -->
    <rect x="0" y="80" width="280" height="150" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="70" width="280" height="20" rx="2" fill="#cbd5e1"/>
    <!-- Gaming PC Case (RGB lit) -->
    <rect x="200" y="-30" width="60" height="100" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <line x1="210" y1="-10" x2="210" y2="50" stroke="#a855f7" stroke-width="3"/>
    <line x1="220" y1="-10" x2="220" y2="50" stroke="#38bdf8" stroke-width="3"/>
    <!-- Curved Monitor -->
    <rect x="40" y="-40" width="130" height="90" rx="6" fill="#0f172a" stroke="#475569" stroke-width="3"/>
    <rect x="46" y="-34" width="118" height="74" rx="3" fill="#1e1b4b"/>
    <!-- Monitor Stand -->
    <rect x="95" y="50" width="20" height="25" fill="#475569"/>
    <ellipse cx="105" cy="75" rx="30" ry="6" fill="#334155"/>
    <!-- Gaming Chair (Edge) -->
    <rect x="30" y="110" width="70" height="120" rx="6" fill="#dc2626" opacity="0.8"/>
  </g>

  <!-- Bookshelf & Posters (Left/Center Wall) -->
  <!-- Sci-Fi / Robot Game Poster on Wall -->
  <g transform="translate(420, 100)" filter="url(#soft-shadow)">
    <rect width="140" height="190" rx="4" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="70" cy="80" r="35" fill="#f43f5e" opacity="0.7"/>
    <polygon points="70,40 95,110 45,110" fill="#38bdf8"/>
    <text x="70" y="155" font-family="sans-serif" font-size="14" font-weight="900" fill="#facc15" text-anchor="middle">CYBER 2088</text>
  </g>

  <!-- Bookshelf with Manga & Robot Figurine -->
  <g transform="translate(280, 240)" filter="url(#soft-shadow)">
    <rect width="110" height="18" fill="#b45309"/>
    <!-- Books on Shelf -->
    <rect x="10" y="-40" width="10" height="40" fill="#ef4444"/>
    <rect x="22" y="-45" width="12" height="45" fill="#3b82f6"/>
    <rect x="36" y="-38" width="10" height="38" fill="#10b981"/>
    <rect x="48" y="-42" width="12" height="42" fill="#f59e0b"/>
    <!-- Small Toy Robot Figurine -->
    <rect x="75" y="-35" width="18" height="25" fill="#94a3b8"/>
    <circle cx="84" cy="-40" r="7" fill="#cbd5e1"/>
    <rect x="78" y="-42" width="12" height="4" fill="#06b6d4"/>
  </g>

  <!-- Bed Corner (Far Left Background) -->
  <g transform="translate(200, 520)" filter="url(#soft-shadow)">
    <rect width="180" height="130" rx="6" fill="#3b82f6"/>
    <!-- Pillow -->
    <ellipse cx="60" cy="40" rx="40" ry="25" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Blanket Fold -->
    <path d="M 0 60 Q 90 70 180 50 L 180 130 L 0 130 Z" fill="#60a5fa"/>
  </g>

  <!-- 3. DOORWAY & MOTHER (Left Side: x=0 to 180) -->
  <g id="doorway-and-mother">
    <!-- Door Frame (Open Door perspective) -->
    <rect x="0" y="80" width="150" height="600" fill="#475569" opacity="0.15"/>
    <line x1="150" y1="80" x2="150" y2="680" stroke="#78350f" stroke-width="8"/>
    <line x1="0" y1="80" x2="150" y2="80" stroke="#78350f" stroke-width="8"/>
    <!-- Open Door Leaf swung out -->
    <polygon points="0,60 40,90 40,690 0,720" fill="#92400e" stroke="#78350f" stroke-width="3"/>

    <!-- MOTHER (Standing in doorway, looking right with warm/gentle smile) -->
    <g transform="translate(60, 310)" filter="url(#soft-shadow)">
      <!-- Apron & Dress -->
      <!-- Dress (Soft Lavender) -->
      <path d="M 40 180 L 10 370 L 80 370 L 60 180 Z" fill="#a855f7"/>
      <!-- Beige Apron over Dress -->
      <path d="M 35 210 L 20 370 L 75 370 L 60 210 Z" fill="#fef08a" stroke="#facc15" stroke-width="1"/>
      <path d="M 38 210 L 45 185 M 57 210 L 52 185" stroke="#facc15" stroke-width="2"/> <!-- Apron Straps -->

      <!-- Slippers -->
      <ellipse cx="25" cy="375" rx="14" ry="7" fill="#ec4899"/>
      <ellipse cx="65" cy="375" rx="14" ry="7" fill="#ec4899"/>

      <!-- Hand holding tea towel or leaning against doorway -->
      <!-- Left arm resting on doorframe -->
      <path d="M 38 185 Q 75 220 85 200" fill="none" stroke="#fed7aa" stroke-width="10" stroke-linecap="round"/>
      <circle cx="88" cy="198" r="8" fill="#fed7aa"/>
      <rect x="84" y="200" width="16" height="24" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/> <!-- Dishcloth -->

      <!-- Mother's Head & Face (Profile looking right towards Son) -->
      <!-- Brown Hair (Soft low bun) -->
      <circle cx="36" cy="125" r="22" fill="#582f0e"/>
      <circle cx="22" cy="132" r="14" fill="#582f0e"/>
      <path d="M 28 110 Q 52 110 54 135 Q 40 145 30 140 Z" fill="#582f0e"/>

      <!-- Face -->
      <circle cx="48" cy="135" r="18" fill="#fed7aa"/>
      <!-- Soft smile & gentle eyes looking at son -->
      <path d="M 54 132 Q 58 128 62 132" fill="none" stroke="#582f0e" stroke-width="2" stroke-linecap="round"/>
      <path d="M 52 142 Q 58 147 62 142" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
      <!-- Rosy cheek -->
      <ellipse cx="54" cy="138" rx="5" ry="3" fill="#f43f5e" opacity="0.5"/>

      <!-- Speech / Thought Bubble (Subtle gentle curiosity) -->
      <g transform="translate(70, 40)">
        <rect width="110" height="42" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
        <polygon points="10,42 0,55 25,42" fill="#ffffff"/>
        <text x="55" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">楽しそうね…</text>
      </g>
    </g>

    <!-- Sightline Ray from Mother to Son (Warm gentle dotted line) -->
    <path d="M 125, 445 Q 360, 420 540, 450" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6"/>
  </g>

  <!-- 4. SON PLAYING IN VR (Center Room: x=580, y=360) -->
  <g id="vr-son" filter="url(#soft-shadow)">

    <!-- Ground Shadow of dynamic pose -->
    <ellipse cx="580" cy="740" rx="110" ry="24" fill="#1e293b" opacity="0.3"/>

    <!-- Dynamic Legs (Action Pose: bent knees, energetic movement) -->
    <!-- Left Leg (Lunge Forward) -->
    <path d="M 550 540 L 520 640 L 490 730" fill="none" stroke="#1e3a8a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Left Sneaker -->
    <ellipse cx="480" cy="735" rx="26" ry="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="475" cy="733" rx="10" ry="6" fill="#ef4444"/>

    <!-- Right Leg (Back Stance) -->
    <path d="M 585 540 L 630 630 L 660 725" fill="none" stroke="#1e3a8a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Sneaker -->
    <ellipse cx="670" cy="730" rx="26" ry="12" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="675" cy="728" rx="10" ry="6" fill="#ef4444"/>

    <!-- Torso (Dynamic leaning forward) -->
    <!-- Yellow/Orange Hoodie -->
    <path d="M 530 450 L 600 450 L 610 560 L 530 555 Z" fill="#f97316"/>
    <!-- Hoodie Pocket -->
    <path d="M 545 520 L 590 520 L 585 550 L 550 550 Z" fill="#ea580c"/>

    <!-- Head & VR Headset -->
    <!-- Neck -->
    <rect x="555" y="420" width="20" height="35" fill="#fed7aa"/>
    <!-- Boy's Hair (Black energetic spikes) -->
    <path d="M 535 410 Q 565 350 600 395 Q 610 415 595 435 Q 540 435 535 410 Z" fill="#1e293b"/>
    <!-- Ear -->
    <circle cx="545" cy="415" r="7" fill="#fed7aa"/>

    <!-- VR GOGGLES (High-tech Headset with Glowing Blue Visor) -->
    <g transform="translate(565, 395)">
      <!-- Headset Strap -->
      <path d="M -25 15 Q -10 0 25 10" fill="none" stroke="#334155" stroke-width="8"/>
      <!-- Main Visor Body -->
      <rect x="0" y="0" width="48" height="32" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#vr-glow)"/>
      <!-- Glowing Cyber Screen Front -->
      <rect x="18" y="5" width="26" height="22" rx="4" fill="url(#vr-screen-glow)"/>
      <line x1="22" y1="16" x2="40" y2="16" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Open Smiling Mouth below VR visor -->
    <path d="M 570 435 Q 582 445 592 435 Z" fill="#dc2626"/>

    <!-- ARMS & CONTROLLERS (Immersed gameplay gestures) -->
    <!-- Left Arm: Thrusting controller forward-up -->
    <g>
      <path d="M 535 460 Q 480 430 460 380" fill="none" stroke="#f97316" stroke-width="20" stroke-linecap="round"/>
      <circle cx="455" cy="370" r="10" fill="#fed7aa"/> <!-- Hand -->
      <!-- VR Controller Left -->
      <g transform="translate(450, 360) rotate(-30)">
        <rect x="-4" y="0" width="8" height="24" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="0" cy="-2" r="10" fill="none" stroke="#38bdf8" stroke-width="2.5"/> <!-- Tracking Ring -->
        <circle cx="0" cy="-2" r="3" fill="#38bdf8"/>
      </g>
    </g>

    <!-- Right Arm: Aiming controller to the right -->
    <g>
      <path d="M 595 465 Q 670 450 710 420" fill="none" stroke="#f97316" stroke-width="20" stroke-linecap="round"/>
      <circle cx="715" cy="415" r="10" fill="#fed7aa"/> <!-- Hand -->
      <!-- VR Controller Right -->
      <g transform="translate(720, 410) rotate(45)">
        <rect x="-4" y="0" width="8" height="24" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
        <circle cx="0" cy="-2" r="10" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="0" cy="-2" r="3" fill="#38bdf8"/>
      </g>
    </g>

    <!-- VR Virtual Action Motion Trails / Sci-Fi Effects -->
    <g opacity="0.7">
      <path d="M 430 340 L 410 320 M 440 330 L 420 310" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 740 400 L 770 390 M 735 420 L 765 410" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="430" cy="330" r="3" fill="#a855f7"/>
      <circle cx="760" cy="400" r="3" fill="#a855f7"/>
    </g>

  </g>

</svg>
