name: Apply reviewed yomiyasu edits (temporary)

on:
  push:
    branches: [chore/yomiyasu-20261001]
    paths:
      - '.github/workflows/yomiyasu-apply.yml'
      - 'scripts/yomiyasu/edit_posts.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'kazuph/kazuph.github.io' && github.ref == 'refs/heads/chore/yomiyasu-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/yomiyasu-20261001
      - name: Fetch the reviewed skill version
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/yomiyasu-skill"
          git -C "$RUNNER_TEMP/yomiyasu-skill" remote add origin https://github.com/nanaism/yomiyasu.git
          git -C "$RUNNER_TEMP/yomiyasu-skill" fetch --depth 1 origin f03aecd9c4c4a69e229f3848ecba66c3871f734c
          git -C "$RUNNER_TEMP/yomiyasu-skill" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/yomiyasu-skill" rev-parse HEAD)" = f03aecd9c4c4a69e229f3848ecba66c3871f734c
      - name: Apply reviewed edits and verify protected content
        run: python3 scripts/yomiyasu/edit_posts.py --apply --report-dir "$RUNNER_TEMP/editorial-audit"
      - name: Run the original lint and diff tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editorial-audit/lint-before" "$RUNNER_TEMP/editorial-audit/lint-after" "$RUNNER_TEMP/editorial-audit/diff"
          for file in "$RUNNER_TEMP/editorial-audit/before/"*; do
            name=$(basename "$file")
            python3 "$RUNNER_TEMP/yomiyasu-skill/scripts/yomiyasu_lint.py" "$file" --json > "$RUNNER_TEMP/editorial-audit/lint-before/$name.json"
            python3 "$RUNNER_TEMP/yomiyasu-skill/scripts/yomiyasu_lint.py" "$RUNNER_TEMP/editorial-audit/after/$name" --json > "$RUNNER_TEMP/editorial-audit/lint-after/$name.json"
            python3 "$RUNNER_TEMP/yomiyasu-skill/scripts/yomiyasu_diff.py" "$file" "$RUNNER_TEMP/editorial-audit/after/$name" > "$RUNNER_TEMP/editorial-audit/diff/$name.txt"
          done
          git diff --check
          git diff --stat > "$RUNNER_TEMP/editorial-audit/diff-stat.txt"
      - name: Commit only reviewed posts to the working branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = chore/yomiyasu-20261001
          git add -- _posts
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: apply yomiyasu to AI prose in 19 posts; preserve human text and evidence'
          git push origin HEAD:refs/heads/chore/yomiyasu-20261001
      - name: Package audit inputs and original skill
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/editorial-audit/skill"
          cp -R "$RUNNER_TEMP/yomiyasu-skill/SKILL.md" "$RUNNER_TEMP/yomiyasu-skill/references" "$RUNNER_TEMP/yomiyasu-skill/scripts" "$RUNNER_TEMP/yomiyasu-skill/LICENSE" "$RUNNER_TEMP/editorial-audit/skill/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yomiyasu-audit
          path: ${{ runner.temp }}/editorial-audit
          retention-days: 7
